name: ADM-14 Studio Media Pool Gate

on:
  push:
    branches:
      - agent/adm14-media-pool

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Integrate canonical media pool
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['dependencies']['@ankhorage/contracts'] = '^7.6.0'
          package['dependencies']['@ankhorage/runtime'] = '^1.1.0'
          package['dependencies']['@ankhorage/zora'] = '^2.13.0'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          props_path = Path('src/propertiesAuthoringModel.ts')
          props = props_path.read_text()
          props = props.replace(
              "import type { UiNode } from '@ankhorage/contracts';",
              "import type { MediaAssetKind, MediaAssetReference, UiNode } from '@ankhorage/contracts';",
          )
          props = props.replace(
              "  readonly enum?: readonly (string | number)[];\n",
              "  readonly enum?: readonly (string | number)[];\n  readonly mediaKinds?: readonly MediaAssetKind[];\n",
          )
          props = props.replace(
              "  'text' | 'number' | 'boolean' | 'choice' | 'unsupported';",
              "  'text' | 'number' | 'boolean' | 'choice' | 'media' | 'unsupported';",
          )
          props = props.replace(
              "  readonly options: readonly (string | number)[];\n",
              "  readonly options: readonly (string | number)[];\n  readonly mediaKinds?: readonly MediaAssetKind[];\n",
          )
          props = props.replace(
              "export type StudioInstancePropertyValue = string | number | boolean;",
              "export type StudioInstancePropertyValue = string | number | boolean | MediaAssetReference;",
          )
          props = props.replace(
              "        options: schema.enum ?? [],\n        value:",
              "        options: schema.enum ?? [],\n        ...(schema.mediaKinds ? { mediaKinds: schema.mediaKinds } : {}),\n        value:",
          )
          props = props.replace(
              "  if (schema.type === 'boolean') return 'boolean';\n",
              "  if (schema.type === 'boolean') return 'boolean';\n  if (schema.type === 'media') return 'media';\n",
          )
          props_path.write_text(props)

          index_path = Path('src/index.ts')
          index = index_path.read_text()
          index = index.replace(
              "  NavigatorType,\n  ThemeConfig,",
              "  NavigatorType,\n  MediaAsset,\n  ThemeConfig,",
          )
          index = index.replace(
              "export * from './bindingAuthoringModel';\n",
              "export * from './bindingAuthoringModel';\nexport * from './mediaAuthoringModel';\n",
          )
          index = index.replace(
              "  'StudioInstancePropertyField',\n",
              "  'StudioInstancePropertyField',\n  'listStudioMediaAssets',\n  'createStudioMediaAssetReference',\n  'removeStudioMediaAsset',\n",
          )
          index = index.replace(
              "  | 'screen-detail'\n  | 'modules'",
              "  | 'screen-detail'\n  | 'media'\n  | 'modules'",
          )
          index = index.replace(
              "  | '/ankh/screens'\n  | '/ankh/modules'",
              "  | '/ankh/screens'\n  | '/ankh/media'\n  | '/ankh/modules'",
          )
          index = index.replace(
              "  updateNode: (nodeId: StudioNodeId, props: Record<string, unknown>) => void;\n",
              "  updateNode: (nodeId: StudioNodeId, props: Record<string, unknown>) => void;\n  upsertMediaAsset: (asset: MediaAsset) => void;\n  removeMediaAsset: (mediaId: string) => boolean;\n",
          )
          index_path.write_text(index)

          provider_path = Path('src/core/StudioProvider.ts')
          provider = provider_path.read_text()
          provider = provider.replace(
              "  GeneratedApiDefinition,\n  NavigatorType,",
              "  GeneratedApiDefinition,\n  MediaAsset,\n  NavigatorType,",
          )
          provider = provider.replace(
              "import { createStudioManifestSignature } from '../manifestSync';\n",
              "import { createStudioManifestSignature } from '../manifestSync';\nimport { removeStudioMediaAsset, upsertStudioMediaAsset } from '../mediaAuthoringModel';\n",
          )
          anchor = "  const updateTheme = useCallback(\n"
          media_callbacks = """  const upsertMediaAsset = useCallback(
            (asset: MediaAsset) => {
              updateManifest((current) => upsertStudioMediaAsset(current, asset));
            },
            [updateManifest],
          );

          const removeMediaAsset = useCallback(
            (mediaId: string): boolean => {
              let removed = false;
              updateManifest((current) => {
                const result = removeStudioMediaAsset(current, mediaId);
                removed = result.ok;
                return result.ok ? result.manifest : current;
              });
              return removed;
            },
            [updateManifest],
          );

"""
          if 'const upsertMediaAsset = useCallback' not in provider:
              provider = provider.replace(anchor, media_callbacks + anchor, 1)
          provider = provider.replace(
              "      updateNode,\n      updateDataBindings:",
              "      updateNode,\n      upsertMediaAsset,\n      removeMediaAsset,\n      updateDataBindings:",
          )
          provider = provider.replace(
              "      updateNode,\n      updateAuthSettings,",
              "      updateNode,\n      upsertMediaAsset,\n      removeMediaAsset,\n      updateAuthSettings,",
          )
          provider_path.write_text(provider)

          route_path = Path('src/studioAdminRouteModel.ts')
          route = route_path.read_text()
          screen_detail_end = """  {
            id: 'apis',
"""
          media_route = """  {
            id: 'media',
            path: '/ankh/media',
            label: 'Media',
            icon: 'images-outline',
            order: 12,
            description: 'Canonical app-authoring media pool.',
          },
          {
            id: 'apis',
"""
          if "id: 'media'" not in route:
              route = route.replace(screen_detail_end, media_route, 1)
          route_path.write_text(route)

          route_test_path = Path('src/studioAdminRouteModel.test.ts')
          route_test = route_test_path.read_text()
          route_test = route_test.replace(
              "      'screen-detail',\n      'apis',",
              "      'screen-detail',\n      'media',\n      'apis',",
          )
          route_test = route_test.replace(
              "    expect(createStudioAdminRoutePath({ routeId: 'screens' })).toBe('/ankh/screens');\n",
              "    expect(createStudioAdminRoutePath({ routeId: 'screens' })).toBe('/ankh/screens');\n    expect(resolveStudioAdminRouteId('/ankh/media')).toBe('media');\n    expect(resolveStudioAdminRoutePath('/ankh/media')).toBe('/ankh/media');\n    expect(createStudioAdminRoutePath({ routeId: 'media' })).toBe('/ankh/media');\n",
          )
          route_test_path.write_text(route_test)

          admin_page_path = Path('src/ui/admin/AnkhAdminPage.tsx')
          admin_page = admin_page_path.read_text()
          admin_page = admin_page.replace(
              "import { ModuleDetailAdminPage } from './pages/ModuleDetailAdminPage';\n",
              "import { MediaAdminPage } from './pages/MediaAdminPage';\nimport { ModuleDetailAdminPage } from './pages/ModuleDetailAdminPage';\n",
          )
          admin_page = admin_page.replace(
              "  screens: () => <ScreensAdminPage />,\n",
              "  screens: () => <ScreensAdminPage />,\n  media: () => <MediaAdminPage />,\n",
          )
          admin_page_path.write_text(admin_page)

          properties_page_path = Path('src/ui/admin/pages/PropertiesAdminPage.tsx')
          properties_page = properties_page_path.read_text()
          properties_page = properties_page.replace(
              "import { AdminHeader, AdminScroll, Field, Input, KeyValue } from '../adminPagePrimitives';\n",
              "import { AdminHeader, AdminScroll, Field, Input, KeyValue } from '../adminPagePrimitives';\nimport { MediaPropertyInput } from './MediaPropertyInput';\n",
          )
          properties_page = properties_page.replace(
              "  const { field, onChange } = props;\n\n  return (",
              "  const { field, onChange } = props;\n  const studio = useStudio();\n\n  return (",
          )
          properties_page = properties_page.replace(
              "      {field.editor === 'choice' ? <ChoicePropertyInput field={field} onChange={onChange} /> : null}\n",
              "      {field.editor === 'choice' ? <ChoicePropertyInput field={field} onChange={onChange} /> : null}\n      {field.editor === 'media' && studio.manifest ? (\n        <MediaPropertyInput field={field} manifest={studio.manifest} onChange={onChange} />\n      ) : null}\n",
          )
          properties_page_path.write_text(properties_page)

          properties_test_path = Path('src/propertiesAuthoringModel.test.ts')
          properties_test = properties_test_path.read_text()
          media_test = """
            test('consumes released ZORA Image media metadata without Image-specific Studio logic', () => {
              const node: UiNode = {
                id: 'hero',
                type: 'Image',
                props: { source: { mediaId: 'hero-media' }, alt: 'Mountain sunrise' },
              };
              const fields = resolveStudioInstancePropertyFields(node, ZORA_COMPONENT_META);
              expect(fields.find((field) => field.name === 'source')).toMatchObject({
                schemaType: 'media',
                editor: 'media',
                mediaKinds: ['image'],
                value: { mediaId: 'hero-media' },
                isExplicit: true,
              });
              expect(createStudioInstancePropertyPatch(node, 'source', { mediaId: 'other-image' })).toEqual({
                props: { alt: 'Mountain sunrise', source: { mediaId: 'other-image' } },
              });
            });
"""
          if 'consumes released ZORA Image media metadata' not in properties_test:
              properties_test = properties_test.replace('\n});\n', media_test + '\n});\n', 1)
          properties_test_path.write_text(properties_test)

          changeset = Path('.changeset/adm14-studio-media-pool.md')
          changeset.write_text("""---
          '@ankhorage/studio': minor
          ---

          Add the canonical manifest-backed Studio media pool, safe media usage/removal helpers, stable URL import, and generic media property authoring driven by component metadata.
          """)
          PY

      - name: Update dependencies
        run: bun install

      - name: Format authored changes
        run: bun run format

      - name: Apply strict lint fixes
        run: bun run lint:fix

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Knip
        run: bun run knip

      - name: Generate documentation
        run: bun run docs

      - name: Format generated documentation
        run: bun run format

      - name: Validate repository conventions
        run: bunx @ankhorage/doctor@0.8.0 validate .

      - name: Verify formatting
        run: bun run format:check

      - name: Verify lint
        run: bun run lint

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify changeset
        run: bun run changeset:status

      - name: Guard transient media persistence in authored source
        run: |
          if grep -R -n -E "mediaId.*(blob:|file:|content:|data:)|(blob:|file:|content:|data:).*mediaId" src --include='*.ts' --include='*.tsx'; then
            echo 'Transient media URL found adjacent to canonical media persistence.'
            exit 1
          fi

      - name: Guard generated documentation paths
        run: |
          if grep -R -E '/home/runner/work/|/Users/[^/]+/.*/node_modules/|[A-Za-z]:\\Users\\[^\\]+\\.*node_modules\\' README.md paradox; then
            echo 'Generated docs contain machine-specific paths.'
            exit 1
          fi

      - name: Verify clean patches
        run: git diff --check

      - name: Remove temporary gate workflow
        run: rm .github/workflows/adm14-media-pool-gate.yml

      - name: Commit validated Studio media state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Validate ADM-14 Studio media pool'
          git push origin HEAD:agent/adm14-media-pool
