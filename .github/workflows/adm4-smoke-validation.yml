name: ADM4 Web Validation

on:
  push:
    branches:
      - agent/adm-4-external-api-authoring

permissions:
  contents: write

jobs:
  validate-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/adm-4-external-api-authoring
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Studio web
        run: bun run test:smoke:studio-web

      - name: Validate generated app web
        run: bun run test:e2e:generated-app-web

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Remove validation helper
        run: |
          rm .github/workflows/adm4-smoke-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/adm4-smoke-validation.yml
          git commit -m "ci: remove adm4 web validation helper"
          git push origin HEAD:agent/adm-4-external-api-authoring
