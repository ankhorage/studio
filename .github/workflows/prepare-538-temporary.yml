name: Temporary #538 preparation

on:
  push:
    branches:
      - test/538-fresh-template-infra-up

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: test/538-fresh-template-infra-up
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format sources
        run: bun run format
      - name: Autofix task lint
        run: bun x ankhorage-eslint src/host/freshTemplateInfra.e2e.test.ts --fix --max-warnings=0
      - name: Regenerate Paradox documentation
        run: bun run docs
      - name: Commit generated formatting and documentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(studio): apply generated #538 fixes"
          git push origin HEAD:test/538-fresh-template-infra-up
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run check-types
      - name: Lint
        run: bun run lint
      - name: Knip
        run: bun run knip:check
      - name: Changeset status
        run: bun run changeset:status
      - name: Format check
        run: bun run format:check
      - name: Unit and integration tests
        run: bun run test
