name: ADM-14 Bundled Assets Gate

on:
  push:
    branches:
      - agent/adm14-bundled-assets-authoring

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Write ADM-14 release metadata
        run: |
          cat > .changeset/adm14-bundled-assets-authoring.md <<'EOF'
          ---
          '@ankhorage/studio': minor
          ---

          Add bundled app media authoring backed by assets/authoring and generated Expo media registries.
          EOF
          cat > docs/adm14-media-ingestion.md <<'EOF'
          # ADM-14 trusted media ingestion

          Studio authoring media crosses explicit platform and trusted-host boundaries before it enters the manifest.

          A platform picker returns normalized bytes and metadata. Expo implements this through `@ankhorage/expo-runtime/media-picker`; Studio depends only on the structural picker contract. Studio then sends those bytes to one of two trusted authoring targets: managed storage or the generated app bundle.

          Managed storage resolves the project's configured provider through the provider-neutral storage adapter and persists only canonical storage identity. Bundled media is written only below `assets/authoring/<mediaId>/...` and persists only `{ kind: 'bundled', path }`.

          `syncGeneratedAppFiles()` regenerates `src/generated/bundledMediaRegistry.ts`. `@ankhorage/expo-runtime` maps those logical paths to static Metro `require()` values. Generated production apps use that resolver directly; Studio preview composes it with the trusted storage resolver.

          Web and native picker-local locations are transient input only. Bundled media does not use `infra.storage`; it ships with the app. Runtime/user-generated uploads remain a separate logical pool governed by application runtime policy.

          Physical cleanup of files or storage objects remains separate from manifest removal so deletion failures and reference safety stay explicit.
          EOF
          cat > docs/adm14-media-authoring.md <<'EOF'
          # ADM-14 media authoring architecture

          Studio treats app-authoring media as one canonical manifest capability rather than an Image-specific upload field.

          ## Media domains

          Bundled app assets ship with the generated app. Studio-owned bundled files live below `assets/authoring/<mediaId>/...` and are persisted as logical `MediaBundledSource.path` values. Platform render handles are never serialized.

          Managed authoring media lives in `AppManifest.media.assets` and may use provider-neutral storage or stable HTTP(S) URL sources. Component properties persist only `{ mediaId }` references.

          Runtime/user-generated uploads such as avatars and posts are application data, not Studio authoring media. They remain governed by runtime auth and storage policy even when they share physical infrastructure.

          ## Storage and bundle targets

          `infra.storage` describes application storage infrastructure. It is used for managed authoring media but not for bundled media. Bundled authoring assets become part of the generated app bundle under `/assets`.

          The same normalized web/iOS/Android picker bytes can target either `storage` or `bundled`. The picker contract and media reference model therefore stay target-neutral.

          ## Expo runtime bridge

          `syncGeneratedAppFiles()` scans `assets/authoring` and generates `src/generated/bundledMediaRegistry.ts`. Expo Runtime 2.2 owns the static Metro registry format and canonical bundled-media resolver. Generated apps and Studio preview consume the same resolver.

          Studio preview composes bundled resolution with the existing trusted storage resolver, so bundled, storage-backed and URL assets coexist in the same media pool.

          ## Lifecycle

          Manifest removal remains usage-aware. Physical cleanup of bundled files and managed storage objects is intentionally a separate trusted lifecycle operation and is not silently coupled to manifest mutation in this slice.
          EOF

      - name: Install and update lockfile
        run: bun install

      - name: Verify Expo Runtime 2.2 resolution
        run: |
          bun pm ls | grep -E '@ankhorage/expo-runtime@2\.2\.'

      - name: Format authored changes
        run: bun run format

      - name: Apply strict lint fixes
        run: bun run lint:fix

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Knip
        run: bun run knip

      - name: Generate documentation
        run: bun run docs

      - name: Format generated documentation
        run: bun run format

      - name: Validate Ankhorage repository
        run: bunx @ankhorage/ankh doctor validate .

      - name: Verify formatting
        run: bun run format:check

      - name: Verify lint
        run: bun run lint

      - name: Pack dry run
        run: npm pack --dry-run

      - name: Guard transient media persistence
        run: |
          if grep -R -n -E "mediaId.*(blob:|file:|content:|data:)|(blob:|file:|content:|data:).*mediaId" src --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx'; then
            echo 'Transient media URL found adjacent to canonical media persistence.'
            exit 1
          fi

      - name: Guard provider URLs in production ingestion
        run: |
          if grep -R -n "publicUrl" src/host/media src/core --include='*.ts' --include='*.tsx' --exclude='*.test.ts' --exclude='*.test.tsx'; then
            echo 'Provider public URL leaked into production media authoring code.'
            exit 1
          fi

      - name: Guard generated machine paths
        run: |
          if grep -R -n "/home/runner/work" README.md paradox; then
            echo 'Runner path leaked into generated documentation.'
            exit 1
          fi

      - name: Verify clean patches
        run: git diff --check

      - name: Commit validated state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/adm14-bundled-assets-gate.yml'
          if ! git diff --cached --quiet; then
            git commit -m 'Validate ADM-14 bundled assets authoring'
          fi

      - name: Verify changeset
        run: bun run changeset:status

      - name: Push validated state
        run: git push origin HEAD:agent/adm14-bundled-assets-authoring
