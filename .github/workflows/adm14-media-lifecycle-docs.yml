name: ADM-14 Media Lifecycle Docs

on:
  push:
    branches:
      - agent/adm14-media-lifecycle

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh generated documentation
        run: |
          bun run docs
          bun run format

      - name: Guard generated-only mutation
        run: |
          unexpected="$(git diff --name-only | grep -Ev '^(README\.md|paradox/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected non-generated formatting changes:"
            echo "$unexpected"
            exit 1
          fi
          git diff --check

      - name: Validate repository
        run: |
          bunx @ankhorage/ankh doctor validate .
          npm pack --dry-run
          bun run changeset:status --since=origin/main

      - name: Commit generated documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md paradox
          git commit -m 'Refresh ADM-14 media lifecycle docs' || exit 0
          git push origin HEAD:agent/adm14-media-lifecycle
