name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - api/294-canonical-api-studio

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install

      - name: Apply one-shot API5 object access codemod
        if: github.event_name == 'push' && github.ref_name == 'api/294-canonical-api-studio'
        run: |
          bun scripts/api5-object-access-codemod.ts
          ./node_modules/.bin/ankhorage-prettier --write \
            src/core/StudioProvider.ts \
            src/host/generatedAdminExpoWeb.smoke.test.ts \
            src/host/generatedAuthAdapterRuntime.smoke.test.ts \
            src/host/orchestrator/scaffolder.ts \
            src/host/studioInfra.e2e.test.ts \
            src/index.ts \
            src/manifestState.ts \
            src/runtime/stationarySelection.ts
          git checkout HEAD^ -- .github/workflows/ci.yml
          rm scripts/api5-object-access-codemod.ts
          git config user.name 'ankhorage-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finish Studio object access cleanup'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Show lockfile diff
        run: git diff -- bun.lock

      - name: Run build
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            bun run build
          else
            echo "No build script found; skipping."
          fi

      - name: Validate Ankhorage repository
        run: bunx @ankhorage/ankh doctor validate .

      - name: Run lint
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint ? 0 : 1)"; then
            bun run lint
          else
            echo "No lint script found; skipping."
          fi

      - name: Run format check
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['format:check'] ? 0 : 1)"; then
            bun run format:check
          else
            echo "No format:check script found; skipping."
          fi

      - name: Run Knip
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.knip ? 0 : 1)"; then
            bun run knip
          else
            echo "No knip script found; skipping."
          fi

      - name: Run tests
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)"; then
            bun run test
          else
            echo "No test script found; skipping."
          fi

      - name: Run Studio web smoke test
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.['test:smoke:studio-web'] ? 0 : 1)"; then
            bun run test:smoke:studio-web
          else
            echo "No test:smoke:studio-web script found; skipping."
          fi

      - name: Run generated app web E2E
        run: bun run test:e2e:generated-app-web

      - name: Run typecheck
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.typecheck ? 0 : 1)"; then
            bun run typecheck
          else
            echo "No typecheck script found; skipping."
          fi

      - name: Check changesets
        if: github.event_name == 'pull_request'
        env:
          CHANGESET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGESET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash ./scripts/check-changeset-status.sh
