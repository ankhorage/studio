name: Clean Studio Infra 5 validation artifacts

on:
  push:
    branches:
      - fix/145-current-infra-consumer
    paths:
      - '.github/workflows/cleanup-512.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-current-infra-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint:fix
      - run: bun run format
      - run: rm -f repair-512-report-2.txt static-512-report.txt
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:check
      - name: Commit clean static migration
        shell: bash
        run: |
          rm .github/workflows/cleanup-512.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: clean Studio Infra 5 migration'
          git push origin HEAD:fix/145-current-infra-consumer
