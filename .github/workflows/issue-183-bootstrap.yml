name: Issue 183 bootstrap

on:
  push:
    branches:
      - 183-standalone-template-consumer

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 183-standalone-template-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply mechanical consumer migrations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          package = Path('package.json')
          text = package.read_text()
          old = '"@ankhorage/templates": "^9.0.2"'
          new = '"@ankhorage/templates": "^9.1.3"'
          if old not in text:
              raise SystemExit('templates dependency range not found')
          package.write_text(text.replace(old, new))

          oauth_files = [
              Path('src/host/smoke/createAuth5NativeOAuthSmokeManifest.ts'),
              Path('src/host/smoke/createExpo57CapabilityFixtureManifest.ts'),
              Path('src/host/smoke/createExpo57ReaderFixtureManifest.ts'),
              Path('src/host/oauthFixtureConsumer.smoke.test.ts'),
          ]
          for path in oauth_files:
              text = path.read_text()
              old_import = "import { createOAuthFixtureManifest } from '@ankhorage/templates';"
              if old_import in text:
                  replacement = (
                      "import { createOAuthFixtureManifest } from './createOAuthFixtureManifest';"
                      if '/smoke/' in str(path)
                      else "import { createOAuthFixtureManifest } from './smoke/createOAuthFixtureManifest';"
                  )
                  path.write_text(text.replace(old_import, replacement))

          default_files = [
              Path('src/host/smoke/runExpo57GeneratedAppAcceptance.ts'),
              Path('src/host/smoke/runExpo57GeneratedCapabilityAcceptance.ts'),
              Path('src/host/smoke/runExpo57GeneratedNavigationAcceptance.ts'),
          ]
          old_selection = "{ category: 'developer_tools', templateId: 'default' }"
          for path in default_files:
              text = path.read_text()
              if old_selection not in text:
                  raise SystemExit(f'default template selection not found in {path}')
              manager_import = "import { ProjectManager } from '../orchestrator/projectManager';"
              fixture_import = "import { createSmokeProjectSource } from './createSmokeProjectSource';"
              if fixture_import not in text:
                  text = text.replace(manager_import, manager_import + '\n' + fixture_import)
              path.write_text(text.replace(old_selection, 'createSmokeProjectSource()'))

          infra_path = Path('src/host/expo57GeneratedProductionInfra.e2e.test.ts')
          text = infra_path.read_text()
          if old_selection not in text:
              raise SystemExit('default template selection not found in production infra e2e')
          manager_import = "import { ProjectManager } from './orchestrator/projectManager';"
          fixture_import = "import { createSmokeProjectSource } from './smoke/createSmokeProjectSource';"
          if fixture_import not in text:
              text = text.replace(manager_import, manager_import + '\n' + fixture_import)
          infra_path.write_text(text.replace(old_selection, 'createSmokeProjectSource()'))
          PY
      - name: Refresh lockfile
        run: bun install
      - name: Format
        run: bun run format
      - name: Commit bootstrap output
        run: |
          git rm .github/workflows/issue-183-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src
          git commit -m "refactor: migrate Studio to standalone templates"
          git push origin HEAD:183-standalone-template-consumer
