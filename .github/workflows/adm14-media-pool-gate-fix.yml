name: ADM-14 Studio Gate Changeset Fix

on:
  push:
    branches:
      - agent/adm14-media-pool

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Correct pre-1.0 changeset bump
        run: |
          sed -i "s/'@ankhorage\/studio': minor/'@ankhorage\/studio': major/" .github/workflows/adm14-media-pool-gate.yml
          rm .github/workflows/adm14-media-pool-gate-fix.yml

      - name: Commit gate correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use pre-1.0 Studio changeset bump'
          git push origin HEAD:agent/adm14-media-pool
