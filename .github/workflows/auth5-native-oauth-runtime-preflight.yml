name: Auth5 native OAuth runtime preflight

on:
  push:
    branches:
      - agent/auth5-native-oauth-runtime-preflight

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth5-native-oauth-runtime-preflight
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Consume Expo Runtime 2.5
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('package.json'): [('"@ankhorage/expo-runtime": "^2.4.0"', '"@ankhorage/expo-runtime": "^2.5.0"')],
              Path('src/host/orchestrator/templates.ts'): [("const EXPO_RUNTIME_VERSION = '^2.4.0';", "const EXPO_RUNTIME_VERSION = '^2.5.0';")],
              Path('src/host/orchestrator/templates.test.ts'): [("toBe('^2.4.0')", "toBe('^2.5.0')")],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          bun update @ankhorage/expo-runtime --lockfile-only
          bun install --frozen-lockfile

      - name: Validate Studio consumer
        run: |
          bun run format
          bun run docs
          bun run format
          bun run build
          bunx @ankhorage/ankh doctor validate .
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run test:smoke:studio-web
          bun run test:e2e:generated-app-web
          bun run typecheck
          bun run changeset:status
          git diff --check

      - name: Commit validated Studio consumer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/auth5-native-oauth-runtime-preflight.yml
          git add -A
          git commit -m 'Complete Auth 5 native OAuth runtime preflight'
          git push origin HEAD:agent/auth5-native-oauth-runtime-preflight
