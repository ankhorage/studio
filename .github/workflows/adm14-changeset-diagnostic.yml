name: ADM-14 Changeset Diagnostic

on:
  push:
    branches:
      - agent/adm14-media-pool

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Apply integration and diagnose changeset history
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/adm14-media-pool-gate.yml').read_text().splitlines()
          start = source.index("          python3 <<'PY'") + 1
          end = source.index('          PY', start)
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end])
          script = script.replace("@ankhorage/studio': minor", "@ankhorage/studio': major", 1)
          Path('/tmp/integrate.py').write_text(script + '\n')
          PY
          python3 /tmp/integrate.py
          bun install >/dev/null
          echo '--- changeset ---'
          cat .changeset/adm14-studio-media-pool.md
          echo '--- status before commit ---'
          set +e
          bun run changeset:status > /tmp/before.log 2>&1
          before=$?
          tail -n 20 /tmp/before.log
          set -e
          git config user.name diagnostic
          git config user.email diagnostic@example.com
          git add -A -- . ':!.github/workflows/*'
          git commit -m 'diagnostic local commit' >/dev/null
          echo '--- status after commit ---'
          set +e
          bun run changeset:status > /tmp/after.log 2>&1
          after=$?
          tail -n 20 /tmp/after.log
          set -e
          echo "before=$before after=$after"
          test "$after" -eq 0
