name: Finalize ADM 5 Data Sources 1.0.1

on:
  push:
    branches:
      - agent/adm-5-generated-api-authoring

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Move generated API validation to Data Sources
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceExactly = (path, before, after) => {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) {
              throw new Error(`Expected source fragment was not found in ${path}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          };

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.dependencies['@ankhorage/data-sources'] = '^1.0.1';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const modelPath = 'src/ui/admin/pages/generatedApiEditorModel.ts';
          replaceExactly(
            modelPath,
            "import { createGeneratedApiDataSource } from '@ankhorage/data-sources';",
            "import {\n  createGeneratedApiDataSource,\n  validateGeneratedApiDefinition,\n} from '@ankhorage/data-sources';",
          );

          replaceExactly(
            modelPath,
            "  if (diagnostics.some((entry) => entry.severity === 'error')) {\n    return { diagnostics };\n  }\n\n  const definition: GeneratedApiDefinition = {",
            "  const definition: GeneratedApiDefinition = {",
          );

          replaceExactly(
            modelPath,
            "    resources,\n  };\n  const projection = createGeneratedApiDataSource(definition);",
            "    resources,\n  };\n  if (diagnostics.some((entry) => entry.severity === 'error')) {\n    return {\n      definition,\n      diagnostics: [...diagnostics, ...validateGeneratedApiDefinition(definition)],\n    };\n  }\n\n  const projection = createGeneratedApiDataSource(definition);",
          );

          replaceExactly(
            modelPath,
            "  const fields = draft.fields.map((field, fieldIndex) =>\n    resolveFieldDraft(apiId, field, resourceIndex, fieldIndex, diagnostics),\n  );\n  if (fields.length === 0) {\n    diagnostics.push(\n      diagnostic(\n        apiId,\n        'Generated API resources require at least one field.',\n        `resources.${resourceIndex}.collection.fields`,\n      ),\n    );\n  }\n  validateFieldNames(apiId, fields, resourceIndex, diagnostics);\n  const seed = parseSeed(apiId, draft.seedText, resourceIndex, diagnostics);\n  const primaryKey = clean(draft.primaryKey);\n  if (primaryKey && !fields.some((field) => field.name === primaryKey)) {\n    diagnostics.push(\n      diagnostic(\n        apiId,\n        `Primary key '${primaryKey}' does not match a field.`,\n        `resources.${resourceIndex}.collection.primaryKey`,\n      ),\n    );\n  }",
            "  const fields = draft.fields.map((field, fieldIndex) =>\n    resolveFieldDraft(apiId, field, resourceIndex, fieldIndex, diagnostics),\n  );\n  const seed = parseSeed(apiId, draft.seedText, resourceIndex, diagnostics);\n  const primaryKey = clean(draft.primaryKey);",
          );

          replaceExactly(
            modelPath,
            "  const name = draft.name.trim();\n  if (!name) {\n    diagnostics.push(\n      diagnostic(\n        apiId,\n        'Field name is required.',\n        `resources.${resourceIndex}.collection.fields.${fieldIndex}.name`,\n      ),\n    );\n  }\n\n  const parsedDefault = parseDefaultValue(draft);",
            "  const name = draft.name.trim();\n  const parsedDefault = parseDefaultValue(draft);",
          );

          replaceExactly(
            modelPath,
            "\nfunction validateFieldNames(\n  apiId: string,\n  fields: readonly DbFieldDefinition[],\n  resourceIndex: number,\n  diagnostics: DataSourceDiagnostic[],\n): void {\n  const seen = new Set<string>();\n  fields.forEach((field, fieldIndex) => {\n    if (!field.name || !seen.has(field.name)) {\n      if (field.name) seen.add(field.name);\n      return;\n    }\n    diagnostics.push(\n      diagnostic(\n        apiId,\n        `Field '${field.name}' is duplicated.`,\n        `resources.${resourceIndex}.collection.fields.${fieldIndex}.name`,\n      ),\n    );\n  });\n}\n",
            "\n",
          );

          const testPath = 'src/ui/admin/pages/generatedApiEditorModel.test.ts';
          replaceExactly(
            testPath,
            "      'resources.0.collection.primaryKey',",
            "      'resources.items.collection.primaryKey',",
          );

          const testSource = fs.readFileSync(testPath, 'utf8');
          const marker = "  test('returns structured diagnostics for invalid seed JSON and primary keys', () => {";
          if (!testSource.includes(marker)) {
            throw new Error('Expected generated API diagnostic test marker was not found.');
          }
          const insertion = `  test('surfaces canonical field diagnostics from Data Sources', () => {\n    const draft = createGeneratedApiEditorDraft();\n    const [resource] = draft.resources;\n    if (!resource) throw new Error('Expected default resource.');\n\n    const [field] = resource.fields;\n    if (!field) throw new Error('Expected default field.');\n\n    const result = resolveGeneratedApiEditorDraft({\n      ...draft,\n      id: 'broken-fields',\n      resources: [\n        {\n          ...resource,\n          fields: [field, { ...field }],\n        },\n      ],\n    });\n\n    expect(result.diagnostics.map((entry) => entry.path)).toContain(\n      'resources.items.collection.fields.1.name',\n    );\n  });\n\n`;
          fs.writeFileSync(testPath, testSource.replace(marker, insertion + marker));
          NODE

      - name: Refresh released dependency lockfile
        run: bun install

      - name: Apply lint autofixes
        run: bun run lint:fix

      - name: Format sources
        run: bun run format

      - name: Run build
        run: bun run build

      - name: Validate repository
        run: bunx @ankhorage/ankh doctor validate .

      - name: Run lint
        run: bun run lint

      - name: Run format check
        run: bun run format:check

      - name: Run Knip
        run: bun run knip

      - name: Run tests
        run: bun run test

      - name: Run Studio web smoke test
        run: bun run test:smoke:studio-web

      - name: Run generated app web E2E
        run: bun run test:e2e:generated-app-web

      - name: Run infra E2E
        run: bun run test:e2e:infra

      - name: Run typecheck
        run: bun run typecheck

      - name: Generate docs
        run: bun run docs

      - name: Format generated docs
        run: bun run format

      - name: Check generated docs formatting
        run: bun run format:check

      - name: Check changeset
        env:
          CHANGESET_BASE_SHA: origin/main
          CHANGESET_HEAD_SHA: HEAD
        run: bash ./scripts/check-changeset-status.sh

      - name: Commit validated final ADM 5 branch
        run: |
          rm .github/workflows/finalize-adm5-data-sources-101.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: consume canonical generated api validation'
          git push origin HEAD:agent/adm-5-generated-api-authoring
