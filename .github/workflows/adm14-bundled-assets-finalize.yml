name: ADM-14 Bundled Assets Finalize

on:
  push:
    branches:
      - agent/adm14-bundled-assets-authoring

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Apply Expo Runtime 2.2.1 owner boundary
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              file.write_text(text.replace(old, new))

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              file.write_text(text.replace(old, new))

          replace_once('package.json', '"@ankhorage/expo-runtime": "^2.2.0"', '"@ankhorage/expo-runtime": "^2.2.1"')
          replace_once('src/host/media/projectBundledMediaRegistry.ts', "from '@ankhorage/expo-runtime';", "from '@ankhorage/expo-runtime/bundled-media';")
          replace_once('src/ui/AnkhStudio.ts', "} from '@ankhorage/expo-runtime';", "} from '@ankhorage/expo-runtime/bundled-media';")
          replace_once(
              'src/host/layout/templates/rootLayout.ts',
              "source: '@ankhorage/expo-runtime',\n      namedImports: [{ imported: 'createExpoBundledMediaResolver' }],",
              "source: '@ankhorage/expo-runtime/bundled-media',\n      namedImports: [{ imported: 'createExpoBundledMediaResolver' }],",
          )
          replace_once('src/host/orchestrator/templates.ts', "const EXPO_RUNTIME_VERSION = '^2.2.0';", "const EXPO_RUNTIME_VERSION = '^2.2.1';")
          replace_count(
              'src/host/orchestrator/templates.test.ts',
              "expect(dependencies['@ankhorage/expo-runtime']).toBe('^2.2.0');",
              "expect(dependencies['@ankhorage/expo-runtime']).toBe('^2.2.1');",
              2,
          )
          replace_once(
              'src/host/orchestrator/templates.test.ts',
              "expect(plain.dependencies['@ankhorage/expo-runtime']).toBe('^2.2.0');",
              "expect(plain.dependencies['@ankhorage/expo-runtime']).toBe('^2.2.1');",
          )
          replace_once(
              'src/host/layout/templates/rootLayout.test.ts',
              "source: '@ankhorage/expo-runtime',\n      namedImports: [{ imported: 'createExpoBundledMediaResolver' }],",
              "source: '@ankhorage/expo-runtime/bundled-media',\n      namedImports: [{ imported: 'createExpoBundledMediaResolver' }],",
          )
          replace_once(
              'src/host/media/projectBundledMediaRegistry.test.ts',
              "expect(source).toContain('require(\"../../assets/authoring/hero/Hero Image.png\")');",
              "expect(source).toContain('require(\"../../assets/authoring/hero/Hero Image.png\")');\n    expect(source).toContain(\"from '@ankhorage/expo-runtime/bundled-media';\");\n    expect(source).not.toContain(\"from '@ankhorage/expo-runtime';\");",
          )
          replace_once(
              'src/host/orchestrator/generatedAppFiles.test.ts',
              "expect(source).toContain('require(\"../../assets/authoring/hero/hero.png\")');",
              "expect(source).toContain('require(\"../../assets/authoring/hero/hero.png\")');\n    expect(source).toContain(\"from '@ankhorage/expo-runtime/bundled-media';\");\n    expect(source).not.toContain(\"from '@ankhorage/expo-runtime';\");",
          )
          PY
      - name: Write ADM-14 release metadata
        run: |
          cat > .changeset/adm14-bundled-assets-authoring.md <<'EOF'
          ---
          '@ankhorage/studio': minor
          ---

          Add bundled app media authoring backed by assets/authoring and generated Expo media registries.
          EOF
          cat > docs/adm14-media-ingestion.md <<'EOF'
          # ADM-14 trusted media ingestion

          Studio authoring media crosses explicit platform and trusted-host boundaries before it enters the manifest.

          A platform picker returns normalized bytes and metadata. Expo implements this through `@ankhorage/expo-runtime/media-picker`; Studio depends only on the structural picker contract. Studio then sends those bytes to managed storage or the generated app bundle.

          Managed storage resolves the project's configured provider through the provider-neutral storage adapter and persists only canonical storage identity. Bundled media is written only below `assets/authoring/<mediaId>/...` and persists only `{ kind: 'bundled', path }`.

          `syncGeneratedAppFiles()` regenerates `src/generated/bundledMediaRegistry.ts`. `@ankhorage/expo-runtime/bundled-media` owns the static Metro registry format and bundled resolver without loading the Expo Runtime UI/provider barrel. Generated production apps use that resolver directly; Studio preview composes it with the trusted storage resolver.

          Web and native picker-local locations are transient input only. Bundled media does not use `infra.storage`; it ships with the app. Runtime/user-generated uploads remain a separate logical pool governed by application runtime policy.

          Physical cleanup of files or storage objects remains separate from manifest removal so deletion failures and reference safety stay explicit.
          EOF
          cat > docs/adm14-media-authoring.md <<'EOF'
          # ADM-14 media authoring architecture

          Studio treats app-authoring media as one canonical manifest capability rather than an Image-specific upload field.

          ## Media domains

          Bundled app assets ship with the generated app. Studio-owned bundled files live below `assets/authoring/<mediaId>/...` and are persisted as logical `MediaBundledSource.path` values. Platform render handles are never serialized.

          Managed authoring media lives in `AppManifest.media.assets` and may use provider-neutral storage or stable HTTP(S) URL sources. Component properties persist only `{ mediaId }` references.

          Runtime/user-generated uploads such as avatars and posts are application data, not Studio authoring media. They remain governed by runtime auth and storage policy even when they share physical infrastructure.

          ## Storage and bundle targets

          `infra.storage` describes application storage infrastructure. It is used for managed authoring media but not for bundled media. Bundled authoring assets become part of the generated app bundle under `/assets`.

          The same normalized web/iOS/Android picker bytes can target either `storage` or `bundled`. The picker contract and media reference model therefore stay target-neutral.

          ## Expo runtime bridge

          `syncGeneratedAppFiles()` scans `assets/authoring` and generates `src/generated/bundledMediaRegistry.ts`. Expo Runtime 2.2.1 exposes the static Metro registry generator and canonical bundled-media resolver through `@ankhorage/expo-runtime/bundled-media`. Generated apps and Studio preview consume that same owner boundary.

          Studio preview composes bundled resolution with the existing trusted storage resolver, so bundled, storage-backed and URL assets coexist in the same media pool.

          ## Lifecycle

          Manifest removal remains usage-aware. Physical cleanup of bundled files and managed storage objects is intentionally a separate trusted lifecycle operation and is not silently coupled to manifest mutation in this slice.
          EOF
      - name: Install and update lockfile
        run: bun install
      - name: Verify Expo Runtime 2.2.1
        run: bun pm ls | grep -F '@ankhorage/expo-runtime@2.2.1'
      - name: Format and lint fixes
        run: |
          bun run format
          bun run lint:fix
          git diff --check
      - name: Commit validated authored state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/adm14-bundled-assets-finalize.yml'
          git commit -m 'Finalize ADM-14 bundled assets authoring'
          git push origin HEAD:agent/adm14-bundled-assets-authoring
