name: Migrate Studio Infra HTTP routes

on:
  push:
    branches:
      - fix/145-current-infra-consumer
    paths:
      - '.github/workflows/migrate-512-http-infra.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-current-infra-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Remove legacy script runtime HTTP semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/host/http/server.ts')
          text = path.read_text()
          text = text.replace("import {\n  InfraScriptExecutionError,\n  runProjectInfrastructureLifecycle,\n} from '@ankhorage/infra/project';\n", '')
          text = text.replace("import { stopAllProjectInfraPortForwards } from '../orchestrator/infraSession';\n", '')
          text = text.replace("import { getProjectPath } from '../orchestrator/projectPaths';\n", '')
          text = text.replace("import { trimOutputForApi } from '../utils/trimOutput';\n", '')
          text = text.replace("const MAX_INFRA_RUNTIME_OUTPUT_CHARS = 12_000;\n\n", '')

          down_pattern = re.compile(r"  fastify\.post\('/api/projects/:id/infra/down'.*?\n  \}\);\n\n  fastify\.post\('/api/projects/:id/infra/runtime-status'", re.S)
          down_replacement = """  fastify.post('/api/projects/:id/infra/down', async (req: FastifyRequest, reply) => {
            const { id } = req.params as { id: string };
            try {
              const status = await projectManager.downInfrastructure(id);
              return { success: true, status };
            } catch (err: unknown) {
              const message = err instanceof Error ? err.message : String(err);
              return reply.status(500).send({ error: message });
            }
          });

          fastify.post('/api/projects/:id/infra/runtime-status'"""
          text, count = down_pattern.subn(down_replacement, text, count=1)
          if count != 1:
            raise SystemExit('infra down block not found')

          status_pattern = re.compile(r"  fastify\.post\('/api/projects/:id/infra/runtime-status'.*?\n  \}\);\n\n  fastify\.post\(\n    '/api/projects/:id/runtime/sync'", re.S)
          status_replacement = """  fastify.post('/api/projects/:id/infra/runtime-status', async (req: FastifyRequest, reply) => {
            const { id } = req.params as { id: string };
            try {
              const status = await projectManager.getInfrastructureStatus(id);
              return { success: true, status };
            } catch (err: unknown) {
              const message = err instanceof Error ? err.message : String(err);
              return reply.status(500).send({ error: message });
            }
          });

          fastify.post(
            '/api/projects/:id/runtime/sync'"""
          text, count = status_pattern.subn(status_replacement, text, count=1)
          if count != 1:
            raise SystemExit('runtime-status block not found')

          text = re.sub(r"\n  fastify\.addHook\('onClose', async \(\) => \{\n    await stopAllProjectInfraPortForwards\(\);\n  \}\);\n", '\n', text, count=1)
          text = re.sub(r"\n/\*\*\* Trim infrastructure command output.*\Z", '\n', text, count=1, flags=re.S)
          path.write_text(text)
          PY

          rm .github/workflows/migrate-512-http-infra.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m 'refactor: expose typed infrastructure HTTP lifecycle'
          git push origin HEAD:fix/145-current-infra-consumer

      - name: Validate production build
        run: |
          bun install --frozen-lockfile
          bun run build
