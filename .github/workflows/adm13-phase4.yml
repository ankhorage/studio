name: ADM-13 Phase 4

on:
  push:
    branches:
      - adm13/theme-administration
    paths:
      - scripts/adm13-phase4.mjs
      - .github/workflows/adm13-phase4.yml

permissions:
  contents: write

jobs:
  phase4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Apply route migration
        run: bun scripts/adm13-phase4.mjs
      - name: Format
        run: bun run format
      - name: Validate Phase 4
        run: |
          bun run build
          bun test src/ui/admin/pages/adminThemeModel.test.ts src/ui/admin/pages/themeTokenAuthoringModel.test.ts src/ui/admin/pages/ThemeAdminPage.test.ts src/manifestState.test.ts src/studioAdminRouteModel.test.ts src/host/layout/templates/rootLayout.test.ts
          bun run typecheck
          bun run lint
      - name: Remove temporary files
        run: rm scripts/adm13-phase4.mjs .github/workflows/adm13-phase4.yml
      - name: Commit Phase 4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build global Theme administration"
          git push origin HEAD:adm13/theme-administration
