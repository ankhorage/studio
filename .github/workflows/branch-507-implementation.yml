name: Branch 507 implementation

on:
  push:
    branches:
      - fix/507-apm-project-writer-locking

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/507-apm-project-writer-locking

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Patch manager mutation boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project_path = Path('src/host/orchestrator/projectManager.ts')
          project = project_path.read_text()
          project_import = "import {\n  ProjectCreationValidationError,\n  validateProjectCreationInput,\n} from '../../projectIdentity';"
          project = project.replace(
              project_import,
              "import { createStudioProjectWriterProxy } from '../../features/project-updates/composition/createStudioProjectWriterProxy';\n" + project_import,
              1,
          )
          project_end = "    };\n  }\n\n  /*** List persisted Studio project summaries for the workspace. */"
          project_guard = """    };
              return createStudioProjectWriterProxy(this, {
                owner: 'project-manager',
                firstArgumentProjectIdMethods: [
                  'deleteProject',
                  'installProjectPackages',
                  'connectProjectRepository',
                  'regenerateInfrastructure',
                ],
                objectArgumentProjectIdMethods: [
                  'persistProjectManifest',
                  'saveProjectManifest',
                  'syncProjectRuntime',
                  'rebuildRootLayout',
                  'syncProject',
                ],
                resolveProjectRoot: (projectId) => getProjectPath(rootPath, projectId),
              });
            }

            /*** List persisted Studio project summaries for the workspace. */"""
          if project_import not in project or project_end not in project:
              raise SystemExit('projectManager patch anchor not found')
          project_path.write_text(project.replace(project_end, project_guard, 1))

          module_path = Path('src/host/orchestrator/moduleManager.ts')
          module = module_path.read_text()
          module_import = "import { findNodeInManifest, updateStudioManifestNode } from '../../manifestState';"
          module = module.replace(
              module_import,
              "import { createStudioProjectWriterProxy } from '../../features/project-updates/composition/createStudioProjectWriterProxy';\n" + module_import,
              1,
          )
          module_end = "    this.adapter = new LocalFsTargetAdapter();\n  }\n\n  /*** List module states projected with host contribution metadata and pending-removal state. */"
          module_guard = """    this.adapter = new LocalFsTargetAdapter();
              return createStudioProjectWriterProxy(this, {
                owner: 'module-manager',
                firstArgumentProjectIdMethods: [
                  'installModule',
                  'uninstallModule',
                  'updateModuleConfig',
                  'executeModuleAdminOperation',
                  'applyPendingOperations',
                  'persistProjectManifest',
                  'syncProjectRuntime',
                  'saveProjectManifest',
                  'rebuildRootLayout',
                ],
                objectArgumentProjectIdMethods: ['syncProject'],
                resolveProjectRoot: (projectId) => this.getAppPath(projectId),
              });
            }

            /*** List module states projected with host contribution metadata and pending-removal state. */"""
          if module_import not in module or module_end not in module:
              raise SystemExit('moduleManager patch anchor not found')
          module_path.write_text(module.replace(module_end, module_guard, 1))
          PY

      - name: Upgrade released APM dependency
        run: bun add '@ankhorage/apm@^0.7.0'

      - name: Remove one-shot workflow
        run: git rm .github/workflows/branch-507-implementation.yml

      - name: Format touched sources
        run: bunx @ankhorage/devtools prettier --write src/host/orchestrator/projectManager.ts src/host/orchestrator/moduleManager.ts src/features/project-updates/composition package.json bun.lock

      - name: Commit implementation
        run: |
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: serialize Studio project writers"
          git push origin HEAD:fix/507-apm-project-writer-locking
