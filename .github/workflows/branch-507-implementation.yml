name: Branch 507 implementation

on:
  push:
    branches:
      - fix/507-apm-project-writer-locking

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/507-apm-project-writer-locking

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Patch manager mutation boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project_path = Path('src/host/orchestrator/projectManager.ts')
          project = project_path.read_text()
          project_import = "import {\n  ProjectCreationValidationError,\n  validateProjectCreationInput,\n} from '../../projectIdentity';"
          project_import_replacement = "import { createStudioProjectWriterProxy } from '../../features/project-updates/composition/createStudioProjectWriterProxy';\n" + project_import
          if project_import not in project:
              raise SystemExit('projectManager import anchor not found')
          project = project.replace(project_import, project_import_replacement, 1)

          project_constructor = """    this.dependencies = {
              connectGitHubRepositoryAsync,
              reconcileProjectPackageRootAsync,
              runProjectInfrastructureLifecycle,
              ...dependencies,
            };
          }"""
          project_constructor_replacement = """    this.dependencies = {
              connectGitHubRepositoryAsync,
              reconcileProjectPackageRootAsync,
              runProjectInfrastructureLifecycle,
              ...dependencies,
            };
            return createStudioProjectWriterProxy(this, {
              owner: 'project-manager',
              firstArgumentProjectIdMethods: [
                'deleteProject',
                'installProjectPackages',
                'connectProjectRepository',
                'regenerateInfrastructure',
              ],
              objectArgumentProjectIdMethods: [
                'persistProjectManifest',
                'saveProjectManifest',
                'syncProjectRuntime',
                'rebuildRootLayout',
                'syncProject',
              ],
              resolveProjectRoot: (projectId) => getProjectPath(rootPath, projectId),
            });
          }"""
          if project_constructor not in project:
              raise SystemExit('projectManager constructor anchor not found')
          project_path.write_text(project.replace(project_constructor, project_constructor_replacement, 1))

          module_path = Path('src/host/orchestrator/moduleManager.ts')
          module = module_path.read_text()
          module_import = "import { findNodeInManifest, updateStudioManifestNode } from '../../manifestState';"
          module_import_replacement = "import { createStudioProjectWriterProxy } from '../../features/project-updates/composition/createStudioProjectWriterProxy';\n" + module_import
          if module_import not in module:
              raise SystemExit('moduleManager import anchor not found')
          module = module.replace(module_import, module_import_replacement, 1)

          module_constructor = """  constructor(rootPath: string) {
              this.appsRoot = path.join(rootPath, 'apps');
              this.projectManager = new ProjectManager(rootPath);
              this.adapter = new LocalFsTargetAdapter();
            }"""
          module_constructor_replacement = """  constructor(rootPath: string) {
              this.appsRoot = path.join(rootPath, 'apps');
              this.projectManager = new ProjectManager(rootPath);
              this.adapter = new LocalFsTargetAdapter();
              return createStudioProjectWriterProxy(this, {
                owner: 'module-manager',
                firstArgumentProjectIdMethods: [
                  'installModule',
                  'uninstallModule',
                  'updateModuleConfig',
                  'executeModuleAdminOperation',
                  'applyPendingOperations',
                  'persistProjectManifest',
                  'syncProjectRuntime',
                  'saveProjectManifest',
                  'rebuildRootLayout',
                ],
                objectArgumentProjectIdMethods: ['syncProject'],
                resolveProjectRoot: (projectId) => this.getAppPath(projectId),
              });
            }"""
          if module_constructor not in module:
              raise SystemExit('moduleManager constructor anchor not found')
          module_path.write_text(module.replace(module_constructor, module_constructor_replacement, 1))
          PY

      - name: Upgrade released APM dependency
        run: bun add '@ankhorage/apm@^0.7.0'

      - name: Remove one-shot workflow
        run: git rm .github/workflows/branch-507-implementation.yml

      - name: Commit implementation
        run: |
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: serialize Studio project writers"
          git push origin HEAD:fix/507-apm-project-writer-locking
