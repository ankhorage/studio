name: ADM12 update keyed toggle expectations

on:
  push:
    branches:
      - issue-127/canonical-theme-mode

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-127/canonical-theme-mode
      - name: Update exact expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/host/layout/templates/rootLayout.test.ts')
          text = path.read_text()
          old = "<ThemeModeToggle />"
          new = "<ThemeModeToggle key=\"theme-mode\" />"
          if text.count(old) != 3:
              raise SystemExit(f'expected three unkeyed toggle assertions, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/adm12-update-toggle-expectations.yml
      - name: Commit focused expectation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/host/layout/templates/rootLayout.test.ts .github/workflows/adm12-update-toggle-expectations.yml
          git commit -m "Expect keyed generated theme mode toggle"
          git push origin HEAD:issue-127/canonical-theme-mode
