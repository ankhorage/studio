name: Issue 520 reapply on current main

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: write

jobs:
  reapply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install current main graph
        run: bun install --frozen-lockfile
      - name: Reapply issue 520 product changes
        run: |
          git show origin/backup/520-acceptance-baseline-final:src/host/layout/templates/auth/screen.ts > src/host/layout/templates/auth/screen.ts
          git show origin/backup/520-acceptance-baseline-final:src/host/smoke/assertExpo57StudioStandaloneContractAsync.ts > src/host/smoke/assertExpo57StudioStandaloneContractAsync.ts
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('package.json')
          package = json.loads(root.read_text())
          package['dependencies']['@ankhorage/expo-runtime'] = '^3.2.15'
          package['dependencies']['expo-image-picker'] = '~57.0.18'
          package['peerDependencies']['expo'] = '57.0.23'
          root.write_text(json.dumps(package, indent=2) + '\n')

          app = Path('apps/studio/package.json')
          package = json.loads(app.read_text())
          package['dependencies']['@ankhorage/expo-runtime'] = '^3.2.15'
          package['dependencies']['expo'] = '57.0.23'
          app.write_text(json.dumps(package, indent=2) + '\n')

          metro = Path('apps/studio/metro.config.js')
          metro.write_text("""const path = require('node:path');
          const { getDefaultConfig } = require('expo/metro-config');

          const config = getDefaultConfig(__dirname);
          config.resolver.emptyModulePath = path.resolve(__dirname, 'metro.empty-module.js');

          module.exports = config;
          """.replace('          ', ''))

          template = Path('src/host/orchestrator/templateSources.ts')
          text = template.read_text()
          start = text.find("const projectRootPrefix = escapeRegExp(path.resolve(__dirname))")
          if start < 0:
              raise SystemExit('generated Metro blocklist start not found')
          module_exports = text.find('module.exports = config;', start)
          if module_exports < 0:
              raise SystemExit('generated Metro module.exports not found')
          function_start = text.find('\nfunction escapeRegExp(value) {', module_exports)
          if function_start < 0:
              raise SystemExit('generated Metro escapeRegExp function not found')
          function_end = text.find('\n}', function_start)
          if function_end < 0:
              raise SystemExit('generated Metro escapeRegExp function end not found')
          text = text[:start] + text[module_exports:function_start] + text[function_end + 2:]
          template.write_text(text)

          templates_test = Path('src/host/orchestrator/templates.test.ts')
          text = templates_test.read_text()
          text = text.replace(
              "    expect(metro).toContain('const ancestorNodeModules = new RegExp(');\n    expect(metro).toContain('config.resolver.blockList = [');\n",
              "    expect(metro).not.toContain('ancestorNodeModules');\n    expect(metro).not.toContain('config.resolver.blockList = [');\n",
          )
          templates_test.write_text(text)

          standalone_navigation = Path('src/host/smoke/runExpo57GeneratedNavigationAcceptance.ts')
          text = standalone_navigation.read_text()
          text = text.replace(
              "    !metroConfig.includes('ancestorNodeModules') ||\n    metroConfig.includes('disableHierarchicalLookup') ||\n",
              "    metroConfig.includes('ancestorNodeModules') ||\n    metroConfig.includes('config.resolver.blockList = [') ||\n    metroConfig.includes('disableHierarchicalLookup') ||\n",
          )
          standalone_navigation.write_text(text)

          changeset = Path('.changeset/restore-full-acceptance-baseline.md')
          changeset.write_text("""---
          '@ankhorage/studio': patch
          ---

          Restore generated-app and standalone registry acceptance by emitting formatter-stable Auth screen imports, validating owner ranges from the installed Studio dependency graph, aligning the Expo 57.0.23 consumer contract, and allowing Metro to crawl nested package-owned dependencies instead of excluding them with a custom node_modules blocklist.
          """.replace('          ', ''))
          PY
      - name: Regenerate current lockfiles
        run: |
          bun install
          rm apps/studio/bun.lock
          bun install --cwd apps/studio --lockfile-only
      - name: Validate current-main product slice
        run: |
          bun run format
          bun run build
          bun test src/host/orchestrator/templates.test.ts
          bun run check-types
          bun run lint
          bun run knip:check
          bun run format:check
          bun run changeset:status
      - name: Commit clean issue 520 diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/issue-520-reapply.yml
          git commit -m 'fix: restore full Studio acceptance baseline'
      - name: Remove temporary workflow and push
        run: |
          git rm .github/workflows/issue-520-reapply.yml
          git commit -m 'chore: finalize Studio baseline rebase'
          git push origin HEAD:fix/520-acceptance-baseline
