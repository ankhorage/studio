name: Auth 4 Phase 2 implementation

on:
  push:
    branches:
      - agent/auth4-canonical-target-generation
    paths:
      - .github/workflows/auth4-phase2-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth4-canonical-target-generation
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply target-aware generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/auth4-patch-templates.py')
          text = path.read_text()
          old = 'updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)'
          new = 'updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)'
          if text.count(old) != 1:
              raise SystemExit('regex replacement helper shape changed')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 scripts/auth4-patch-templates.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/host/orchestrator/templates.ts')
          text = path.read_text()
          pattern = r"  return sections\.length > 0 \? `[\s\S]*?` : '';\n}\n\nexport function getAppConfigTs"
          replacement = "  return sections.length > 0\n    ? String.fromCharCode(10) + sections.join(String.fromCharCode(10))\n    : '';\n}\n\nexport function getAppConfigTs"
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('target section newline normalization failed')
          path.write_text(text)

          for filename in [
              'src/host/orchestrator/templates.ts',
              'src/host/orchestrator/scaffolder.ts',
          ]:
              path = Path(filename)
              text = path.read_text()
              old = "const LEGACY_WEB_ONLY_TARGETS = { web: { enabled: true } } as const satisfies AppDeployTargets;"
              new = "const LEGACY_WEB_ONLY_TARGETS: AppDeployTargets = { web: { enabled: true } };"
              if text.count(old) != 1:
                  raise SystemExit(f'{filename}: legacy target fallback shape changed')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Refresh dependencies
        run: bun install

      - name: Format and validate
        run: |
          bun run format
          bun test src/host/orchestrator/appTargetGeneration.test.ts src/host/orchestrator/templates.test.ts src/host/oauthFixtureConsumer.smoke.test.ts
          bun run build
          bun run typecheck
          bun run lint
          bun run knip
          bun run docs
          bun run format
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src docs .changeset paradox README.md
          git commit -m "Consume canonical app targets in Studio generation"
          git push origin HEAD:agent/auth4-canonical-target-generation
