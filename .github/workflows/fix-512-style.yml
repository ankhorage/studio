name: Fix Studio 512 style

on:
  push:
    branches:
      - fix/145-current-infra-consumer
    paths:
      - '.github/workflows/fix-512-style.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-current-infra-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Apply canonical lint and format fixes
        run: |
          bun run lint:fix
          bun run format
      - name: Commit fixes and remove helper
        run: |
          rm .github/workflows/fix-512-style.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m 'style: apply current Studio lint rules'
          git push origin HEAD:fix/145-current-infra-consumer
