name: Sync APM dependency

on:
  push:
    branches:
      - feat/500-apm-projection-audit
    paths:
      - .github/workflows/500-add-apm-dependency.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/500-apm-projection-audit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun add '@ankhorage/apm@^0.5.0'
      - run: rm .github/workflows/500-add-apm-dependency.yml
      - name: Commit dependency and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock .github/workflows/500-add-apm-dependency.yml
          git commit -m 'chore: add APM host dependency'
          git push origin HEAD:feat/500-apm-projection-audit
