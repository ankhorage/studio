name: Finalize issue 183 branch

on:
  push:
    branches:
      - 183-standalone-template-consumer

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: 183-standalone-template-consumer
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Align dependency contract and lockfile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.dependencies['@ankhorage/contracts'] = '^8.2.0';
          packageJson.dependencies['@ankhorage/templates'] = '^9.1.3';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          bun install

      - name: Apply repository-owned fixes
        run: |
          bun run lint:fix
          bun run docs
          bun run format

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-finalize-183.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: finalize standalone template consumer'
          git push origin HEAD:183-standalone-template-consumer
