name: Finalize issue 183 branch

on:
  push:
    branches:
      - 183-standalone-template-consumer

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: 183-standalone-template-consumer
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Migrate remaining large smoke fixtures
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact match, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'src/host/generatedAuthAdapterRuntime.smoke.test.ts',
              "import { getTemplateCatalog } from './templateRegistry';",
              "import { createSmokeProjectSource } from './smoke/createSmokeProjectSource';",
          )
          replace_once(
              'src/host/generatedAuthAdapterRuntime.smoke.test.ts',
              """  const template = getTemplateCatalog()\n    .categories.find((candidate) => candidate.id === 'developer_tools')\n    ?.templates.at(0);\n  if (!template) {\n    throw new Error('Published templates package returned no developer-tools template.');\n  }\n\n  const created = await projectManager.createProject(\n    PROJECT_NAME,\n    { category: 'developer_tools', templateId: template.templateId },\n    undefined,\n    { includeStudio: false },\n  );""",
              """  const created = await projectManager.createProject(\n    PROJECT_NAME,\n    createSmokeProjectSource(),\n    undefined,\n    { includeStudio: false },\n  );""",
          )

          replace_once(
              'src/host/generatedAdminExpoWeb.smoke.test.ts',
              "import { getProjectTemplate, getTemplateCatalog } from './templateRegistry';",
              "import { createAdminSmokeBaseManifest } from './smoke/createAdminSmokeBaseManifest';",
          )
          replace_once(
              'src/host/generatedAdminExpoWeb.smoke.test.ts',
              """  const nutritionManifest = getProjectTemplate({\n    category: 'food_drink',\n    templateId: 'nutrition-catalog-scan',\n  });""",
              "  const nutritionManifest = createAdminSmokeBaseManifest();",
          )
          replace_once(
              'src/host/generatedAdminExpoWeb.smoke.test.ts',
              """  const template = getTemplateCatalog()\n    .categories.find((candidate) => candidate.id === 'developer_tools')\n    ?.templates.at(0);\n  if (!template)\n    throw new Error('Published templates package returned no developer-tools template.');\n\n  const created = await projectManager.createProject(\n    'Generated Admin Web Smoke',\n    { category: 'developer_tools', templateId: template.templateId },\n    undefined,\n    { includeStudio: true },\n  );""",
              """  const created = await projectManager.createProject(\n    'Generated Admin Web Smoke',\n    { manifest: createAdminSmokeManifest(), assets: [] },\n    undefined,\n    { includeStudio: true },\n  );""",
          )

          workspace_path = Path('src/host/studioWorkspaceExpoWeb.smoke.test.ts')
          workspace = workspace_path.read_text()
          workspace = workspace.replace(
              "const FIXTURE_PROJECT_ID = 'release-monitor';\nconst FIXTURE_PROJECT_NAME = 'Release Monitor';",
              "const FIXTURE_CATEGORY = 'developer_tools' as const;\nconst FIXTURE_CATEGORY_LABEL = 'Developer Tools';\nconst FIXTURE_PROJECT_ID = 'release-monitor';\nconst FIXTURE_PROJECT_NAME = 'Release Monitor';",
              1,
          )
          workspace = workspace.replace(
              """      const { category, template } = await getSmokeTemplateSelection();\n      await createSmokeWorkspaceFixture(workspaceRoot, category.id);""",
              "      await createSmokeWorkspaceFixture(workspaceRoot, FIXTURE_CATEGORY);",
              1,
          )
          workspace = workspace.replace(
              "await expectRouteText(page, `${appUrl}/create`, ['New Project', category.label]);",
              "await expectRouteText(page, `${appUrl}/create`, ['New Project', FIXTURE_CATEGORY_LABEL]);",
              1,
          )
          workspace = re.sub(
              r"        await expectRouteText\(page, `\$\{appUrl\}/create/\$\{category\.id\}`, \[\n          category\.label,\n          template\.name,\n        \]\);\n\n        await expectRouteText\(page, `\$\{appUrl\}/create/\$\{category\.id\}/\$\{template\.templateId\}`, \[\n          'Create Project',\n          template\.name,\n          'Project name',\n        \]\);",
              """        await expectRouteText(page, `${appUrl}/create/${FIXTURE_CATEGORY}`, [\n          FIXTURE_CATEGORY_LABEL,\n          'No templates in this category',\n        ]);""",
              workspace,
              count=1,
          )
          workspace = workspace.replace(
              "`${appUrl}/create/${category.id}/not-a-template`",
              "`${appUrl}/create/${FIXTURE_CATEGORY}/not-a-template`",
              1,
          )
          workspace, count = re.subn(
              r"\nasync function getSmokeTemplateSelection\(\) \{.*?\n\}\n\nasync function createSmokeWorkspaceFixture",
              "\nasync function createSmokeWorkspaceFixture",
              workspace,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'studioWorkspaceExpoWeb.smoke.test.ts: selection helper replacement count={count}')
          workspace_path.write_text(workspace)

          project_manager = Path('src/host/orchestrator/projectManager.ts')
          text = project_manager.read_text()
          text = text.replace(
              '    const category = templateData.metadata.category;',
              '    const { category } = templateData.metadata;',
              1,
          )
          project_manager.write_text(text)
          PY

      - name: Align dependency contract and lockfile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.dependencies['@ankhorage/contracts'] = '^8.2.0';
          packageJson.dependencies['@ankhorage/templates'] = '^9.1.3';
          packageJson.overrides['@ankhorage/contracts'] = '^8.2.0';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          bun install

      - name: Apply repository-owned autofixes
        run: |
          bun run lint:fix || true
          bun run format

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/tmp-finalize-183.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: finalize standalone template consumer'
          git push origin HEAD:183-standalone-template-consumer
