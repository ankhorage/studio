name: Migrate Studio project Infra boundary

on:
  push:
    branches:
      - fix/145-current-infra-consumer
    paths:
      - '.github/workflows/migrate-512-project-manager.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-current-infra-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Migrate ProjectManager to typed Infra lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/host/orchestrator/projectManager.ts')
          text = path.read_text()

          text = text.replace("""import {
            inspectProjectInfrastructure,
            runProjectInfrastructureLifecycle,
            syncProjectInfrastructure,
          } from '@ankhorage/infra/project';
          """, "")
          text = text.replace(
            "import { createStudioProjectWriterProxy } from '../../features/project-updates/composition/createStudioProjectWriterProxy';\n",
            "import { createStudioProjectInfraLifecycle } from '../../features/infrastructure/composition/createStudioProjectInfraLifecycle';\nimport { createStudioProjectWriterProxy } from '../../features/project-updates/composition/createStudioProjectWriterProxy';\n",
          )
          text = text.replace(
            "  readonly runProjectInfrastructureLifecycle: typeof runProjectInfrastructureLifecycle;\n",
            "  readonly infraLifecycle: ReturnType<typeof createStudioProjectInfraLifecycle>;\n",
          )
          text = text.replace(
            "      runProjectInfrastructureLifecycle,\n",
            "      infraLifecycle: createStudioProjectInfraLifecycle(),\n",
          )

          old_delete = """      const manifest = await this.store.readManifest(projectId);
                const infraStatus = await inspectProjectInfrastructure({
                  projectId,
                  projectPath,
                  manifest,
                });

                if (!infraStatus.skipped && infraStatus.hasDeployment && infraStatus.target) {
                  await syncProjectInfrastructure({ projectId, projectPath, manifest });
                  await this.destroyProjectInfrastructure(projectId, projectPath, infraStatus.target);
                  infraDestroyed = true;
                }
          """
          new_delete = """      if (projectId !== 'studio') {
                  const manifest = await this.store.readManifest(projectId);
                  await this.dependencies.infraLifecycle.destroyAsync({
                    projectId,
                    projectPath,
                    manifest,
                    deletePersistentResources: true,
                  });
                  infraDestroyed = true;
                }
          """
          if old_delete not in text:
            raise SystemExit('deleteProject legacy block not found')
          text = text.replace(old_delete, new_delete)

          text = text.replace(
            "    await syncProjectInfrastructure({ projectId: slug, projectPath, manifest });\n",
            "    await this.dependencies.infraLifecycle.generateAsync({ projectId: slug, projectPath, manifest });\n",
          )
          text = text.replace(
            "    await syncProjectInfrastructure({ projectId, projectPath, manifest: updated });\n",
            "    await this.dependencies.infraLifecycle.generateAsync({ projectId, projectPath, manifest: updated });\n",
          )
          text = text.replace(
            "    await syncProjectInfrastructure({ projectId, projectPath, manifest });\n",
            "    await this.dependencies.infraLifecycle.generateAsync({ projectId, projectPath, manifest });\n",
          )

          old_methods = """  /*** Regenerate the infrastructure projection for one persisted project manifest. */
            async regenerateInfrastructure(projectId: string) {
              const projectPath = getProjectPath(this.rootPath, projectId);
              const manifest = await this.getProjectManifest(projectId);
              return syncProjectInfrastructure({ projectId, projectPath, manifest });
            }

            /*** Inspect current infrastructure status for one persisted project manifest. */
            async getInfrastructureStatus(projectId: string) {
              const projectPath = getProjectPath(this.rootPath, projectId);
              const manifest = await this.getProjectManifest(projectId);
              return inspectProjectInfrastructure({ projectId, projectPath, manifest });
            }
          """
          new_methods = """  /*** Regenerate provider-neutral infrastructure artifacts for one persisted project manifest. */
            async regenerateInfrastructure(projectId: string) {
              const projectPath = getProjectPath(this.rootPath, projectId);
              const manifest = await this.getProjectManifest(projectId);
              return this.dependencies.infraLifecycle.generateAsync({ projectId, projectPath, manifest });
            }

            /*** Reconcile one project's selected infrastructure environment to its desired running state. */
            async upInfrastructure(
              projectId: string,
              executionEnvironment?: Readonly<Record<string, string | undefined>>,
            ) {
              const projectPath = getProjectPath(this.rootPath, projectId);
              const manifest = await this.getProjectManifest(projectId);
              return this.dependencies.infraLifecycle.upAsync({
                projectId,
                projectPath,
                manifest,
                ...(executionEnvironment === undefined ? {} : { executionEnvironment }),
              });
            }

            /*** Inspect provider-neutral infrastructure status for one persisted project manifest. */
            async getInfrastructureStatus(projectId: string) {
              const projectPath = getProjectPath(this.rootPath, projectId);
              const manifest = await this.getProjectManifest(projectId);
              return this.dependencies.infraLifecycle.statusAsync({ projectId, projectPath, manifest });
            }

            /*** Read canonical infrastructure outputs for one persisted project manifest. */
            async getInfrastructureOutputs(projectId: string) {
              const projectPath = getProjectPath(this.rootPath, projectId);
              const manifest = await this.getProjectManifest(projectId);
              return this.dependencies.infraLifecycle.outputsAsync({ projectId, projectPath, manifest });
            }

            /*** Suspend one project's selected infrastructure environment without deleting persistent resources. */
            async downInfrastructure(projectId: string) {
              const projectPath = getProjectPath(this.rootPath, projectId);
              const manifest = await this.getProjectManifest(projectId);
              return this.dependencies.infraLifecycle.downAsync({ projectId, projectPath, manifest });
            }

            /*** Destroy one project's selected infrastructure environment with explicit persistence policy. */
            async destroyInfrastructure(projectId: string, deletePersistentResources: boolean) {
              const projectPath = getProjectPath(this.rootPath, projectId);
              const manifest = await this.getProjectManifest(projectId);
              return this.dependencies.infraLifecycle.destroyAsync({
                projectId,
                projectPath,
                manifest,
                deletePersistentResources,
              });
            }
          """
          if old_methods not in text:
            raise SystemExit('legacy ProjectManager infra methods not found')
          text = text.replace(old_methods, new_methods)

          start = text.find("  /*** Execute infrastructure teardown and wrap provider/lifecycle failures with project context. */")
          end = text.find("  /*** Generate current app files, write them to disk", start)
          if start < 0 or end < 0:
            raise SystemExit('legacy destroy helper not found')
          text = text[:start] + text[end:]

          path.write_text(text)
          PY

          rm .github/workflows/migrate-512-project-manager.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m 'refactor: use typed Studio infrastructure lifecycle'
          git push origin HEAD:fix/145-current-infra-consumer

      - name: Validate production build after migration
        run: |
          bun install --frozen-lockfile
          bun run build
