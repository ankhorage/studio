name: Temporary #538 Minikube sync

on:
  push:
    branches:
      - test/538-fresh-template-infra-up

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: test/538-fresh-template-infra-up
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Merge current main and require image-seeded Minikube runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['dependencies']['@ankhorage/minikube'] = '^0.4.4'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          workflow_path = Path('.github/workflows/fresh-template-infra.yml')
          workflow = workflow_path.read_text()
          workflow = workflow.replace(
              '          const infraPath = fileURLToPath(import.meta.resolve("@ankhorage/infra/package.json"));\n',
              '          const infraPath = fileURLToPath(import.meta.resolve("@ankhorage/infra/package.json"));\n'
              '          const minikubePath = fileURLToPath(import.meta.resolve("@ankhorage/minikube/package.json"));\n'
              '          const minikube = await Bun.file(minikubePath).json();\n'
              '          const kubernetesPath = fileURLToPath(import.meta.resolve("@ankhorage/kubernetes/package.json", minikubePath));\n'
              '          const kubernetes = await Bun.file(kubernetesPath).json();\n'
          )
          workflow = workflow.replace(
              '          const infraRange = packageJson.dependencies?.["@ankhorage/infra"];\n',
              '          const infraRange = packageJson.dependencies?.["@ankhorage/infra"];\n'
              '          const minikubeRange = packageJson.dependencies?.["@ankhorage/minikube"];\n'
              '          const kubernetesRange = minikube.dependencies?.["@ankhorage/kubernetes"];\n'
          )
          workflow = workflow.replace(
              '          if (typeof infraRange !== "string" || !Bun.semver.satisfies(infra.version, infraRange)) {\n'
              '            throw new Error(`Resolved Infra ${infra.version} does not satisfy ${infraRange ?? "<missing>"}.`);\n'
              '          }\n',
              '          if (typeof infraRange !== "string" || !Bun.semver.satisfies(infra.version, infraRange)) {\n'
              '            throw new Error(`Resolved Infra ${infra.version} does not satisfy ${infraRange ?? "<missing>"}.`);\n'
              '          }\n'
              '          if (typeof minikubeRange !== "string" || !Bun.semver.satisfies(minikube.version, minikubeRange)) {\n'
              '            throw new Error(`Resolved Minikube ${minikube.version} does not satisfy ${minikubeRange ?? "<missing>"}.`);\n'
              '          }\n'
              '          if (typeof kubernetesRange !== "string" || !Bun.semver.satisfies(kubernetes.version, kubernetesRange)) {\n'
              '            throw new Error(`Resolved Kubernetes ${kubernetes.version} does not satisfy Minikube range ${kubernetesRange ?? "<missing>"}.`);\n'
              '          }\n'
              '          if (!Bun.semver.satisfies(kubernetes.version, ">=0.8.0")) {\n'
              '            throw new Error(`Resolved Kubernetes ${kubernetes.version} lacks image-seeded persistence semantics.`);\n'
              '          }\n'
          )
          workflow = workflow.replace(
              '          console.log(`Infra: ${infra.version} (${infraRange})`);\n',
              '          console.log(`Infra: ${infra.version} (${infraRange})`);\n'
              '          console.log(`Minikube: ${minikube.version} (${minikubeRange})`);\n'
              '          console.log(`Kubernetes: ${kubernetes.version} (${kubernetesRange})`);\n'
          )
          workflow_path.write_text(workflow)
          PY
          rm -rf ~/.bun/install/cache
          bun install
          bun run docs
          bun run format
          rm .github/workflows/sync-538-minikube-temporary.yml
          bun --eval '
          import { fileURLToPath } from "node:url";
          const minikubePath = fileURLToPath(import.meta.resolve("@ankhorage/minikube/package.json"));
          const minikube = await Bun.file(minikubePath).json();
          const kubernetesPath = fileURLToPath(import.meta.resolve("@ankhorage/kubernetes/package.json", minikubePath));
          const kubernetes = await Bun.file(kubernetesPath).json();
          if (!Bun.semver.satisfies(minikube.version, "^0.4.4")) throw new Error(`Expected Minikube ^0.4.4, got ${minikube.version}`);
          if (!Bun.semver.satisfies(kubernetes.version, ">=0.8.0")) throw new Error(`Expected image-seeded Kubernetes >=0.8.0, got ${kubernetes.version}`);
          console.log(`Minikube ${minikube.version} -> Kubernetes ${kubernetes.version}`);
          '
          bun run build
          bun run check-types
          bun run lint
          bun run knip:check
          bun run changeset:status
          bun run format:check
          git add -A
          git commit -m "fix(studio): consume image-seeded Minikube runtime"
          git push origin HEAD:test/538-fresh-template-infra-up
