name: Format ADM 6

on:
  push:
    branches:
      - agent/adm-6-binding-authoring

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun run lint:fix
      - run: bun run format
      - name: Remove temporary formatter
        run: rm .github/workflows/format-adm6.yml
      - name: Commit formatted model
        run: |
          git config user.name "Fabio Gartenmann"
          git config user.email "137318798+artiphishle@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format ADM 6 binding model"
          git push origin HEAD:agent/adm-6-binding-authoring
