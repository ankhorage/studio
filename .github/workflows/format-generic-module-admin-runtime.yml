name: Format generic module admin runtime

on:
  push:
    branches:
      - 'issue#126/generic-module-admin-runtime'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'issue#126/generic-module-admin-runtime'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun run lint:fix
      - run: bun run format
      - run: bun run docs
      - name: Commit generated formatting and docs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Format generic module admin runtime'
          git push origin HEAD:'issue#126/generic-module-admin-runtime'
