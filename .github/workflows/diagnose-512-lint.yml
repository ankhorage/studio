name: Diagnose Studio 512 lint

on:
  push:
    branches:
      - fix/145-current-infra-consumer
    paths:
      - '.github/workflows/diagnose-512-lint.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-current-infra-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Capture lint diagnostics
        run: bun run lint > lint-report-512.txt 2>&1 || true
      - name: Commit report and remove helper
        run: |
          rm .github/workflows/diagnose-512-lint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lint-report-512.txt .github/workflows/diagnose-512-lint.yml
          git commit -m 'chore: capture Studio 512 lint diagnostics'
          git push origin HEAD:fix/145-current-infra-consumer
