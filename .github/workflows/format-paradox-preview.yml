name: Format Paradox preview

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format repository
        run: bun run format

      - name: Commit formatted Paradox artifacts and remove temporary workflow
        run: |
          git add paradox/exports.json paradox/exports.md paradox/index.html paradox/paradox.json
          git rm .github/workflows/format-paradox-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: format generated Paradox documentation"
          git push origin HEAD:${{ github.head_ref }}
