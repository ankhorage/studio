name: Refresh Localization 0.5.2

on:
  push:
    branches:
      - 'issue#126/localization-studio-integration'
    paths:
      - '.github/workflows/refresh-localization-052.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'issue#126/localization-studio-integration'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun add '@ankhorage/orchestrator-module-expo-localization@^0.5.2'
      - name: Commit dependency refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'Consume localization 0.5.2'
          git push
