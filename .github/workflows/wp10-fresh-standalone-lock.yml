name: WP10 fresh standalone lock

on:
  push:
    branches:
      - fix/705-final-main-acceptance

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Regenerate standalone app lockfile
        run: |
          rm apps/studio/bun.lock
          bun install --cwd apps/studio --lockfile-only
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/bun.lock
          git commit -m "chore(platform): regenerate standalone Expo lockfile"
          git push
