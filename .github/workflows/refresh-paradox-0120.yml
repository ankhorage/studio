name: Refresh docs with Paradox 0.1.20

on:
  push:
    branches:
      - 'issue#126/generic-module-admin-runtime'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'issue#126/generic-module-admin-runtime'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install
      - run: bun run docs
      - run: bun run format
      - name: Reject machine-specific generated paths
        run: |
          if grep -R -n -E '/Users/|/home/runner/' README.md paradox; then
            echo 'Machine-specific path found in generated docs.' >&2
            exit 1
          fi
      - name: Commit deterministic docs and lockfile
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock README.md paradox
          git commit -m 'Regenerate docs with Paradox 0.1.20'
          git push origin HEAD:'issue#126/generic-module-admin-runtime'
