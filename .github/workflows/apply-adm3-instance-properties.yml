name: Apply ADM 3 instance Properties

on:
  push:
    branches:
      - agent/adm-3-instance-properties

permissions:
  contents: write

concurrency:
  group: adm-3-instance-properties
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/adm-3-instance-properties

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json

          files = {
              'src/propertiesAuthoringModel.ts': '',
              'src/propertiesAuthoringModel.test.ts': '',
              'src/ui/admin/pages/PropertiesAdminPage.tsx': '',
              'src/ui/admin/pages/PropertiesAdminPage.test.ts': '',
              'docs/instance-properties.md': '',
              '.changeset/neat-instance-properties.md': 'LS0tCiJAYW5raG9yYWdlL3N0dWRpbyI6IHBhdGNoCi0tLQoKUmVwbGFjZSB0aGUgcmF3IFByb3BlcnRpZXMgcHJvcCBkdW1wIHdpdGggYSBtZXRhZGF0YS1kcml2ZW4gaW5zdGFuY2UgYXV0aG9yaW5nIG1vZGVsIGJhY2tlZCBieSB0aGUgcmVsZWFzZWQgWk9SQSBhdXRob3JpbmcgYXV0aG9yaXR5IHJlZ2lzdHJ5Lgo=',
          }
          for path, encoded in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package['dependencies']['@ankhorage/zora'] = '^2.9.2'
          exports = package['exports']
          if './propertiesAuthoringModel' not in exports:
              reordered = {}
              for key, value in exports.items():
                  reordered[key] = value
                  if key == './manifestState':
                      reordered['./propertiesAuthoringModel'] = {
                          'types': './dist/propertiesAuthoringModel.d.ts',
                          'import': './dist/propertiesAuthoringModel.js',
                      }
              package['exports'] = reordered
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          index_path = Path('src/index.ts')
          index = index_path.read_text()
          export_line = "export * from './propertiesAuthoringModel';\n"
          if export_line not in index:
              marker = "import type { StudioAuthSettings, StudioAuthSettingsMutation } from './authSettings';\n"
              index = index.replace(marker, marker + "\n" + export_line)
          contract_marker = "  'StudioComponentMetaRegistry',\n"
          contract_addition = (
              contract_marker
              + "  'StudioInstancePropertyField',\n"
              + "  'resolveStudioInstancePropertyGroups',\n"
              + "  'createStudioInstancePropertyPatch',\n"
          )
          if "'StudioInstancePropertyField'" not in index:
              index = index.replace(contract_marker, contract_addition)
          index_path.write_text(index)
          PY

      - name: Update dependencies
        run: bun install

      - name: Fix lint and format
        shell: bash
        run: |
          set -o pipefail
          bun run lint:fix 2>&1 | tee /tmp/adm3-lint-fix.log
          bun run format
          bun run docs

      - name: Capture validation failure
        if: failure()
        shell: bash
        run: |
          cp /tmp/adm3-lint-fix.log adm3-lint-fix.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture adm 3 validation failure"
          git push origin HEAD:agent/adm-3-instance-properties

      - name: Build
        run: bun run build

      - name: Validate repository
        run: bunx @ankhorage/ankh doctor validate .

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Knip
        run: bun run knip

      - name: Tests
        run: bun run test

      - name: Typecheck package
        run: bun run typecheck

      - name: Typecheck Studio app
        run: bun run type-check:studio

      - name: Changeset status
        run: bun run changeset:status

      - name: Package smoke
        run: npm pack --dry-run

      - name: Commit implementation and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-adm3-instance-properties.yml
          git add -A
          git commit -m "feat: add metadata-driven instance properties"
          git push origin HEAD:agent/adm-3-instance-properties
