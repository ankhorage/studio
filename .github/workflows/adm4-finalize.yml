name: ADM4 Finalize

on:
  push:
    branches:
      - agent/adm-4-external-api-authoring

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/adm-4-external-api-authoring
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Align package metadata
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.exports['./externalApiAuthoring'] = {
            types: './dist/externalApiAuthoring.d.ts',
            import: './dist/externalApiAuthoring.js',
          };
          pkg.dependencies['@ankhorage/data-sources'] = '^0.6.0';
          pkg.dependencies = Object.fromEntries(
            Object.entries(pkg.dependencies).sort(([left], [right]) => left.localeCompare(right)),
          );
          for (const capability of ['studio.data-sources.connect', 'studio.data-sources.test']) {
            if (!pkg.ankh.capabilities.includes(capability)) pkg.ankh.capabilities.push(capability);
          }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Apply strict lint corrections
        run: |
          python <<'PY'
          from pathlib import Path

          Path('src/host/dataSources/requestTrustedExternalApi.test.ts').write_text("""import { describe, expect, test } from 'bun:test';

import { requestTrustedExternalApi } from './requestTrustedExternalApi';

async function readBlockedMessage(url: string): Promise<string> {
  try {
    await requestTrustedExternalApi(url, { method: 'GET', headers: {} });
    return '';
  } catch (error) {
    return error instanceof Error ? error.message : String(error);
  }
}

describe('trusted external API transport', () => {
  test('blocks cloud metadata targets before network access', async () => {
    expect(await readBlockedMessage('http://169.254.169.254/latest/meta-data')).toContain(
      'blocked by the trusted transport policy',
    );
  });

  test('blocks inline URL credentials', async () => {
    expect(await readBlockedMessage('https://user:secret@example.com/openapi.json')).toContain(
      'blocked by the trusted transport policy',
    );
  });
});
""")

          replacements = {
            'src/host/dataSources/requestTrustedExternalApi.ts': [
              ("  if (!response.body) return '';\n\n  const reader = response.body.getReader();", "  const reader = response.body.getReader();"),
            ],
            'src/host/dataSources/studioExternalApiService.test.ts': [
              ('        manifest = args.manifest;', '        const { manifest: nextManifest } = args;\n        manifest = nextManifest;'),
            ],
            'src/host/dataSources/studioExternalApiService.ts': [
              ('  return normalized ? normalized : undefined;', '  if (!normalized) return undefined;\n  return normalized;'),
            ],
            'src/ui/admin/pages/adminDataSourceOperations.ts': [
              ('        protocol: operation.protocol ?? endpoint.kind,', '        protocol: operation.protocol,'),
            ],
          }
          for path, changes in replacements.items():
            file_path = Path(path)
            text = file_path.read_text()
            for old, new in changes:
              if old not in text:
                raise SystemExit(f'Missing expected text in {path}: {old}')
              text = text.replace(old, new)
            file_path.write_text(text)
          PY

      - name: Install and generate
        run: |
          bun install
          bun run lint:fix
          bun run format
          bun run docs

      - name: Validate
        run: |
          bun run build
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run type-check:studio
          bun run changeset:status

      - name: Commit generated changes and remove helper
        run: |
          rm .github/workflows/adm4-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize external API authoring"
          git push origin HEAD:agent/adm-4-external-api-authoring
