name: Update auth2 lock

on:
  push:
    branches:
      - agent/auth-2-studio-runtime-diagnostics

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth-2-studio-runtime-diagnostics
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Resolve released Infra dependency
        run: bun install

      - name: Commit generated lock and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/update-auth2-lock.yml
          git commit -m "Update Bun lockfile for Infra 1.1.0"
          git push
