name: ADM-14 Bundled Template Integrate

on:
  push:
    branches:
      - agent/adm14-bundled-assets-authoring

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generated app dependency template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/host/orchestrator/templates.ts')
          s = p.read_text()
          changes = [
            ("const EXPO_RUNTIME_VERSION = '^2.1.0';", "const EXPO_RUNTIME_VERSION = '^2.2.0';"),
            ("      '@ankhorage/data-sources': DATA_SOURCES_VERSION,\n      '@ankhorage/runtime': RUNTIME_VERSION,", "      '@ankhorage/data-sources': DATA_SOURCES_VERSION,\n      '@ankhorage/expo-runtime': EXPO_RUNTIME_VERSION,\n      '@ankhorage/runtime': RUNTIME_VERSION,"),
            ("            '@ankhorage/expo-runtime': EXPO_RUNTIME_VERSION,\n            '@expo/vector-icons': '^15.0.3',", "            '@expo/vector-icons': '^15.0.3',"),
          ]
          for old, new in changes:
              if old not in s: raise SystemExit('template integration anchor missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
          p = Path('package.json')
          s = p.read_text()
          old = '"@ankhorage/expo-runtime": "^2.1.0"'
          if old not in s: raise SystemExit('package dependency anchor missing')
          p.write_text(s.replace(old, '"@ankhorage/expo-runtime": "^2.2.0"', 1))
          PY
          git diff --check -- src/host/orchestrator/templates.ts package.json
      - name: Commit template integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/host/orchestrator/templates.ts package.json
          git commit -m 'Require Expo runtime bundled media support'
          git push origin HEAD:agent/adm14-bundled-assets-authoring
