name: Issue 520 Metro blocklist isolation

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install fresh standalone Studio graph
        run: |
          rm apps/studio/bun.lock
          bun install --cwd apps/studio
      - name: Remove only the custom ancestor node_modules blocklist
        run: |
          cat > apps/studio/metro.config.js <<'JS'
          const path = require('node:path');
          const { getDefaultConfig } = require('expo/metro-config');

          const config = getDefaultConfig(__dirname);
          config.resolver.emptyModulePath = path.resolve(__dirname, 'metro.empty-module.js');

          const originalResolveRequest = config.resolver.resolveRequest;
          config.resolver.resolveRequest = (context, moduleName, platform) => {
            const resolveDefault = originalResolveRequest
              ? (nextContext, nextModuleName, nextPlatform) =>
                  originalResolveRequest(nextContext, nextModuleName, nextPlatform)
              : (nextContext, nextModuleName, nextPlatform) =>
                  nextContext.resolveRequest(nextContext, nextModuleName, nextPlatform);
            if (moduleName !== '@ankhorage/contracts/environments') {
              return resolveDefault(context, moduleName, platform);
            }
            const nestedRoot = path.resolve(
              __dirname,
              'node_modules/@ankhorage/studio/node_modules/@ankhorage/contracts',
            );
            console.error(
              'ANKH_METRO_NO_BLOCKLIST ' +
                JSON.stringify({
                  package: context.fileSystemLookup(path.join(nestedRoot, 'package.json')),
                  target: context.fileSystemLookup(path.join(nestedRoot, 'dist/environments.js')),
                }),
            );
            return resolveDefault(context, moduleName, platform);
          };

          module.exports = config;
          JS
      - name: Run Web export without custom blocklist
        run: |
          set +e
          bun run --cwd apps/studio export:web 2>&1 | tee /tmp/metro-export.log
          status=${PIPESTATUS[0]}
          set -e
          grep 'ANKH_METRO_NO_BLOCKLIST' /tmp/metro-export.log | head -n 4 || true
          exit "$status"
