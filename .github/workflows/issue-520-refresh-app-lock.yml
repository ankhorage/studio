name: Issue 520 Contracts graph

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install fresh standalone Studio graph
        run: |
          rm apps/studio/bun.lock
          bun install --cwd apps/studio
      - name: Inspect physical Contracts ownership
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, realpathSync } from 'node:fs';
          import path from 'node:path';

          const appRoot = path.resolve('apps/studio');
          const studioLink = path.join(appRoot, 'node_modules/@ankhorage/studio');
          const runtimeLink = path.join(appRoot, 'node_modules/@ankhorage/expo-runtime');
          const readPackage = (packagePath) => {
            if (!existsSync(packagePath)) return null;
            const value = JSON.parse(readFileSync(packagePath, 'utf8'));
            return {
              path: packagePath,
              realPath: realpathSync(packagePath),
              version: value.version,
              environments: value.exports?.['./environments'] ?? null,
            };
          };
          const packageRoot = (link) => realpathSync(link);
          const candidates = [
            path.join(appRoot, 'node_modules/@ankhorage/contracts/package.json'),
            path.join(studioLink, 'node_modules/@ankhorage/contracts/package.json'),
            path.join(runtimeLink, 'node_modules/@ankhorage/contracts/package.json'),
            path.join(packageRoot(studioLink), 'node_modules/@ankhorage/contracts/package.json'),
            path.join(packageRoot(runtimeLink), 'node_modules/@ankhorage/contracts/package.json'),
          ];
          console.log(JSON.stringify({
            studio: {
              realPath: packageRoot(studioLink),
              manifest: readPackage(path.join(studioLink, 'package.json')),
            },
            expoRuntime: {
              realPath: packageRoot(runtimeLink),
              manifest: readPackage(path.join(runtimeLink, 'package.json')),
            },
            contracts: [...new Set(candidates)].map(readPackage).filter(Boolean),
          }, null, 2));
          NODE
          echo '--- all Contracts manifests under standalone node_modules ---'
          find apps/studio/node_modules -path '*/@ankhorage/contracts/package.json' -print | sort
          echo '--- Bun-store Contracts manifests ---'
          find apps/studio/node_modules/.bun -path '*ankhorage+contracts*/node_modules/@ankhorage/contracts/package.json' -print | sort || true
