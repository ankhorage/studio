name: Issue 520 Renovate dry run

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove canonical Renovate manager and dependency extraction
        env:
          LOG_FILE: renovate.log
          LOG_FILE_LEVEL: debug
          LOG_FORMAT: json
          LOG_LEVEL: debug
          RENOVATE_DRY_RUN: full
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_PLATFORM: github
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_TOKEN: ${{ github.token }}
        run: |
          npx --yes renovate@44.43.1 ankhorage/studio
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const log = readFileSync('renovate.log', 'utf8');
          const requiredEvidence = [
            '"enabledManagers":["bun","custom.regex"]',
            '"manager":"bun"',
            '@ankhorage/contracts',
            '@ankhorage/zora',
            '@ankhorage/expo-runtime',
          ];
          for (const evidence of requiredEvidence) {
            if (!log.includes(evidence)) {
              throw new Error(`Renovate dry-run evidence missing: ${evidence}`);
            }
          }
          console.log('Renovate dry-run detected Bun-managed Ankhorage dependencies.');
          NODE
