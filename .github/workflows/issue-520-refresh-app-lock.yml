name: Issue 520 Metro file-map visibility

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install fresh standalone Studio graph
        run: |
          rm apps/studio/bun.lock
          bun install --cwd apps/studio
      - name: Inspect Metro visibility of nested owner package
        run: |
          cat >> apps/studio/metro.config.js <<'JS'

          const originalResolveRequest = config.resolver.resolveRequest;
          config.resolver.resolveRequest = (context, moduleName, platform) => {
            const resolveDefault = originalResolveRequest
              ? (nextContext, nextModuleName, nextPlatform) =>
                  originalResolveRequest(nextContext, nextModuleName, nextPlatform)
              : (nextContext, nextModuleName, nextPlatform) =>
                  nextContext.resolveRequest(nextContext, nextModuleName, nextPlatform);
            if (moduleName !== '@ankhorage/contracts/environments') {
              return resolveDefault(context, moduleName, platform);
            }
            const studioRoot = path.resolve(__dirname, 'node_modules/@ankhorage/studio');
            const nestedContractsRoot = path.join(studioRoot, 'node_modules/@ankhorage/contracts');
            const rootContractsRoot = path.resolve(__dirname, 'node_modules/@ankhorage/contracts');
            const paths = [
              path.join(nestedContractsRoot, 'package.json'),
              path.join(nestedContractsRoot, 'dist/environments.js'),
              path.join(rootContractsRoot, 'package.json'),
              path.join(rootContractsRoot, 'dist/environments.js'),
            ];
            console.error(
              'ANKH_METRO_FILE_MAP ' +
                JSON.stringify({
                  originModulePath: context.originModulePath,
                  lookups: paths.map((candidate) => ({
                    candidate,
                    lookup: context.fileSystemLookup(candidate),
                  })),
                }),
            );
            return resolveDefault(context, moduleName, platform);
          };
          JS
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/studio/metro.config.js')
          text = path.read_text()
          text = text.replace('\nmodule.exports = config;\n', '\n', 1)
          path.write_text(text + '\nmodule.exports = config;\n')
          PY
      - name: Run Web export through instrumented Metro
        run: |
          set +e
          bun run --cwd apps/studio export:web 2>&1 | tee /tmp/metro-export.log
          status=${PIPESTATUS[0]}
          set -e
          grep 'ANKH_METRO_FILE_MAP' /tmp/metro-export.log | head -n 4 || true
          exit "$status"
