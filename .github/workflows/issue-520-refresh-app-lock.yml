name: Issue 520 Contracts resolution

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install root dependencies
        run: bun install --frozen-lockfile
      - name: Install standalone Studio app from a fresh lock
        run: |
          rm apps/studio/bun.lock
          bun install --cwd apps/studio
      - name: Inspect Contracts resolution from app and Studio
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createRequire } from 'node:module';
          import path from 'node:path';

          const findPackageJson = (entryPath) => {
            let current = path.dirname(entryPath);
            while (true) {
              const candidate = path.join(current, 'package.json');
              if (fs.existsSync(candidate)) return candidate;
              const parent = path.dirname(current);
              if (parent === current) throw new Error(`No package.json above ${entryPath}`);
              current = parent;
            }
          };

          const appPackagePath = path.resolve('apps/studio/package.json');
          const appRequire = createRequire(appPackagePath);
          const studioEntryPath = appRequire.resolve('@ankhorage/studio');
          const studioPackagePath = findPackageJson(studioEntryPath);
          const studioPackage = JSON.parse(fs.readFileSync(studioPackagePath, 'utf8'));
          const studioRequire = createRequire(studioEntryPath);
          const appContractsEntry = appRequire.resolve('@ankhorage/contracts');
          const studioContractsEntry = studioRequire.resolve('@ankhorage/contracts');
          const appContractsPath = findPackageJson(appContractsEntry);
          const studioContractsPath = findPackageJson(studioContractsEntry);
          const appContracts = JSON.parse(fs.readFileSync(appContractsPath, 'utf8'));
          const studioContracts = JSON.parse(fs.readFileSync(studioContractsPath, 'utf8'));

          console.log(JSON.stringify({
            studio: {
              path: studioPackagePath,
              version: studioPackage.version,
              contractsRange: studioPackage.dependencies?.['@ankhorage/contracts'],
            },
            appContracts: {
              path: appContractsPath,
              version: appContracts.version,
              environmentExport: appContracts.exports?.['./environments'] ?? null,
            },
            studioContracts: {
              path: studioContractsPath,
              version: studioContracts.version,
              environmentExport: studioContracts.exports?.['./environments'] ?? null,
            },
          }, null, 2));
          NODE
