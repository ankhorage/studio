name: Issue 520 Contracts resolution

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install fresh standalone Studio graph
        run: |
          rm apps/studio/bun.lock
          bun install --cwd apps/studio
      - name: Prove Studio-owned Contracts subpath and Node resolution
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { existsSync, readFileSync } from 'node:fs';
          import path from 'node:path';

          const studioRoot = path.resolve('apps/studio/node_modules/@ankhorage/studio');
          const origin = path.join(studioRoot, 'dist/projectOAuthSetup.js');
          const contractsRoot = path.join(studioRoot, 'node_modules/@ankhorage/contracts');
          const manifestPath = path.join(contractsRoot, 'package.json');
          const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
          const target = path.join(contractsRoot, 'dist/environments.js');
          const requireFromStudio = createRequire(origin);
          const resolved = requireFromStudio.resolve('@ankhorage/contracts/environments');

          console.log(JSON.stringify({
            studioOrigin: origin,
            contractsVersion: manifest.version,
            contractsExport: manifest.exports?.['./environments'] ?? null,
            target,
            targetExists: existsSync(target),
            nodeResolved: resolved,
          }, null, 2));

          if (!existsSync(target)) throw new Error('Published Contracts environments target is missing.');
          if (!resolved.includes('/@ankhorage/studio/node_modules/@ankhorage/contracts/')) {
            throw new Error(`Node resolved Studio Contracts through the wrong owner path: ${resolved}`);
          }
          NODE
