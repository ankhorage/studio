name: Issue 520 Metro fix finalize

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply Metro package-root fix and regression updates
        run: |
          python - <<'PY'
          from pathlib import Path

          metro = Path('apps/studio/metro.config.js')
          metro.write_text("""const path = require('node:path');
          const { getDefaultConfig } = require('expo/metro-config');

          const config = getDefaultConfig(__dirname);
          config.resolver.emptyModulePath = path.resolve(__dirname, 'metro.empty-module.js');

          module.exports = config;
          """.replace('          ', ''))

          template = Path('src/host/orchestrator/templateSources.ts')
          text = template.read_text()
          start = text.find("const projectRootPrefix = escapeRegExp(path.resolve(__dirname))")
          if start < 0:
              raise SystemExit('generated Metro blocklist start not found')
          module_exports = text.find('module.exports = config;', start)
          if module_exports < 0:
              raise SystemExit('generated Metro module.exports not found')
          text = text[:start] + text[module_exports:]
          function_start = text.find('\nfunction escapeRegExp(value) {', module_exports)
          if function_start < 0:
              raise SystemExit('generated Metro escapeRegExp function not found')
          function_end = text.find('\n}', function_start)
          if function_end < 0:
              raise SystemExit('generated Metro escapeRegExp function end not found')
          text = text[:function_start] + text[function_end + 2:]
          template.write_text(text)

          standalone = Path('src/host/smoke/assertExpo57StudioStandaloneContractAsync.ts')
          text = standalone.read_text()
          old = """    !metroConfig.includes('const ancestorNodeModules = new RegExp(') ||
              !metroConfig.includes('config.resolver.blockList = [') ||
              metroConfig.includes('watchFolders') ||
          """.replace('              ', '    ')
          new = """    metroConfig.includes('ancestorNodeModules') ||
              metroConfig.includes('config.resolver.blockList = [') ||
              metroConfig.includes('watchFolders') ||
          """.replace('              ', '    ')
          if old not in text:
              raise SystemExit('standalone Metro invariant block not found')
          standalone.write_text(text.replace(old, new, 1))

          navigation = Path('src/host/smoke/runExpo57GeneratedNavigationAcceptance.ts')
          text = navigation.read_text()
          old = """    !metroConfig.includes('ancestorNodeModules') ||
              metroConfig.includes('disableHierarchicalLookup') ||
          """.replace('              ', '    ')
          new = """    metroConfig.includes('ancestorNodeModules') ||
              metroConfig.includes('config.resolver.blockList = [') ||
              metroConfig.includes('disableHierarchicalLookup') ||
          """.replace('              ', '    ')
          if old not in text:
              raise SystemExit('generated navigation Metro invariant block not found')
          navigation.write_text(text.replace(old, new, 1))

          templates_test = Path('src/host/orchestrator/templates.test.ts')
          text = templates_test.read_text()
          old = """    expect(metro).toContain('const ancestorNodeModules = new RegExp(');
              expect(metro).toContain('config.resolver.blockList = [');
          """.replace('              ', '    ')
          new = """    expect(metro).not.toContain('ancestorNodeModules');
              expect(metro).not.toContain('config.resolver.blockList = [');
          """.replace('              ', '    ')
          if old not in text:
              raise SystemExit('template Metro regression assertions not found')
          templates_test.write_text(text.replace(old, new, 1))

          changeset = Path('.changeset/restore-full-acceptance-baseline.md')
          changeset.write_text("""---
          '@ankhorage/studio': patch
          ---

          Restore generated-app and standalone registry acceptance by emitting formatter-stable Auth screen imports, validating owner ranges from the installed Studio dependency graph, aligning the Expo 57.0.23 consumer contract, and allowing Metro to crawl nested package-owned dependencies instead of excluding them with a custom node_modules blocklist.
          """.replace('          ', ''))
          PY
      - name: Format and validate focused Metro regressions
        run: |
          bun run format
          bun run build
          bun test src/host/orchestrator/templates.test.ts
          bun run check-types
          bun run lint
          bun run format:check
      - name: Commit product fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio/metro.config.js src/host/orchestrator/templateSources.ts src/host/orchestrator/templates.test.ts src/host/smoke/assertExpo57StudioStandaloneContractAsync.ts src/host/smoke/runExpo57GeneratedNavigationAcceptance.ts .changeset/restore-full-acceptance-baseline.md
          git commit -m 'fix: preserve nested Metro package resolution'
      - name: Remove temporary workflow and push
        run: |
          git rm .github/workflows/issue-520-refresh-app-lock.yml
          git commit -m 'chore: finalize Studio acceptance baseline'
          git push origin HEAD:fix/520-acceptance-baseline
