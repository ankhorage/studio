name: Issue 520 Metro Haste resolution

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install fresh standalone Studio graph
        run: |
          rm apps/studio/bun.lock
          bun install --cwd apps/studio
      - name: Test Metro resolution without Haste
        run: |
          cat >> apps/studio/metro.config.js <<'JS'

          const originalResolveRequest = config.resolver.resolveRequest;
          config.resolver.resolveRequest = (context, moduleName, platform) => {
            const resolveDefault = originalResolveRequest
              ? (nextContext, nextModuleName, nextPlatform) =>
                  originalResolveRequest(nextContext, nextModuleName, nextPlatform)
              : (nextContext, nextModuleName, nextPlatform) =>
                  nextContext.resolveRequest(nextContext, nextModuleName, nextPlatform);
            if (moduleName !== '@ankhorage/contracts/environments') {
              return resolveDefault(context, moduleName, platform);
            }
            console.error(
              'ANKH_METRO_HASTE ' +
                JSON.stringify({
                  originModulePath: context.originModulePath,
                  allowHaste: context.allowHaste,
                  hastePackage: context.resolveHastePackage(moduleName),
                  enableGlobalPackages: config.resolver.enableGlobalPackages ?? null,
                }),
            );
            const result = resolveDefault({ ...context, allowHaste: false }, moduleName, platform);
            console.error('ANKH_METRO_NO_HASTE_RESULT ' + JSON.stringify(result));
            return result;
          };
          JS
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/studio/metro.config.js')
          text = path.read_text()
          text = text.replace('\nmodule.exports = config;\n', '\n', 1)
          path.write_text(text + '\nmodule.exports = config;\n')
          PY
      - name: Run Web export through Haste-disabled target resolution
        run: |
          set +e
          bun run --cwd apps/studio export:web 2>&1 | tee /tmp/metro-export.log
          status=${PIPESTATUS[0]}
          set -e
          grep 'ANKH_METRO_' /tmp/metro-export.log || true
          exit "$status"
