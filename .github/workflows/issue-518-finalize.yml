name: Finalize issue 518 dependency rollout

on:
  push:
    branches:
      - fix/518-zora19-templates

permissions:
  contents: write

jobs:
  finalize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.head_commit.message == 'chore(ci): run issue 518 validation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/518-zora19-templates

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Align current ZORA dependency contract
        run: |
          bun <<'EOF'
          const rootPath = 'package.json';
          const root = JSON.parse(await Bun.file(rootPath).text());
          root.dependencies['@ankhorage/zora'] = '^19.0.1';
          root.dependencies['@ankhorage/templates'] = '^11.0.5';
          delete root.peerDependencies['@react-native-picker/picker'];
          await Bun.write(rootPath, `${JSON.stringify(root, null, 2)}\n`);

          const appPath = 'apps/studio/package.json';
          const app = JSON.parse(await Bun.file(appPath).text());
          delete app.dependencies['@react-native-picker/picker'];
          await Bun.write(appPath, `${JSON.stringify(app, null, 2)}\n`);

          async function replaceExact(path, before, after = '') {
            const source = await Bun.file(path).text();
            if (!source.includes(before)) throw new Error(`${path} no longer contains expected migration source: ${JSON.stringify(before)}`);
            await Bun.write(path, source.replace(before, after));
          }

          await replaceExact(
            'src/host/orchestrator/templateSources.ts',
            "      '@react-native-picker/picker': '2.11.4',\n",
          );
          const dependencyContractPath = 'src/host/orchestrator/generatedDependencyContract.test.ts';
          await replaceExact(dependencyContractPath, "    '@react-native-picker/picker': nativePicker,\n");
          await replaceExact(dependencyContractPath, '    expect(nativePicker).toBeDefined();\n');
          await replaceExact(dependencyContractPath, "    '@react-native-picker/picker': expectedNativePicker,\n");
          await replaceExact(dependencyContractPath, '  expect(nativePicker).toBe(expectedNativePicker);\n');
          EOF
          cat > .changeset/align-zora-19.md <<'EOF'
          ---
          "@ankhorage/studio": patch
          ---

          Align Studio and generated-app dependency policy with the released ZORA 19 boundary, the ZORA-19-compatible Templates release, and remove the obsolete native picker projection.
          EOF

      - name: Refresh lockfiles
        run: |
          bun install
          bun install --cwd apps/studio

      - name: Format
        run: bun run format

      - name: Build
        run: |
          set -o pipefail
          bun run build 2>&1 | tee issue-518-build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-518-build-diagnostics
          path: issue-518-build.log
          if-no-files-found: error

      - name: Typecheck
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Knip
        run: bun run knip:check

      - name: Tests
        run: bun run test

      - name: Generated Expo 57 acceptance
        run: |
          set -o pipefail
          bun run test:acceptance:expo57-generated-app 2>&1 | tee issue-518-acceptance.log

      - name: Upload acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-518-acceptance-diagnostics
          path: issue-518-acceptance.log
          if-no-files-found: error

      - name: Docs
        run: bun run docs

      - name: Format generated artifacts
        run: bun run format

      - name: Changeset status
        run: bun run changeset:status

      - name: Format check
        run: bun run format:check

      - name: Diff check
        run: git diff --check

      - name: Commit validated rollout
        run: |
          rm .github/workflows/issue-518-finalize.yml
          rm -f issue-518-build.log issue-518-acceptance.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(deps): align Studio with ZORA 19"
          git push origin HEAD:fix/518-zora19-templates
