name: Finalize issue 518 dependency rollout

on:
  push:
    branches:
      - fix/518-zora19-templates

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/518-zora19-templates

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Align current ZORA dependency contract
        run: |
          bun -e "const path='package.json'; const pkg=JSON.parse(await Bun.file(path).text()); pkg.dependencies['@ankhorage/zora']='^19.0.1'; pkg.dependencies['@ankhorage/templates']='^11.0.5'; delete pkg.peerDependencies['@react-native-picker/picker']; await Bun.write(path, JSON.stringify(pkg, null, 2)+'\\n');"
          bun -e "const path='apps/studio/package.json'; const pkg=JSON.parse(await Bun.file(path).text()); delete pkg.dependencies['@react-native-picker/picker']; await Bun.write(path, JSON.stringify(pkg, null, 2)+'\\n');"
          bun -e "const path='src/host/orchestrator/templateSources.ts'; const before=\"      '@react-native-picker/picker': '2.11.4',\\n\"; const source=await Bun.file(path).text(); if(!source.includes(before)) throw new Error('obsolete picker scaffold line not found'); await Bun.write(path, source.replace(before,''));"
          bun -e "const path='src/host/orchestrator/generatedDependencyContract.test.ts'; let source=await Bun.file(path).text(); for (const before of [\"    '@react-native-picker/picker': nativePicker,\\n\", '    expect(nativePicker).toBeDefined();\\n', \"    '@react-native-picker/picker': expectedNativePicker,\\n\", '  expect(nativePicker).toBe(expectedNativePicker);\\n']) { if(!source.includes(before)) throw new Error('obsolete picker contract fragment not found: '+before); source=source.replace(before,''); } await Bun.write(path, source);"
          cat > .changeset/align-zora-19.md <<'EOF'
          ---
          "@ankhorage/studio": patch
          ---

          Align Studio and generated-app dependency policy with the released ZORA 19 boundary, the ZORA-19-compatible Templates release, and remove the obsolete native picker projection.
          EOF

      - name: Refresh lockfiles
        run: |
          bun install
          bun install --cwd apps/studio

      - name: Format
        run: bun run format

      - name: Build
        run: |
          set -o pipefail
          bun run build 2>&1 | tee issue-518-build.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-518-build-diagnostics
          path: issue-518-build.log
          if-no-files-found: ignore

      - name: Typecheck
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Knip
        run: bun run knip:check

      - name: Tests
        run: bun run test

      - name: Generated Expo 57 acceptance
        run: |
          set -o pipefail
          bun run test:acceptance:expo57-generated-app 2>&1 | tee issue-518-acceptance.log

      - name: Upload acceptance diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: issue-518-acceptance-diagnostics
          path: issue-518-acceptance.log
          if-no-files-found: ignore

      - name: Docs
        run: bun run docs

      - name: Format generated artifacts
        run: bun run format

      - name: Changeset status
        run: bun run changeset:status

      - name: Format check
        run: bun run format:check

      - name: Diff check
        run: git diff --check

      - name: Commit validated rollout
        run: |
          rm .github/workflows/issue-518-finalize.yml
          rm -f issue-518-build.log issue-518-acceptance.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(deps): align Studio with ZORA 19"
          git push origin HEAD:fix/518-zora19-templates
