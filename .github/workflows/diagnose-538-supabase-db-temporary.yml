name: Temporary #538 Supabase DB diagnostics

on:
  push:
    branches:
      - test/538-fresh-template-infra-up

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: test/538-fresh-template-infra-up
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Minikube
        env:
          MINIKUBE_VERSION: v1.37.0
        run: |
          curl --fail --location --silent --show-error --output /tmp/minikube "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64"
          curl --fail --location --silent --show-error --output /tmp/minikube.sha256 "https://github.com/kubernetes/minikube/releases/download/${MINIKUBE_VERSION}/minikube-linux-amd64.sha256"
          echo "$(cat /tmp/minikube.sha256)  /tmp/minikube" | sha256sum --check --status
          sudo install /tmp/minikube /usr/local/bin/minikube
      - name: Install kubectl
        env:
          KUBECTL_VERSION: v1.34.1
        run: |
          curl --fail --location --silent --show-error --output /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --fail --location --silent --show-error --output /tmp/kubectl.sha256 "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check --status
          sudo install /tmp/kubectl /usr/local/bin/kubectl
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify released providers
        run: |
          bun --eval '
          import { fileURLToPath } from "node:url";
          const expected = [["@ankhorage/infra", "^7.1.1"], ["@ankhorage/supabase", "^0.5.12"], ["@ankhorage/supabase-vault", "^0.3.3"]];
          for (const [name, range] of expected) {
            const path = fileURLToPath(import.meta.resolve(`${name}/package.json`));
            const packageJson = await Bun.file(path).json();
            if (!Bun.semver.satisfies(packageJson.version, range)) throw new Error(`${name} ${packageJson.version} does not satisfy ${range}`);
            console.log(`${name}: ${packageJson.version}`);
          }
          '
      - name: Reproduce SharkPrey fresh Infra up
        run: >-
          env -u SUPABASE_BOOTSTRAP
          -u ANKH_INFRA_CREDENTIAL_SUPABASE_BOOTSTRAP
          ANKH_STUDIO_FRESH_TEMPLATE_INFRA_E2E=1
          ANKH_STUDIO_PRESERVE_FAILED_INFRA=1
          bun test src/host/freshTemplateInfra.e2e.test.ts
          --test-name-pattern sharkprey
      - name: Collect Supabase DB crash diagnostics
        if: failure()
        shell: bash
        run: |
          profile='sharkprey-infra-acceptance-local'
          namespace="$profile"
          minikube profile list || true
          minikube -p "$profile" kubectl -- -n "$namespace" get pods -o wide || true
          minikube -p "$profile" kubectl -- -n "$namespace" get deployment supabase-db -o yaml || true
          pod="$(minikube -p "$profile" kubectl -- -n "$namespace" get pods -o name 2>/dev/null | grep '^pod/supabase-db-' | head -n 1 | cut -d/ -f2 || true)"
          if [ -n "$pod" ]; then
            echo "Supabase DB pod: $pod"
            minikube -p "$profile" kubectl -- -n "$namespace" describe pod "$pod" || true
            echo '===== CURRENT SUPABASE-DB LOGS ====='
            minikube -p "$profile" kubectl -- -n "$namespace" logs "$pod" -c supabase-db || true
            echo '===== PREVIOUS SUPABASE-DB LOGS ====='
            minikube -p "$profile" kubectl -- -n "$namespace" logs "$pod" -c supabase-db --previous || true
          fi
          minikube -p "$profile" kubectl -- get events --all-namespaces --sort-by=.lastTimestamp || true
      - name: Cleanup Minikube
        if: always()
        run: minikube delete --all --purge || true
