name: Refresh ADM 5 lockfile

on:
  push:
    branches:
      - agent/adm-5-generated-api-authoring

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Update released ADM 5 dependencies
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies['@ankhorage/contracts'] = '^4.0.2';
          pkg.dependencies['@ankhorage/data-sources'] = '^1.0.0';
          pkg.dependencies['@ankhorage/infra'] = '^2.0.0';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Refresh lockfile
        run: bun install

      - name: Capture worktree
        run: zip -qr studio-worktree.zip . -x '.git/*' 'node_modules/*'

      - name: Upload refreshed dependency files
        uses: actions/upload-artifact@v4
        with:
          name: adm5-worktree
          path: |
            package.json
            bun.lock
            studio-worktree.zip
