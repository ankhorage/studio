name: Validate ADM 6

on:
  push:
    branches:
      - agent/adm-6-binding-authoring

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lint
      - run: bun run format:check
      - run: bun run knip
      - run: bun run test
      - run: bun run typecheck
