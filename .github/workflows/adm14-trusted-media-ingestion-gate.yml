name: ADM-14 Trusted Media Ingestion Gate

on:
  push:
    branches:
      - agent/adm14-trusted-media-ingestion

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply ADM-14 integration
        run: python3 scripts/adm14-trusted-media-apply.py

      - name: Install dependencies
        run: bun install

      - name: Format authored changes
        run: bun run format

      - name: Apply strict lint fixes
        run: bun run lint:fix

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Knip
        run: bun run knip

      - name: Generate documentation
        run: bun run docs

      - name: Format generated documentation
        run: bun run format

      - name: Validate repository conventions
        run: bunx @ankhorage/doctor@0.8.0 validate .

      - name: Verify formatting
        run: bun run format:check

      - name: Verify lint
        run: bun run lint

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Guard trusted media boundary
        run: |
          if grep -R -n 'supabase-public' src; then
            echo 'Legacy provider credential route is still present.'
            exit 1
          fi
          if grep -R -n 'publicUrl' src/host/media src/core/mediaAuthoringHostClient.ts \
            --include='*.ts' \
            --include='*.tsx' \
            --exclude='*.test.ts' \
            --exclude='*.test.tsx'; then
            echo 'Provider URL leaked into canonical media ingestion.'
            exit 1
          fi
          if grep -n -E 'readonly uri:|readonly uri\?' src/mediaPickerAuthoring.ts; then
            echo 'Studio picker contract must not expose transient URIs.'
            exit 1
          fi

      - name: Verify changeset
        run: bun run changeset:status --since=origin/main

      - name: Verify clean patches
        run: git diff --check

      - name: Commit validated non-workflow state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows/*' ':!scripts/adm14-trusted-media-apply.py'
          if ! git diff --cached --quiet; then
            git commit -m 'Validate ADM-14 trusted media ingestion'
            git push origin HEAD:agent/adm14-trusted-media-ingestion
          fi
