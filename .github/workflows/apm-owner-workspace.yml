name: APM owner workspace
on:
  push:
    branches: [feat/500-apm-release-gate]
    paths: [.github/workflows/apm-owner-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify released producer and prepare dependencies
        run: |
          npm view @ankhorage/devtools@1.15.0 version dist.integrity --json
          bun install --frozen-lockfile --ignore-scripts
          bun add --dev --ignore-scripts @ankhorage/devtools@^1.15.0
          mkdir -p .runner-tools
          cp "$(command -v bun)" .runner-tools/bun
          cp "$(command -v node)" .runner-tools/node
          git rev-parse HEAD > .runner-tools/source-commit.txt
          tar --exclude=.git --exclude=.env --exclude='.env.*' --exclude=.runner-tools/source-commit.txt -czf "$RUNNER_TEMP/apm-owner-workspace.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: apm-owner-workspace
          path: ${{ runner.temp }}/apm-owner-workspace.tar.gz
          retention-days: 1
          compression-level: 0
