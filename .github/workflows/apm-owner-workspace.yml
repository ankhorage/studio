name: APM owner workspace

on:
  push:
    branches: [fix/500-apm-release-gate]
    paths: [.github/workflows/apm-owner-workspace.yml]

permissions:
  contents: write

concurrency:
  group: studio-apm-owner-implementation
  cancel-in-progress: false

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/500-apm-release-gate
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the reviewed Studio owner patch
        run: |
          test "$(git rev-parse HEAD^)" = b7e2a0b9be8b4e88fea1dd622e909de94efd1cb2
          bzip2 -dc .github/apm-owner.changes.bz2 > "$RUNNER_TEMP/owner.patch"
          echo "4ee6b8bb5570fca8d1ab01eb45161f681b2c22348564fb7063b7bc9e28015db6  $RUNNER_TEMP/owner.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/owner.patch"
          git apply --index "$RUNNER_TEMP/owner.patch"
          git rm .github/apm-owner.changes.bz2
          rm .github/workflows/apm-owner-workspace.yml
      - name: Resolve released Devtools and synchronize its owned workflows
        run: |
          bun install --ignore-scripts
          node --input-type=module <<'JS'
          import provider from '@ankhorage/devtools/cli';
          if (provider.version !== '1.15.0') throw Error('Expected the reviewed Devtools 1.15.0 producer.');
          for (const scope of ['workflows', 'agents']) {
            const command = provider.handlers.find(({path}) => path.join(' ') === scope + ' sync');
            if (!command) throw Error('Missing released ' + scope + ' sync capability.');
            const result = await command.handler({
              argv: ['.'],
              context: {
                cwd: process.cwd(), env: process.env,
                writeStdout: text => process.stdout.write(text),
                writeStderr: text => process.stderr.write(text),
              },
            });
            if (result.exitCode !== 0) throw Error(scope + ' synchronization failed.');
          }
          JS
          bun install --frozen-lockfile --ignore-scripts
      - name: Run canonical owner checks and regenerate documentation
        run: |
          bun run build
          bun run check-types
          bun run lint
          bun run knip:check
          bun run changeset:status
          bun run docs
          bun run format
          bun run test:apm
          bun run test
          bun run format:check
      - name: Validate the actual owner candidate with released Devtools
        run: |
          ./node_modules/.bin/ankhorage-apm-release validate . --allow-owner-code --artifact "$RUNNER_TEMP/studio-approved.tgz" > "$RUNNER_TEMP/owner-release-report.json"
          cat "$RUNNER_TEMP/owner-release-report.json"
          node -e "const r=require(process.argv[1]);if(!r.valid||!r.applicable||!r.integrity.startsWith('sha512-'))throw Error('Studio owner gate failed');" "$RUNNER_TEMP/owner-release-report.json"
      - name: Run cold packed Studio host and native Node owner acceptance
        run: |
          set -o pipefail
          bun run test:acceptance:packed-studio-host 2>&1 | tee "$RUNNER_TEMP/owner-cold-acceptance.txt"
      - name: Preserve reviewed workflow changes and validation evidence
        run: |
          mkdir -p "$RUNNER_TEMP/owner-evidence/workflows"
          cp .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/renovate.yml "$RUNNER_TEMP/owner-evidence/workflows/"
          cp "$RUNNER_TEMP/owner-release-report.json" "$RUNNER_TEMP/owner-cold-acceptance.txt" "$RUNNER_TEMP/owner-evidence/"
          cp package.json bun.lock AGENTS.md "$RUNNER_TEMP/owner-evidence/"
          sha256sum "$RUNNER_TEMP/studio-approved.tgz" > "$RUNNER_TEMP/owner-evidence/candidate-sha256.txt"
          git diff --check
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/owner-evidence/validated.patch"
      - uses: actions/upload-artifact@v4
        with:
          name: studio-apm-validated-owner
          path: ${{ runner.temp }}/owner-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Commit validated source within content permissions
        run: |
          # Workflow changes are applied by the authorized repository editor, not this token.
          git restore --source=HEAD --staged --worktree -- .github/workflows
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: validate Studio APM owner under native Node' -m 'Refs #500' -m 'Release validation: ankhorage/devtools#208; roadmap: ankhorage/apm#1'
          git push origin HEAD:refs/heads/fix/500-apm-release-gate
          echo "Validated owner source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
