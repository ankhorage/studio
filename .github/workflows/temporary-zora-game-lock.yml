name: Temporary ZORA Game lockfile

on:
  push:
    branches:
      - feat/544-zora-game-extension

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/544-zora-game-extension
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install
      - name: Commit lockfile
        run: |
          if git diff --quiet bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: update zora game lockfile"
          git push origin HEAD:feat/544-zora-game-extension
