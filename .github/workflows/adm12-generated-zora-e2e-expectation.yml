name: ADM12 generated ZORA E2E expectation

on:
  push:
    branches:
      - issue-127/canonical-theme-mode

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-127/canonical-theme-mode
      - name: Align exact E2E expectation
        run: |
          python -c "from pathlib import Path; p=Path('src/host/generatedAdminExpoWeb.smoke.test.ts'); s=p.read_text(); old=\"expect(generatedZoraRange).toBe('^2.9.0');\"; assert s.count(old)==1; p.write_text(s.replace(old, \"expect(generatedZoraRange).toBe('^2.10.0');\", 1))"
          rm .github/workflows/adm12-generated-zora-e2e-expectation.yml
      - name: Commit focused E2E expectation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/host/generatedAdminExpoWeb.smoke.test.ts .github/workflows/adm12-generated-zora-e2e-expectation.yml
          git commit -m "Expect ZORA 2.10 in generated app E2E"
          git push origin HEAD:issue-127/canonical-theme-mode
