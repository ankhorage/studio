name: Verify SharkPrey native splash release

on:
  push:
    branches:
      - verify/sharkprey-native-splash-release

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Studio dependencies
        run: bun install --frozen-lockfile

      - name: Verify SharkPrey release splash
        run: bun scripts/verify-sharkprey-native-splash-release.ts
