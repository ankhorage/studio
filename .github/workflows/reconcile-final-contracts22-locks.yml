name: Reconcile final Contracts 22 locks

on:
  push:
    branches:
      - refactor/563-canonical-app-manifest-collections

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun update @ankhorage/minikube --lockfile-only
      - run: cd apps/studio && bun update @ankhorage/studio --lockfile-only
      - name: Commit lockfiles
        run: |
          if git diff --quiet -- bun.lock apps/studio/bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock apps/studio/bun.lock
          git commit -m "chore: refresh final Contracts 22 lockfiles"
          git push
