name: Temporary #538 runtime sync

on:
  push:
    branches:
      - test/538-fresh-template-infra-up

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: test/538-fresh-template-infra-up
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Sync current main and Minikube runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('package.json')
          package = json.loads(path.read_text())
          package['dependencies']['@ankhorage/minikube'] = '^0.4.4'
          path.write_text(json.dumps(package, indent=2) + '\n')
          PY

          rm -rf ~/.bun/install/cache
          bun install
          bun run docs
          bun run format

          bun --eval '
          import { fileURLToPath } from "node:url";
          const minikubePath = fileURLToPath(import.meta.resolve("@ankhorage/minikube/package.json"));
          const minikube = await Bun.file(minikubePath).json();
          const kubernetesPath = fileURLToPath(import.meta.resolve("@ankhorage/kubernetes/package.json", minikubePath));
          const kubernetes = await Bun.file(kubernetesPath).json();
          if (!Bun.semver.satisfies(minikube.version, "^0.4.4")) throw new Error(`Expected Minikube ^0.4.4, got ${minikube.version}`);
          if (!Bun.semver.satisfies(kubernetes.version, ">=0.8.0")) throw new Error(`Expected image-seeded Kubernetes >=0.8.0, got ${kubernetes.version}`);
          console.log(`Minikube ${minikube.version} -> Kubernetes ${kubernetes.version}`);
          '

          bun run build
          bun run check-types
          bun run lint
          bun run knip:check
          bun run changeset:status
          bun run format:check

          git add package.json bun.lock README.md paradox scripts/published-studio-restart-boundary-acceptance.ts
          if ! git diff --cached --quiet; then
            git commit -m "fix(studio): consume image-seeded Minikube runtime"
          fi
          git push origin HEAD:test/538-fresh-template-infra-up
