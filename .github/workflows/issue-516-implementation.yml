name: Issue 516 implementation

on:
  push:
    branches:
      - feat/516-runtime-projection-currency

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/516-runtime-projection-currency

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply projection currency implementation
        run: python3 .github/issue-516-implementation.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format authored changes
        run: bun run format

      - name: Generate Paradox documentation
        run: bun run docs

      - name: Format generated documentation
        run: bun run format

      - name: Run focused projection currency tests
        run: bun test src/features/projects src/host/orchestrator/projectManagerCurrentState.test.ts

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Knip
        run: bun run knip:check

      - name: Check changeset
        run: bun run changeset:status

      - name: Check formatting
        run: bun run format:check

      - name: Run packed Studio host acceptance
        run: bun run test:acceptance:packed-studio-host

      - name: Commit validated implementation and remove one-shot transport
        shell: bash
        run: |
          rm .github/workflows/issue-516-implementation.yml
          rm .github/issue-516-implementation.py
          git config user.name 'artiphishle'
          git config user.email '137318798+artiphishle@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: track runtime projection currency'
          git push origin HEAD:feat/516-runtime-projection-currency
