name: Diagnose Studio web smoke

on:
  push:
    branches:
      - 'issue#126/localization-studio-integration'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'issue#126/localization-studio-integration'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - name: Inject browser diagnostics into smoke working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/host/studioWorkspaceExpoWeb.smoke.test.ts')
          s = p.read_text()
          old = "    throw new Error(`Timed out waiting for route text. Last body text:\\n${text}`);"
          new = "    throw new Error(`Timed out waiting for route text. Last body text:\\n${text}\\nBrowser errors:\\n${this.errors.join('\\n') || '(none)'}`);"
          if old not in s:
              raise SystemExit('diagnostic patch target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Run Studio web smoke with browser diagnostics
        run: bun run test:smoke:studio-web
