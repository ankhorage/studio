name: ADM-13 Final Gate

on:
  push:
    branches:
      - adm13/theme-administration
    paths:
      - .github/workflows/adm13-final.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Format authored changes
        run: bun run format
      - name: Build
        run: bun run build
      - name: Generate Paradox documentation
        run: bun run docs
      - name: Validate repository
        run: |
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck
          bun run type-check:studio
          bun run changeset:status
      - name: Guard generated documentation paths
        run: |
          if grep -R -n -E '/home/runner/|/Users/' README.md paradox docs; then
            echo 'Generated or authored documentation contains a machine-specific path.' >&2
            exit 1
          fi
      - name: Guard Theme module ownership
        run: |
          if grep -R -n -E 'google-fonts|googleFonts|activeFontId' src/ui/admin/pages/Theme* src/ui/admin/pages/theme*; then
            echo 'Theme administration contains module-specific Google Fonts logic.' >&2
            exit 1
          fi
      - name: Studio web smoke
        run: bun run test:smoke:studio-web
      - name: Generated app web E2E
        run: bun run test:e2e:generated-app-web
      - name: Remove temporary workflow
        run: rm .github/workflows/adm13-final.yml
      - name: Commit final ADM-13 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden ADM-13 Theme administration"
          git push origin HEAD:adm13/theme-administration
