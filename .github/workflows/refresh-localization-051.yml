name: Refresh Studio localization consumer

on:
  push:
    branches:
      - 'issue#126/localization-studio-integration'

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'issue#126/localization-studio-integration'
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install
      - run: bun add '@ankhorage/orchestrator-module-expo-localization@^0.5.1'
      - run: bun run format
      - name: Commit released dependency
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock
          git commit -m 'Consume localization 0.5.1'
          git push origin HEAD:'issue#126/localization-studio-integration'
