name: Temporary #538 provider release sync

on:
  push:
    branches:
      - test/538-fresh-template-infra-up

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: test/538-fresh-template-infra-up
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Update released provider ranges
        run: |
          bun --eval '
          const path = "package.json";
          const packageJson = await Bun.file(path).json();
          packageJson.dependencies["@ankhorage/supabase"] = "^0.5.11";
          packageJson.dependencies["@ankhorage/supabase-vault"] = "^0.3.2";
          await Bun.write(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          '
      - name: Clear Bun install cache
        run: rm -rf ~/.bun/install/cache
      - name: Refresh lockfile
        run: bun install
      - name: Verify released providers
        run: |
          bun --eval '
          import { fileURLToPath } from "node:url";
          for (const [name, range] of [["@ankhorage/supabase", "^0.5.11"], ["@ankhorage/supabase-vault", "^0.3.2"]]) {
            const path = fileURLToPath(import.meta.resolve(`${name}/package.json`));
            const packageJson = await Bun.file(path).json();
            if (!Bun.semver.satisfies(packageJson.version, range)) throw new Error(`${name} ${packageJson.version} does not satisfy ${range}`);
            console.log(`${name}: ${packageJson.version}`);
          }
          '
      - name: Commit dependency sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency changes."
            exit 0
          fi
          git commit -m "fix(studio): consume released Infra bootstrap providers"
          git push origin HEAD:test/538-fresh-template-infra-up
