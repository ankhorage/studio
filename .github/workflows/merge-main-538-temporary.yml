name: Temporary #538 merge current main

on:
  push:
    branches:
      - test/538-fresh-template-infra-up

permissions:
  contents: write

jobs:
  merge-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: test/538-fresh-template-infra-up
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Merge current main and resolve generated conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          git merge --no-commit --no-ff origin/main || true

          conflicts="$(git diff --name-only --diff-filter=U)"
          printf 'Conflicts:\n%s\n' "$conflicts"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              README.md|bun.lock|package.json|paradox/badges/npm.svg|paradox/diagrams/architecture-overview.mmd|paradox/diagrams/export-graph.mmd|paradox/diagrams/module-relationships.mmd|paradox/index.html|paradox/paradox.json)
                ;;
              *)
                echo "Unexpected merge conflict: $path" >&2
                exit 1
                ;;
            esac
          done <<< "$conflicts"

          for path in README.md bun.lock paradox/badges/npm.svg paradox/diagrams/architecture-overview.mmd paradox/diagrams/export-graph.mmd paradox/diagrams/module-relationships.mmd paradox/index.html paradox/paradox.json; do
            if git diff --name-only --diff-filter=U | grep -Fxq "$path"; then
              git checkout --theirs -- "$path"
              git add "$path"
            fi
          done

          git show origin/main:package.json > package.json
          bun --eval '
          const path = "package.json";
          const packageJson = await Bun.file(path).json();
          packageJson.scripts["test:e2e:fresh-template-infra"] = "ANKH_STUDIO_FRESH_TEMPLATE_INFRA_E2E=1 bun test src/host/freshTemplateInfra.e2e.test.ts";
          packageJson.dependencies["@ankhorage/contracts"] = "^21.0.0";
          packageJson.dependencies["@ankhorage/infra"] = "^7.1.1";
          packageJson.dependencies["@ankhorage/supabase"] = "^0.5.12";
          packageJson.dependencies["@ankhorage/supabase-vault"] = "^0.3.3";
          await Bun.write(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          '
          git add package.json

          rm -f .github/workflows/diagnose-538-supabase-db-temporary.yml
          rm -f .github/workflows/merge-main-538-temporary.yml
          git add -A

          rm -rf ~/.bun/install/cache
          bun install
          bun run docs
          bun run format
          git add -A

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain:' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          bun run build
          bun run check-types
          bun run lint
          bun run knip:check
          bun run changeset:status
          bun run format:check
          bun run test

          git status --short
          git commit -m "chore(studio): merge current main into #538"
          git push origin HEAD:test/538-fresh-template-infra-up
