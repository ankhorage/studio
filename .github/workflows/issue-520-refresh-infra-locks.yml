name: Issue 520 refresh Infra consumer locks

on:
  push:
    branches:
      - fix/520-acceptance-baseline
    paths:
      - '.github/workflows/issue-520-refresh-infra-locks.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/520-acceptance-baseline

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Require released Infra floor
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies['@ankhorage/infra'] = '^5.1.5';
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Await npm registry visibility
        run: |
          for attempt in $(seq 1 18); do
            if [ "$(npm view @ankhorage/infra@5.1.5 version 2>/dev/null)" = '5.1.5' ]; then
              exit 0
            fi
            sleep 10
          done
          echo '@ankhorage/infra@5.1.5 is still unavailable from the npm registry.' >&2
          exit 1

      - name: Regenerate Bun locks
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install
        run: |
          rm -rf "$BUN_INSTALL_CACHE_DIR"
          bun install
          bun install --cwd apps/studio
          bun update --cwd apps/studio @ankhorage/infra

      - name: Verify released Infra resolution
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { createRequire } = require('node:module');

          const rootPackage = require('./package.json');
          if (rootPackage.dependencies['@ankhorage/infra'] !== '^5.1.5') {
            throw new Error('Studio root does not declare the released Infra floor.');
          }

          const rootInfra = require('./node_modules/@ankhorage/infra/package.json');
          if (rootInfra.version !== '5.1.5') {
            throw new Error(`Studio root resolved Infra ${rootInfra.version} instead of 5.1.5.`);
          }

          const installedStudioPackagePath = path.resolve(
            'apps/studio/node_modules/@ankhorage/studio/package.json',
          );
          const studioRequire = createRequire(installedStudioPackagePath);
          const installedInfraPath = studioRequire.resolve('@ankhorage/infra/package.json');
          const installedInfra = JSON.parse(fs.readFileSync(installedInfraPath, 'utf8'));
          if (installedInfra.version !== '5.1.5') {
            throw new Error(
              `Standalone published Studio resolved Infra ${installedInfra.version} instead of 5.1.5.`,
            );
          }
          NODE

      - name: Commit canonical consumer state and remove helper
        run: |
          git rm .github/workflows/issue-520-refresh-infra-locks.yml
          git add package.json bun.lock apps/studio/bun.lock
          if git diff --cached --quiet; then
            echo 'Expected Infra consumer updates were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: consume released Infra destroy fix'
          git push origin HEAD:fix/520-acceptance-baseline
