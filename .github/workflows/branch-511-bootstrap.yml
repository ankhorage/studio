name: Branch 511 bootstrap

on:
  push:
    branches:
      - feat/511-reviewed-pending-module-owner-step

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update lockfile
        run: bun install
      - name: Reuse canonical host Orchestrator composition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/host/orchestrator/moduleManager.ts')
          source = path.read_text()
          source = source.replace(
              "import { createOrchestrator, type ModuleState, type Orchestrator } from '@ankhorage/orchestrator';",
              "import type { ModuleState, Orchestrator } from '@ankhorage/orchestrator';",
          )
          source = source.replace("  listHostModules,\n", "")
          source = source.replace(
              "import { ProjectManager } from './projectManager';",
              "import { createHostModuleOrchestrator } from './createHostModuleOrchestrator';\nimport { ProjectManager } from './projectManager';",
          )
          old = """    const orchestrator = createOrchestrator({
              modules: listHostModules().map((module) => module.definition),
              projectRoot: appPath,
            });"""
          if old not in source:
              raise SystemExit('expected ModuleManager Orchestrator composition not found')
          source = source.replace(old, "    const orchestrator = createHostModuleOrchestrator(appPath);")
          path.write_text(source)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/branch-511-bootstrap.yml
      - name: Format repository
        run: bun run format
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Commit validated bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: bootstrap reviewed pending module execution"
          git push
