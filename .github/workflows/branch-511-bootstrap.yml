name: Branch 511 bootstrap

on:
  push:
    branches:
      - feat/511-reviewed-pending-module-owner-step

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update lockfile
        run: bun install
      - name: Reuse canonical host Orchestrator composition
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/host/orchestrator/moduleManager.ts')
          source = path.read_text()
          source = source.replace(
              "import { createOrchestrator, type ModuleState, type Orchestrator } from '@ankhorage/orchestrator';",
              "import type { ModuleState, Orchestrator } from '@ankhorage/orchestrator';",
          )
          source = source.replace("  listHostModules,\n", "")
          source = source.replace(
              "import { ProjectManager } from './projectManager';",
              "import { createHostModuleOrchestrator } from './createHostModuleOrchestrator';\nimport { ProjectManager } from './projectManager';",
          )
          source, count = re.subn(
              r"    const orchestrator = createOrchestrator\(\{\n      modules: listHostModules\(\)\.map\(\(module\) => module\.definition\),\n      projectRoot: appPath,\n    \}\);",
              "    const orchestrator = createHostModuleOrchestrator(appPath);",
              source,
          )
          if count != 1:
              raise SystemExit(f'expected one ModuleManager Orchestrator composition, found {count}')
          path.write_text(source)
          PY
      - name: Remove dynamic delegation sink
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/features/project-updates/composition/createStudioProjectUpdateApplyOwnerStepPort.ts')
          source = path.read_text()
          old = """    : base[action](input);"""
          new = """    : action === 'executeAsync'
      ? base.executeAsync(input)
      : base.rollbackAsync(input);"""
          if old not in source:
              raise SystemExit('expected dynamic owner-step delegation not found')
          path.write_text(source.replace(old, new))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/branch-511-bootstrap.yml
      - name: Format repository
        run: bun run format
      - name: Autofix lint-safe imports
        run: bun run lint:fix
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Commit validated bootstrap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: bootstrap reviewed pending module execution"
          git push
