name: Temporary #542 published restart baseline

on:
  push:
    branches:
      - fix/542-published-restart-baseline

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/542-published-restart-baseline
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Advance published restart baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/published-studio-restart-boundary-acceptance.ts')
          text = path.read_text()
          text = text.replace("const OLD_STUDIO_VERSION = '2.7.7';", "const OLD_STUDIO_VERSION = '2.7.8';")
          text = text.replace("const CURRENT_STUDIO_VERSION = '2.7.8';", "const CURRENT_STUDIO_VERSION = '2.7.9';")
          text = text.replace('Reconstruct and validate the retained 2.7.7 lock state that existed before 2.7.8 was published.', 'Reconstruct and validate the retained 2.7.8 lock state that existed before 2.7.9 was published.')
          path.write_text(text)
          PY
          cat > .changeset/published-restart-baseline.md <<'EOF'
          ---
          ---

          Advance the published Studio restart acceptance baseline to the released 2.7.8 -> 2.7.9 transition.
          EOF
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate restart boundary
        run: bun scripts/published-studio-restart-boundary-acceptance.ts
      - name: Validate repository
        run: |
          bun run build
          bun run check-types
          bun run lint
          bun run format:check
          bun run knip:check
          bun run changeset:status
      - name: Commit validated fix
        shell: bash
        run: |
          rm .github/workflows/fix-542-temporary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(studio): advance published restart baseline"
          git push origin HEAD:fix/542-published-restart-baseline
