name: ADM12 apply

on:
  push:
    branches:
      - issue-127/canonical-theme-mode

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-127/canonical-theme-mode
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Apply source migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/adm12_apply.py')
          text = path.read_text()
          old = "replace_once(root_path, '    activeScreenId,\\n', '')"
          new = "replace_exact_count(root_path, '    activeScreenId,\\n', '', 2)"
          if text.count(old) != 1:
              raise SystemExit(f'expected one activeScreenId migration line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          python .github/adm12_apply.py
      - name: Update lockfile
        run: bun install
      - name: Format and lint-fix
        run: |
          bun run lint:fix
          bun run format
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Establish canonical generated theme mode chrome"
          git push origin HEAD:issue-127/canonical-theme-mode
