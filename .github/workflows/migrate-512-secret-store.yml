name: Finalize Studio Infra HTTP migration

on:
  push:
    branches:
      - fix/145-current-infra-consumer
    paths:
      - '.github/workflows/migrate-512-secret-store.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-current-infra-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Remove legacy script runtime HTTP semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/host/http/server.ts')
          text = path.read_text()
          text = text.replace("import {\n  InfraScriptExecutionError,\n  runProjectInfrastructureLifecycle,\n} from '@ankhorage/infra/project';\n", '')
          text = text.replace("import { stopAllProjectInfraPortForwards } from '../orchestrator/infraSession';\n", '')
          text = text.replace("import { getProjectPath } from '../orchestrator/projectPaths';\n", '')
          text = text.replace("import { trimOutputForApi } from '../utils/trimOutput';\n", '')
          text = text.replace("const MAX_INFRA_RUNTIME_OUTPUT_CHARS = 12_000;\n\n", '')

          text, down_count = re.subn(
            r"  fastify\.post\('/api/projects/:id/infra/down'.*?(?=\n  fastify\.post\('/api/projects/:id/infra/runtime-status')",
            """  fastify.post('/api/projects/:id/infra/down', async (req: FastifyRequest, reply) => {
            const { id } = req.params as { id: string };
            try {
              const status = await projectManager.downInfrastructure(id);
              return { success: true, status };
            } catch (err: unknown) {
              const message = err instanceof Error ? err.message : String(err);
              return reply.status(500).send({ error: message });
            }
          });
""",
            text,
            count=1,
            flags=re.S,
          )
          if down_count != 1:
            raise SystemExit(f'expected one infra/down route, found {down_count}')

          text, status_count = re.subn(
            r"  fastify\.post\('/api/projects/:id/infra/runtime-status'.*?(?=\n  fastify\.post\(\n    '/api/projects/:id/runtime/sync')",
            """  fastify.post('/api/projects/:id/infra/runtime-status', async (req: FastifyRequest, reply) => {
            const { id } = req.params as { id: string };
            try {
              const status = await projectManager.getInfrastructureStatus(id);
              return { success: true, status };
            } catch (err: unknown) {
              const message = err instanceof Error ? err.message : String(err);
              return reply.status(500).send({ error: message });
            }
          });
""",
            text,
            count=1,
            flags=re.S,
          )
          if status_count != 1:
            raise SystemExit(f'expected one infra/runtime-status route, found {status_count}')

          text, close_count = re.subn(
            r"\n  fastify\.addHook\('onClose', async \(\) => \{\n    await stopAllProjectInfraPortForwards\(\);\n  \}\);\n",
            '\n',
            text,
            count=1,
          )
          if close_count != 1:
            raise SystemExit(f'expected one legacy Infra onClose hook, found {close_count}')

          text, format_count = re.subn(
            r"\n/\*\*\* Trim infrastructure command output for one bounded HTTP response\. \*/\nfunction formatRuntimeOutputForResponse\(.*\Z",
            '\n',
            text,
            count=1,
            flags=re.S,
          )
          if format_count != 1:
            raise SystemExit(f'expected one legacy runtime output formatter, found {format_count}')

          path.write_text(text)
          PY

          rm -f .github/workflows/migrate-512-secret-store.yml
          rm -f .github/workflows/migrate-512-http-infra.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m 'refactor: expose typed infrastructure HTTP lifecycle'
          git push origin HEAD:fix/145-current-infra-consumer

      - name: Validate production build
        run: |
          bun install --frozen-lockfile
          bun run build
