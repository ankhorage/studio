name: Migrate Studio secret store

on:
  push:
    branches:
      - fix/145-current-infra-consumer
    paths:
      - '.github/workflows/migrate-512-secret-store.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-current-infra-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Migrate secret store to Supabase Vault owner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/host/secrets/projectSecretService.ts')
          text = path.read_text()
          text = text.replace("import { createInfraSecretStoreAdapter } from '@ankhorage/infra';\n", "import { createSupabaseVaultAdapter } from '@ankhorage/supabase-vault';\n")
          text = text.replace(
            "  readonly resolveDatabaseUrl?: (projectPath: string, target: string) => Promise<string>;\n",
            "  readonly resolveDatabaseUrl?: (projectPath: string) => Promise<string> | string;\n",
          )
          text = text.replace(
            "  private readonly resolveDatabaseUrl: (projectPath: string, target: string) => Promise<string>;\n",
            "  private readonly resolveDatabaseUrl: (projectPath: string) => Promise<string> | string;\n",
          )
          text = text.replace(
            "      ((projectPath, target) => resolveProjectSecretDatabaseUrl({ projectPath, target }));\n",
            "      (() => resolveProjectSecretDatabaseUrl());\n",
          )

          text, status_count = re.subn(
            r"      const infraStatus = await this\.projectManager\.getInfrastructureStatus\([^\n]+\);\n      if \(!infraStatus\.target\) throw new Error\('Project infrastructure target is unavailable\.'\);\n      const databaseUrl = await this\.resolveDatabaseUrl\(projectPath, infraStatus\.target\);\n",
            "      const databaseUrl = await this.resolveDatabaseUrl(projectPath);\n",
            text,
          )
          if status_count != 2:
            raise SystemExit(f'expected two legacy target/database blocks, found {status_count}')

          text, adapter_count = re.subn(
            r"      const adapter = createInfraSecretStoreAdapter\(\{\n        manifest: manifest\.infra,\n        providers: \{\n          supabaseVault: \{ client \},\n        \},\n      \}\);\n",
            "      const adapter = this.createSecretStoreAdapter(manifest, client);\n",
            text,
          )
          if adapter_count != 2:
            raise SystemExit(f'expected two legacy adapter blocks, found {adapter_count}')

          marker = """  /*** Open the trusted project secret adapter for one operation and always close its Vault client afterward. */
          private async withAdapter<TResult>(
          """
          helper = """  /*** Create the configured project secret-store adapter at the trusted Studio host boundary. */
          private createSecretStoreAdapter(
            manifest: AppManifest,
            client: BunSupabaseVaultClient,
          ): SecretStoreAdapter | null {
            if (manifest.infra.environments.local.secretStore?.provider !== 'supabase-vault') return null;
            return createSupabaseVaultAdapter({ client });
          }

          /*** Open the trusted project secret adapter for one operation and always close its Vault client afterward. */
          private async withAdapter<TResult>(
          """
          if marker not in text:
            raise SystemExit('withAdapter marker not found')
          text = text.replace(marker, helper, 1)
          path.write_text(text)
          PY

          rm .github/workflows/migrate-512-secret-store.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m 'refactor: use Supabase Vault secret-store owner'
          git push origin HEAD:fix/145-current-infra-consumer

      - name: Validate production build
        run: |
          bun install --frozen-lockfile
          bun run build
