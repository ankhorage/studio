name: Update Templates 11 SharkPrey generation

on:
  push:
    branches:
      - fix/templates-11-sharkprey-generation

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/templates-11-sharkprey-generation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Confirm released owners are visible in npm
        run: |
          test "$(npm view @ankhorage/contracts@19.1.0 version)" = "19.1.0"
          test "$(npm view @ankhorage/infra@5.1.0 version)" = "5.1.0"
          test "$(npm view @ankhorage/templates@11.0.3 version)" = "11.0.3"
      - name: Align current published owners
        run: |
          bun pm cache rm
          bun add '@ankhorage/contracts@^19.1.0' '@ankhorage/infra@^5.1.0' '@ankhorage/navigator@^3.2.5' '@ankhorage/templates@^11.0.3'
      - name: Add Studio patch changeset
        run: |
          cat > .changeset/sharkprey-templates-11.md <<'EOF'
          ---
          '@ankhorage/studio': patch
          ---

          Align Studio with the current Contracts, Infra and Templates owners so project creation uses the current SharkPrey training manifest.
          EOF
      - name: Verify resolved owner versions
        run: |
          node - <<'NODE'
          const expected = {
            '@ankhorage/contracts': '19.1.0',
            '@ankhorage/infra': '5.1.0',
            '@ankhorage/navigator': '3.2.5',
            '@ankhorage/templates': '11.0.3',
          };
          for (const [name, version] of Object.entries(expected)) {
            const actual = require(`./node_modules/${name}/package.json`).version;
            if (actual !== version) throw new Error(`Expected ${name} ${version}, got ${actual}`);
          }
          NODE
      - name: Focused SharkPrey project generation tests
        run: bun test src/host/orchestrator/projectCreationAssets.test.ts
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run knip:check
      - run: bun run test
      - run: bun run changeset:status
      - run: bun run format
      - name: Expo 57 generated app acceptance
        run: bun run test:acceptance:expo57-generated-app
      - name: Commit verified owner update and remove temporary runner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-templates-11-sharkprey-generation.yml
          git add -A
          git commit -m "fix: align Studio owners for SharkPrey generation"
          git push origin HEAD:fix/templates-11-sharkprey-generation
