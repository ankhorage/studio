name: Finalize auth runtime sync lint

on:
  push:
    branches:
      - fix/issue-182-auth-save-runtime-sync

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-182-auth-save-runtime-sync
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Write lint-clean implementation
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path

          Path('src/studioRuntimeApi.ts').write_bytes(base64.b64decode(''))
          Path('src/studioRuntimeApi.test.ts').write_bytes(base64.b64decode(' return input.toString();
  return input.url;
}
'))
          PY

      - name: Restore complete test helper tail
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/studioRuntimeApi.test.ts')
          source = path.read_text()
          marker = "function requestUrl(input: string | URL | Request): string {"
          prefix = source.split(marker)[0]
          path.write_text(prefix + """function requestUrl(input: string | URL | Request): string {
            if (typeof input === 'string') return input;
            if (input instanceof URL) return input.toString();
            return input.url;
          }
          """)
          for workflow in (
              '.github/workflows/tmp-fix-auth-hook-deps.yml',
              '.github/workflows/tmp-finalize-auth-runtime-lint.yml',
          ):
              Path(workflow).unlink(missing_ok=True)
          PY

      - name: Validate
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/studioRuntimeApi.ts src/studioRuntimeApi.test.ts
          bun test src/ui/admin/pages/AuthAdminPage.test.ts src/studioRuntimeApi.test.ts
          bun run typecheck
          bun run lint
          git diff --exit-code -- bun.lock

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: satisfy auth runtime sync lint rules'
          git push origin HEAD:fix/issue-182-auth-save-runtime-sync
