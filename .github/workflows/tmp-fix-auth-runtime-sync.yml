name: Temporary auth runtime sync fix

on:
  push:
    branches:
      - fix/issue-182-auth-save-runtime-sync

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-182-auth-save-runtime-sync
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Patch auth save runtime synchronization
        run: |
          python3 <<'PY'
          from pathlib import Path

          auth_page = Path('src/ui/admin/pages/AuthAdminPage.tsx')
          source = auth_page.read_text()
          source = source.replace(
              "import { configureProjectOAuthProvider } from '../../../projectSecretApi';\n",
              "import { configureProjectOAuthProvider } from '../../../projectSecretApi';\nimport { syncStudioRuntime } from '../../../studioRuntimeApi';\n",
          )
          source = source.replace(
              "      await flushManifest();\n      setMessage(nextMessage);\n      await refreshHealth();",
              "      await flushManifest();\n      await syncStudioRuntime(projectId);\n      setMessage(nextMessage);\n      await refreshHealth();",
          )
          source = source.replace(
              "persistAuthDraft(draft, 'Authentication configuration saved to the Studio manifest.'),",
              "persistAuthDraft(draft, 'Authentication configuration saved and applied to the generated app.'),",
          )
          auth_page.write_text(source)

          auth_test = Path('src/ui/admin/pages/AuthAdminPage.test.ts')
          source = auth_test.read_text()
          source = source.replace(
              "  expect(source).toContain('await flushManifest()');\n",
              "  expect(source).toContain('await flushManifest()');\n  expect(source).toContain('await syncStudioRuntime(projectId)');\n",
          )
          auth_test.write_text(source)

          Path('src/studioRuntimeApi.ts').write_text("""import type { AppManifest } from '@ankhorage/contracts';

import { API_BASE } from './core/constants';

export async function syncStudioRuntime(projectId: string): Promise<void> {
  const encodedProjectId = encodeURIComponent(projectId);
  const manifestResponse = await fetch(`${API_BASE}/projects/${encodedProjectId}/studio/manifest`);
  const manifest = await readJson(manifestResponse, 'Studio manifest');
  if (!manifestResponse.ok) {
    throw new Error(readErrorMessage(manifest, 'Unable to load the Studio manifest.'));
  }

  const runtimeResponse = await fetch(`${API_BASE}/projects/${encodedProjectId}/studio/runtime`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(manifest as AppManifest),
  });
  const runtimeResult = await readJson(runtimeResponse, 'Studio runtime sync');
  if (!runtimeResponse.ok) {
    throw new Error(readErrorMessage(runtimeResult, 'Unable to apply the Studio runtime.'));
  }
}

async function readJson(response: Response, label: string): Promise<unknown> {
  try {
    return await response.json();
  } catch {
    throw new Error(`${label} returned non-JSON status ${response.status}.`);
  }
}

function readErrorMessage(value: unknown, fallback: string): string {
  if (typeof value !== 'object' || value === null) return fallback;
  const error = (value as Record<string, unknown>).error;
  if (typeof error === 'string' && error.trim().length > 0) return error;
  if (typeof error !== 'object' || error === null) return fallback;
  const message = (error as Record<string, unknown>).message;
  return typeof message === 'string' && message.trim().length > 0 ? message : fallback;
}
""")

          Path('src/studioRuntimeApi.test.ts').write_text("""import { afterEach, expect, mock, test } from 'bun:test';

import { syncStudioRuntime } from './studioRuntimeApi';

const originalFetch = globalThis.fetch;

afterEach(() => {
  globalThis.fetch = originalFetch;
});

test('syncStudioRuntime loads the persisted draft and applies it to the generated runtime', async () => {
  const requests: Array<{ url: string; init?: RequestInit }> = [];
  const manifest = { metadata: { name: 'Scanner' }, infra: {}, navigator: {}, screens: {} };

  globalThis.fetch = mock(async (input: string | URL | Request, init?: RequestInit) => {
    const url = String(input);
    requests.push({ url, init });
    if (url.endsWith('/projects/scanner/studio/manifest')) {
      return Response.json(manifest);
    }
    if (url.endsWith('/projects/scanner/studio/runtime')) {
      return Response.json({ success: true });
    }
    return Response.json({ error: 'Unexpected request' }, { status: 404 });
  }) as typeof fetch;

  await syncStudioRuntime('scanner');

  expect(requests).toHaveLength(2);
  expect(requests[0]?.url).toEndWith('/projects/scanner/studio/manifest');
  expect(requests[1]?.url).toEndWith('/projects/scanner/studio/runtime');
  expect(requests[1]?.init?.method).toBe('PUT');
  expect(requests[1]?.init?.headers).toEqual({ 'Content-Type': 'application/json' });
  expect(requests[1]?.init?.body).toBe(JSON.stringify(manifest));
});

test('syncStudioRuntime surfaces host runtime errors', async () => {
  globalThis.fetch = mock(async (input: string | URL | Request) => {
    const url = String(input);
    if (url.endsWith('/studio/manifest')) {
      return Response.json({ metadata: {}, infra: {}, navigator: {}, screens: {} });
    }
    return Response.json({ error: 'OAuth is enabled but no provider is enabled.' }, { status: 500 });
  }) as typeof fetch;

  expect(syncStudioRuntime('scanner')).rejects.toThrow(
    'OAuth is enabled but no provider is enabled.',
  );
});
""")

          Path('.changeset/auth-save-runtime-sync.md').write_text("""---
'@ankhorage/studio': patch
---

Apply saved authentication settings to the generated Studio runtime so newly enabled OAuth providers appear on the sign-in screen immediately.
""")

          Path('.github/workflows/tmp-fix-auth-runtime-sync.yml').unlink()
          PY

      - name: Format and validate focused tests
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/ui/admin/pages/AuthAdminPage.tsx src/ui/admin/pages/AuthAdminPage.test.ts src/studioRuntimeApi.ts src/studioRuntimeApi.test.ts .changeset/auth-save-runtime-sync.md
          bun test src/ui/admin/pages/AuthAdminPage.test.ts src/studioRuntimeApi.test.ts
          bun run typecheck

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply auth saves to generated runtime'
          git push origin HEAD:fix/issue-182-auth-save-runtime-sync
