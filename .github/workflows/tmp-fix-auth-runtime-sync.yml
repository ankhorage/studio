name: Temporary auth runtime sync fix

on:
  push:
    branches:
      - fix/issue-182-auth-save-runtime-sync

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-182-auth-save-runtime-sync
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Patch auth save runtime synchronization
        run: |
          python3 <<'PY'
          import base64
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if source.count(old) != 1:
                  raise RuntimeError(f'{label}: expected one match, found {source.count(old)}')
              return source.replace(old, new, 1)

          auth_page = Path('src/ui/admin/pages/AuthAdminPage.tsx')
          source = auth_page.read_text()
          source = replace_once(
              source,
              "import { configureProjectOAuthProvider } from '../../../projectSecretApi';\n",
              "import { configureProjectOAuthProvider } from '../../../projectSecretApi';\nimport { syncStudioRuntime } from '../../../studioRuntimeApi';\n",
              'runtime import',
          )
          source = replace_once(
              source,
              "      await flushManifest();\n      setMessage(nextMessage);\n      await refreshHealth();",
              "      await flushManifest();\n      await syncStudioRuntime(projectId);\n      setMessage(nextMessage);\n      await refreshHealth();",
              'auth save sequence',
          )
          source = replace_once(
              source,
              "persistAuthDraft(draft, 'Authentication configuration saved to the Studio manifest.'),",
              "persistAuthDraft(draft, 'Authentication configuration saved and applied to the generated app.'),",
              'success message',
          )
          auth_page.write_text(source)

          auth_test = Path('src/ui/admin/pages/AuthAdminPage.test.ts')
          source = auth_test.read_text()
          source = replace_once(
              source,
              "  expect(source).toContain('await flushManifest()');\n",
              "  expect(source).toContain('await flushManifest()');\n  expect(source).toContain('await syncStudioRuntime(projectId)');\n",
              'auth page assertion',
          )
          auth_test.write_text(source)

          Path('src/studioRuntimeApi.ts').write_bytes(base64.b64decode(''))
          Path('src/studioRuntimeApi.test.ts').write_bytes(base64.b64decode(''))
          Path('.changeset/auth-save-runtime-sync.md').write_bytes(base64.b64decode('LS0tCidAYW5raG9yYWdlL3N0dWRpbyc6IHBhdGNoCi0tLQoKQXBwbHkgc2F2ZWQgYXV0aGVudGljYXRpb24gc2V0dGluZ3MgdG8gdGhlIGdlbmVyYXRlZCBTdHVkaW8gcnVudGltZSBzbyBuZXdseSBlbmFibGVkIE9BdXRoIHByb3ZpZGVycyBhcHBlYXIgb24gdGhlIHNpZ24taW4gc2NyZWVuIGltbWVkaWF0ZWx5Lgo='))
          Path('.github/workflows/tmp-fix-auth-runtime-sync.yml').unlink()
          PY

      - name: Format and validate focused tests
        run: |
          bun install --frozen-lockfile
          bunx prettier --write src/ui/admin/pages/AuthAdminPage.tsx src/ui/admin/pages/AuthAdminPage.test.ts src/studioRuntimeApi.ts src/studioRuntimeApi.test.ts .changeset/auth-save-runtime-sync.md
          bun test src/ui/admin/pages/AuthAdminPage.test.ts src/studioRuntimeApi.test.ts
          bun run typecheck

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply auth saves to generated runtime'
          git push origin HEAD:fix/issue-182-auth-save-runtime-sync
