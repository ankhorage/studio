name: APM lock refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/500-owner-aware-apm-composition'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Refresh APM dependency and lockfile
        run: bun add '@ankhorage/apm@^0.6.0'

      - name: Commit canonical dependency files
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "Dependency files are already current."
            exit 0
          fi
          git config user.name "ankhorage-apm-lock[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore: upgrade APM to 0.6"
          git fetch origin "${HEAD_BRANCH}"
          git rebase "origin/${HEAD_BRANCH}"
          git push origin "HEAD:${HEAD_BRANCH}"
