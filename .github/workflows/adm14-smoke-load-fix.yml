name: ADM-14 Smoke Import Isolation

on:
  push:
    branches:
      - agent/adm14-bundled-assets-authoring

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch one skipped smoke test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/host/studioWorkspaceExpoWeb.smoke.test.ts')
          s = p.read_text()
          s = s.replace("import { startStudioHostServerWithSecrets } from './http/serverWithSecrets';\n", '', 1)
          s = s.replace("import { getTemplateCatalog } from './templateRegistry';\n", '', 1)
          s = s.replace('      const { category, template } = getSmokeTemplateSelection();', '      const { category, template } = await getSmokeTemplateSelection();', 1)
          s = s.replace("      studioHost = await startStudioHostServerWithSecrets({", "      const { startStudioHostServerWithSecrets } = await import('./http/serverWithSecrets');\n      studioHost = await startStudioHostServerWithSecrets({", 1)
          s = s.replace("function getSmokeTemplateSelection() {\n  const category = getTemplateCatalog().categories.find((entry) => entry.templates.length > 0);", "async function getSmokeTemplateSelection() {\n  const { getTemplateCatalog } = await import('./templateRegistry');\n  const category = getTemplateCatalog().categories.find((entry) => entry.templates.length > 0);", 1)
          p.write_text(s)
          PY
          git diff --check -- src/host/studioWorkspaceExpoWeb.smoke.test.ts
      - name: Commit test-only isolation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/host/studioWorkspaceExpoWeb.smoke.test.ts
          git commit -m 'Isolate skipped Studio web smoke imports'
          git push origin HEAD:agent/adm14-bundled-assets-authoring
