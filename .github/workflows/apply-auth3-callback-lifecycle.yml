name: Apply auth3 callback lifecycle

on:
  push:
    branches:
      - agent/auth-3-callback-lifecycle

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth-3-callback-lifecycle
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply callback lifecycle changes
        run: |
          python scripts/apply-auth3-callback-lifecycle.py
          python scripts/fix-auth3-stale-expectations.py

      - name: Install released dependencies
        run: bun install

      - name: Apply repository formatting
        run: |
          bun run lint:fix
          bun run format

      - name: Validate implementation
        run: |
          bun test src/host/generatedOAuthLifecycle.e2e.test.ts
          bun run build
          bun run lint
          bun run format:check
          bun run test
          bun run knip
          bun run typecheck
          bun run changeset:status
          npm pack --dry-run

      - name: Commit validated implementation and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-auth3-callback-lifecycle.yml
          git rm scripts/apply-auth3-callback-lifecycle.py
          git rm scripts/fix-auth3-e2e-module-resolution.py
          git rm scripts/fix-auth3-stale-expectations.py
          git add -A
          git commit -m "Complete generated OAuth callback lifecycle"
          git push
