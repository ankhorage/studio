name: Auth4 platform readiness apply

on:
  push:
    branches:
      - agent/auth4-platform-readiness

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth4-platform-readiness
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply Studio slice
        env:
          PATCH_GZ_B64: ''
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/auth4_apply.py
          python /tmp/auth4_apply.py

      - name: Resolve lockfile
        run: |
          bun install --lockfile-only
          bun install --frozen-lockfile

      - name: Format and validate
        run: |
          bun run format
          bun run build
          bunx @ankhorage/ankh doctor validate .
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run typecheck

      - name: Commit product changes
        run: |
          rm .github/workflows/auth4-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Add platform-aware auth administration'
          git push origin HEAD:agent/auth4-platform-readiness
