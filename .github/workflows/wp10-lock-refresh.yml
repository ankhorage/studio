name: WP10 lock refresh

on:
  push:
    branches:
      - chore/705-wp10-completion-gate

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Refresh root and Studio app lockfiles
        run: |
          bun install --lockfile-only
          bun install --cwd apps/studio --lockfile-only
      - name: Commit lockfiles
        run: |
          if git diff --quiet -- bun.lock apps/studio/bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock apps/studio/bun.lock
          git commit -m "chore(deps): refresh Expo Runtime lockfiles"
          git push
