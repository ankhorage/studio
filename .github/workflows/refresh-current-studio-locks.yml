name: Refresh current Studio locks

on:
  push:
    branches:
      - test/561-current-published-update-lifecycle

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --lockfile-only
      - run: bun install --cwd apps/studio --lockfile-only
      - run: bun update --cwd apps/studio @ankhorage/apm --lockfile-only
      - name: Commit lockfiles
        run: |
          if git diff --quiet -- bun.lock apps/studio/bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock apps/studio/bun.lock
          git commit -m "chore: refresh current Studio lockfiles"
          git push
