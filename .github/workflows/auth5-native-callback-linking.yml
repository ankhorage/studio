name: Auth5 native callback linking

on:
  push:
    branches:
      - agent/auth5-native-callback-linking

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth5-native-callback-linking
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply Auth 5 Studio consumer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement anchor, found {count}')
              file.write_text(text.replace(old, new, 1))

          replace_once(
              'package.json',
              '"@ankhorage/expo-runtime": "^2.2.1"',
              '"@ankhorage/expo-runtime": "^2.3.0"',
          )

          replace_once(
              'src/host/orchestrator/templates.ts',
              '  resolveExpoRuntimeDependencyMap,\n  resolveExpoRuntimeNativeOutput,',
              '  resolveExpoRuntimeDependencyMap,\n  resolveExpoRuntimeNativeOutput,\n  resolveExpoRuntimeNativeSchemeMap,',
          )
          replace_once(
              'src/host/orchestrator/templates.ts',
              "function serializeAndroidConfig(args: {\n  target: AppDeployAndroidTargetConfig;\n  runtimePlan?: ExpoRuntimePlan;\n}): string {\n  const permissions = resolveExpoRuntimeNativeOutput(args.runtimePlan).androidPermissions;\n  const extraLines =\n    permissions.length > 0\n      ? `\n    permissions: ${serializeJsValue(permissions, 2)},`\n      : '';\n  const schemeLine = args.target.scheme\n    ? `\n    scheme: ${serializeStringLiteral(args.target.scheme)},`\n    : '';\n\n  return `{\n    ...config.android,${extraLines}\n    package: ${serializeStringLiteral(args.target.package)},${schemeLine}\n  }`;\n}\n\nfunction serializeIosConfig(target: AppDeployIosTargetConfig): string {\n  const schemeLine = target.scheme\n    ? `\n    scheme: ${serializeStringLiteral(target.scheme)},`\n    : '';\n\n  return `{\n    ...config.ios,\n    bundleIdentifier: ${serializeStringLiteral(target.bundleIdentifier)},${schemeLine}\n  }`;\n}",
              "function serializeAndroidConfig(args: {\n  target: AppDeployAndroidTargetConfig;\n  scheme?: string;\n  runtimePlan?: ExpoRuntimePlan;\n}): string {\n  const permissions = resolveExpoRuntimeNativeOutput(args.runtimePlan).androidPermissions;\n  const extraLines =\n    permissions.length > 0\n      ? `\n    permissions: ${serializeJsValue(permissions, 2)},`\n      : '';\n  const schemeLine = args.scheme\n    ? `\n    scheme: ${serializeStringLiteral(args.scheme)},`\n    : '';\n\n  return `{\n    ...config.android,${extraLines}\n    package: ${serializeStringLiteral(args.target.package)},${schemeLine}\n  }`;\n}\n\nfunction serializeIosConfig(args: { target: AppDeployIosTargetConfig; scheme?: string }): string {\n  const schemeLine = args.scheme\n    ? `\n    scheme: ${serializeStringLiteral(args.scheme)},`\n    : '';\n\n  return `{\n    ...config.ios,\n    bundleIdentifier: ${serializeStringLiteral(args.target.bundleIdentifier)},${schemeLine}\n  }`;\n}",
          )
          replace_once(
              'src/host/orchestrator/templates.ts',
              '  const sections: string[] = [];\n  if (args.targets.android?.enabled) {',
              '  const sections: string[] = [];\n  const nativeSchemes = resolveExpoRuntimeNativeSchemeMap(args.targets);\n  if (args.targets.android?.enabled) {',
          )
          replace_once(
              'src/host/orchestrator/templates.ts',
              '`  android: ${serializeAndroidConfig({ target: args.targets.android, runtimePlan: args.runtimePlan })},`,',
              '`  android: ${serializeAndroidConfig({ target: args.targets.android, scheme: nativeSchemes.android, runtimePlan: args.runtimePlan })},`,',
          )
          replace_once(
              'src/host/orchestrator/templates.ts',
              '    sections.push(`  ios: ${serializeIosConfig(args.targets.ios)},`);',
              '    sections.push(\n      `  ios: ${serializeIosConfig({ target: args.targets.ios, scheme: nativeSchemes.ios })},`,\n    );',
          )

          replace_once(
              'src/host/layout/layoutGenerator.ts',
              '  type ExpoRuntimePlan,\n  resolveExpoRuntimeLayoutIntegration,',
              '  type ExpoRuntimePlan,\n  resolveExpoRuntimeLayoutIntegration,\n  resolveExpoRuntimeNativeSchemeMap,',
          )
          replace_once(
              'src/host/layout/layoutGenerator.ts',
              '          content: this.getGeneratedAuthFileContent(generatedAuthFile, authLayoutPlan),',
              '          content: this.getGeneratedAuthFileContent(\n            generatedAuthFile,\n            authLayoutPlan,\n            manifest,\n          ),',
          )
          replace_once(
              'src/host/layout/layoutGenerator.ts',
              '  private getGeneratedAuthFileContent(\n    filePlan: AuthGeneratedFilePlan,\n    authLayoutPlan: EnabledAuthLayoutPlan,\n  ): string {',
              '  private getGeneratedAuthFileContent(\n    filePlan: AuthGeneratedFilePlan,\n    authLayoutPlan: EnabledAuthLayoutPlan,\n    manifest: AppManifest,\n  ): string {',
          )
          replace_once(
              'src/host/layout/layoutGenerator.ts',
              '        return getAuthOAuthRuntimeTs(authLayoutPlan.oauth);',
              "        return getAuthOAuthRuntimeTs({\n          ...authLayoutPlan.oauth,\n          nativeSchemes: resolveExpoRuntimeNativeSchemeMap(manifest.deploy?.targets ?? {}),\n        });",
          )

          replace_once(
              'src/host/layout/templates/auth/oauth.ts',
              "import type { AuthOAuthLayoutPlan } from '../../auth/resolveAuthLayoutPlan';\nimport { escapeStringLiteral } from '../../utils/escapeStringLiteral';\n\nexport function getAuthOAuthRuntimeTs(args: AuthOAuthLayoutPlan) {\n  const callbackRoute = escapeStringLiteral(args.callbackRoute);\n  const providers = JSON.stringify(args.providers);",
              "import type { ExpoRuntimeNativeSchemeMap } from '@ankhorage/expo-runtime/planning';\n\nimport type { AuthOAuthLayoutPlan } from '../../auth/resolveAuthLayoutPlan';\nimport { escapeStringLiteral } from '../../utils/escapeStringLiteral';\n\ninterface AuthOAuthRuntimeTemplateArgs extends AuthOAuthLayoutPlan {\n  readonly nativeSchemes: ExpoRuntimeNativeSchemeMap;\n}\n\nexport function getAuthOAuthRuntimeTs(args: AuthOAuthRuntimeTemplateArgs) {\n  const callbackRoute = escapeStringLiteral(args.callbackRoute);\n  const providers = JSON.stringify(args.providers);\n  const androidScheme =\n    args.nativeSchemes.android === undefined\n      ? 'undefined'\n      : `'${escapeStringLiteral(args.nativeSchemes.android)}'`;\n  const iosScheme =\n    args.nativeSchemes.ios === undefined\n      ? 'undefined'\n      : `'${escapeStringLiteral(args.nativeSchemes.ios)}'`;",
          )
          replace_once(
              'src/host/layout/templates/auth/oauth.ts',
              'const GENERATED_OAUTH_PROVIDERS = ${providers} as const;\n',
              "const GENERATED_OAUTH_PROVIDERS = ${providers} as const;\nconst GENERATED_NATIVE_SCHEMES = {\n  android: ${androidScheme},\n  ios: ${iosScheme},\n} as const;\n",
          )
          replace_once(
              'src/host/layout/templates/auth/oauth.ts',
              '  return Linking.createURL(callbackPath);',
              "  const nativeScheme =\n    Platform.OS === 'android'\n      ? GENERATED_NATIVE_SCHEMES.android\n      : Platform.OS === 'ios'\n        ? GENERATED_NATIVE_SCHEMES.ios\n        : undefined;\n  if (!nativeScheme) {\n    throw new Error('Native OAuth requires a configured application scheme.');\n  }\n\n  return Linking.createURL(callbackPath, { scheme: nativeScheme });",
          )

          replace_once(
              'src/host/layout/templates/auth/oauth.test.ts',
              'function createOAuthRuntime(): string {\n  return getAuthOAuthRuntimeTs({',
              "function createOAuthRuntime(\n  nativeSchemes: { readonly android?: string; readonly ios?: string } = {\n    android: 'ankh-android',\n    ios: 'ankh-ios',\n  },\n): string {\n  return getAuthOAuthRuntimeTs({",
          )
          replace_once(
              'src/host/layout/templates/auth/oauth.test.ts',
              "    callbackTopLevelRouteName: 'auth',\n    providers:",
              "    callbackTopLevelRouteName: 'auth',\n    nativeSchemes,\n    providers:",
          )
          replace_once(
              'src/host/layout/templates/auth/oauth.test.ts',
              "test('generates adapter-owned OAuth lifecycle coordination with a correlation-only marker', () => {",
              "test('derives native callbacks from canonical platform schemes', () => {\n  const runtime = createOAuthRuntime({\n    android: 'ankh-android-auth',\n    ios: 'ankh-ios-auth',\n  });\n\n  expect(runtime).toContain(\"android: 'ankh-android-auth'\");\n  expect(runtime).toContain(\"ios: 'ankh-ios-auth'\");\n  expect(runtime).toContain(\"Platform.OS === 'android'\");\n  expect(runtime).toContain(\"Platform.OS === 'ios'\");\n  expect(runtime).toContain('return Linking.createURL(callbackPath, { scheme: nativeScheme });');\n  expect(runtime).not.toContain('return Linking.createURL(callbackPath);');\n});\n\ntest('does not invent a native callback scheme when none is configured', () => {\n  const runtime = createOAuthRuntime({});\n\n  expect(runtime).toContain('android: undefined');\n  expect(runtime).toContain('ios: undefined');\n  expect(runtime).toContain(\n    \"throw new Error('Native OAuth requires a configured application scheme.');\",\n  );\n});\n\ntest('generates adapter-owned OAuth lifecycle coordination with a correlation-only marker', () => {",
          )

          replace_once(
              'src/host/layout/layoutGenerator.test.ts',
              "  test('generates a Supabase Auth adapter that only reads Expo public env statically', () => {",
              "  test('injects canonical native target schemes into the generated OAuth runtime', () => {\n    const manifest: AppManifest = {\n      ...createOAuthManifest(),\n      deploy: {\n        targets: {\n          web: { enabled: true },\n          android: {\n            enabled: true,\n            package: 'com.example.android',\n            scheme: 'ankh-android-auth',\n          },\n          ios: {\n            enabled: true,\n            bundleIdentifier: 'com.example.ios',\n            scheme: 'ankh-ios-auth',\n          },\n        },\n      },\n    };\n    const files = new GeneratedAppFileGenerator().generateFiles('/tmp/demo', manifest, [], {\n      includeStudio: false,\n    });\n    const oauth = files.find((file) => file.path === 'src/auth/oauth.ts')?.content ?? '';\n\n    expect(oauth).toContain(\"android: 'ankh-android-auth'\");\n    expect(oauth).toContain(\"ios: 'ankh-ios-auth'\");\n    expect(oauth).not.toContain('com.example.android');\n    expect(oauth).not.toContain('com.example.ios');\n  });\n\n  test('generates a Supabase Auth adapter that only reads Expo public env statically', () => {",
          )

          changeset = Path('.changeset/auth5-native-callback-linking.md')
          changeset.write_text("""---\n'@ankhorage/studio': minor\n---\n\nGenerate native brokered OAuth callbacks from canonical Expo target schemes.\n""")
          PY

      - name: Resolve Expo Runtime dependency
        run: |
          bun update @ankhorage/expo-runtime --lockfile-only
          bun install --frozen-lockfile

      - name: Format and validate
        run: |
          bun run format
          bun run lint:fix
          bun run build
          bunx ankh doctor validate .
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run test:smoke:studio-web
          bun run test:e2e:generated-app-web
          bun run typecheck
          bun run changeset:status

      - name: Commit validated consumer
        run: |
          rm .github/workflows/auth5-native-callback-linking.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Generate target-aware native OAuth callbacks'
          git push origin HEAD:agent/auth5-native-callback-linking
