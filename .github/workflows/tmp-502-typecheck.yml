name: Infra 5 migration typecheck

on:
  push:
    branches:
      - fix/502-infra5-project-lifecycle

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/502-infra5-project-lifecycle
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Typecheck current Infra 5 migration
        run: bun run typecheck
