name: Fix auth2 lint

on:
  push:
    branches:
      - agent/auth-2-studio-runtime-diagnostics

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth-2-studio-runtime-diagnostics
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply lint and formatting fixes
        run: bun run lint:fix

      - name: Commit fixes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-auth2-lint.yml
          git add -A
          git commit -m "Apply Auth runtime diagnostics lint fixes"
          git push
