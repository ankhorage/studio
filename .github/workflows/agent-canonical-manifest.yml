name: Agent canonical manifest repair

on:
  push:
    branches:
      - agent/canonical-manifest-persistence

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-manifest-persistence
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Repair package imports and duplicate replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          for root in (Path('src'), Path('docs')):
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx', '.md'}:
                      continue
                  text = path.read_text()
                  updated = text.replace('@ankhorage/runtime/sync', '@ankhorage/studio/runtime')
                  updated = updated.replace('@ankhorage/manifest', '@ankhorage/studio/manifest')
                  updated = updated.replace(
                      "'getInfrastructureStatus' | 'getProjectManifest' | 'getProjectManifest'",
                      "'getInfrastructureStatus' | 'getProjectManifest'",
                  )
                  updated = updated.replace(
                      "'getProjectManifest' | 'getProjectManifest' | 'persistProjectManifest'",
                      "'getProjectManifest' | 'persistProjectManifest'",
                  )
                  lines = updated.splitlines(keepends=True)
                  deduped = []
                  for line in lines:
                      if deduped and line == deduped[-1] and 'getProjectManifest' in line:
                          continue
                      deduped.append(line)
                  updated = ''.join(deduped)
                  if updated != text:
                      path.write_text(updated)
          PY
      - run: bun install --frozen-lockfile
      - run: bun run lint:fix || true
      - run: bun run format
      - name: Commit repair output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: scope canonical manifest migration"
          git push
