name: Agent canonical manifest migration

on:
  push:
    branches:
      - agent/canonical-manifest-persistence

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-manifest-persistence
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Rewrite remaining canonical-manifest consumers
        run: |
          python - <<'PY'
          from pathlib import Path

          excluded = {
              Path('src/host/http/server.ts'),
              Path('src/host/orchestrator/projectManager.ts'),
              Path('src/host/orchestrator/projectStore.ts'),
              Path('src/host/orchestrator/moduleManager.ts'),
          }
          replacements = {
              'syncStudioRuntime': 'syncProjectRuntime',
              'saveStudioManifest': 'persistProjectManifest',
              'getStudioManifest': 'getProjectManifest',
              '/studio/manifest': '/manifest',
              '/studio/runtime': '/runtime/sync',
          }
          for root in (Path('src'), Path('docs')):
              for path in root.rglob('*'):
                  if path in excluded or path.suffix not in {'.ts', '.tsx', '.md'}:
                      continue
                  text = path.read_text()
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated)

          server_path = Path('src/host/http/server.ts')
          server = server_path.read_text()
          start = server.index('  // GET studio manifest draft\n')
          end = server.index('  // GET manifest\n', start)
          runtime_route = '''  fastify.post(
            '/api/projects/:id/runtime/sync',
            async (req: FastifyRequest, reply: FastifyReply) => {
              const { id } = req.params as { id: string };
              try {
                return await orchestrator.syncProjectRuntime(id);
              } catch (err: unknown) {
                const message = err instanceof Error ? err.message : String(err);
                reply.status(500).send({ error: message });
              }
            },
          );

          '''
          server = server[:start] + runtime_route + server[end:]
          server = server.replace(
              'return await orchestrator.saveProjectManifest({',
              'return await orchestrator.persistProjectManifest({',
              1,
          )
          server_path.write_text(server)
          PY
      - run: bun install --frozen-lockfile
      - run: bun run lint:fix || true
      - run: bun run format
      - name: Commit migration output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: migrate Studio to canonical manifest API"
          git push
