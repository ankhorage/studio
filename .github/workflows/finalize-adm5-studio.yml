name: Finalize ADM 5 Studio Phase 4

on:
  push:
    branches:
      - agent/adm-5-generated-api-authoring

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply Studio Phase 4 overlay
        run: |
          wc -c \
            .adm5-overlay/part00 \
            .adm5-overlay/part01 \
            .adm5-overlay/part02 \
            .adm5-overlay/part03 \
            .adm5-overlay/part04a \
            .adm5-overlay/part04b
          sha256sum \
            .adm5-overlay/part00 \
            .adm5-overlay/part01 \
            .adm5-overlay/part02 \
            .adm5-overlay/part03 \
            .adm5-overlay/part04a \
            .adm5-overlay/part04b
          cat \
            .adm5-overlay/part00 \
            .adm5-overlay/part01 \
            .adm5-overlay/part02 \
            .adm5-overlay/part03 \
            .adm5-overlay/part04a \
            .adm5-overlay/part04b \
            > /tmp/adm5-overlay.b64
          echo '58735f99ff0adae22f64bd2ee37e8e7ca5e12574f649304f953ff4c3d0a21f6a  /tmp/adm5-overlay.b64' | sha256sum -c -
          base64 -d /tmp/adm5-overlay.b64 > /tmp/adm5-overlay.tar.gz
          echo 'cbd8be5755f382f9f8eb2eb5c49fb5f9e598ee4f578fb310614fe5157b9cb5d2  /tmp/adm5-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/adm5-overlay.tar.gz

          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies['@ankhorage/contracts'] = '^4.0.2';
          pkg.dependencies['@ankhorage/data-sources'] = '^1.0.0';
          pkg.dependencies['@ankhorage/expo-runtime'] = '^1.0.0';
          pkg.dependencies['@ankhorage/infra'] = '^2.0.0';
          pkg.dependencies['@ankhorage/runtime'] = '^1.0.0';
          pkg.dependencies['@ankhorage/templates'] = '^3.0.1';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE

      - name: Apply strict lint corrections
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceExactly = (path, before, after) => {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) {
              throw new Error(`Expected source fragment was not found in ${path}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          };

          replaceExactly(
            'src/core/StudioProvider.ts',
            '        diagnostics = result.diagnostics;',
            '        ({ diagnostics } = result);',
          );

          const modelTestPath = 'src/ui/admin/pages/generatedApiEditorModel.test.ts';
          let modelTest = fs.readFileSync(modelTestPath, 'utf8');
          const resourceDeclaration = '    const resource = draft.resources[0];';
          const resourceCount = modelTest.split(resourceDeclaration).length - 1;
          if (resourceCount !== 2) {
            throw new Error(`Expected two resource declarations, found ${resourceCount}`);
          }
          modelTest = modelTest.replaceAll(
            resourceDeclaration,
            '    const [resource] = draft.resources;',
          );

          const resultMarker = '    const result = resolveGeneratedApiEditorDraft({';
          if (!modelTest.includes(resultMarker)) {
            throw new Error('Expected generated API editor result marker was not found.');
          }
          modelTest = modelTest.replace(
            resultMarker,
            "    const [idField] = resource.fields;\n    if (!idField) throw new Error('Expected default field.');\n\n" + resultMarker,
          );

          const assertedField = "            { ...resource.fields[0]!, name: 'id' },";
          if (!modelTest.includes(assertedField)) {
            throw new Error('Expected non-null asserted field fixture was not found.');
          }
          modelTest = modelTest.replace(
            assertedField,
            "            { ...idField, name: 'id' },",
          );
          fs.writeFileSync(modelTestPath, modelTest);
          NODE

      - name: Refresh released dependencies
        run: bun install

      - name: Apply lint autofixes
        run: bun run lint:fix

      - name: Format sources
        run: bun run format

      - name: Run build
        run: bun run build

      - name: Validate repository
        run: bunx @ankhorage/ankh doctor validate .

      - name: Run lint
        run: bun run lint

      - name: Run format check
        run: bun run format:check

      - name: Run Knip
        run: bun run knip

      - name: Run tests
        run: bun run test

      - name: Run Studio web smoke test
        run: bun run test:smoke:studio-web

      - name: Run generated app web E2E
        run: bun run test:e2e:generated-app-web

      - name: Run typecheck
        run: bun run typecheck

      - name: Generate docs
        run: bun run docs

      - name: Format generated docs
        run: bun run format

      - name: Check generated docs formatting
        run: bun run format:check

      - name: Prepare validated commit
        run: |
          rm -rf .adm5-overlay
          rm -f .github/workflows/refresh-adm5-lock.yml
          rm .github/workflows/finalize-adm5-studio.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: restore generated api authoring'

      - name: Check changeset
        env:
          CHANGESET_BASE_SHA: origin/main
          CHANGESET_HEAD_SHA: HEAD
        run: bash ./scripts/check-changeset-status.sh

      - name: Push validated Studio Phase 4
        run: git push origin HEAD:agent/adm-5-generated-api-authoring
