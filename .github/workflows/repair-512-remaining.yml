name: Repair Studio Infra 5 remaining consumers

on:
  push:
    branches:
      - fix/145-current-infra-consumer
    paths:
      - '.github/workflows/repair-512-remaining.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-current-infra-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Align repair script with current project auth import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/repair_512_remaining.py')
          source = path.read_text()
          path.write_text(source.replace(
              "import type { AppManifest } from '@ankhorage/contracts';",
              "import type { AppManifest, AuthOAuthProviderConfig } from '@ankhorage/contracts';",
          ))
          PY
      - run: python .github/scripts/repair_512_remaining.py
      - name: Refresh dependency lockfile
        run: bun install
      - run: bun run format
      - name: Validate repair
        shell: bash
        run: |
          set +e
          bun run build > repair-512-report-2.txt 2>&1
          build_status=$?
          bun run check-types >> repair-512-report-2.txt 2>&1
          type_status=$?
          bun run lint >> repair-512-report-2.txt 2>&1
          lint_status=$?
          bun run knip:check >> repair-512-report-2.txt 2>&1
          knip_status=$?
          bun run test >> repair-512-report-2.txt 2>&1
          test_status=$?
          bun run format:check >> repair-512-report-2.txt 2>&1
          format_status=$?
          echo "build=$build_status types=$type_status lint=$lint_status knip=$knip_status tests=$test_status format=$format_status" >> repair-512-report-2.txt
          exit 0
      - name: Commit repair and diagnostics
        shell: bash
        run: |
          rm .github/workflows/repair-512-remaining.yml
          rm .github/scripts/repair_512_remaining.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: complete Studio Infra 5 consumer validation'
          git push origin HEAD:fix/145-current-infra-consumer
