name: Branch 509 finalize

on:
  push:
    branches:
      - fix/509-pending-module-apm-evidence

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Update APM projection audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/apm-update-projection-audit.md')
          text = path.read_text()
          old_gap = """6. **Pending module removal is explicit but hidden from APM.** `.ankh/pending.json` correctly records
             deferred work today; the Studio owner extension must project that pending work into APM status/plan
             rather than letting `syncProject` consume it as an unrelated hidden side effect."""
          new_gap = """6. **Pending module removal is visible and fail-closed in APM.** Studio #509 inspects
             `.ankh/pending.json` read-only through the canonical project-update composition. Valid queued removals
             surface as stale projection evidence with deterministic module ids; malformed state is incomplete and
             unknown. Planning adds an explicit `protocol.studio-pending-module-lifecycle` blocker instead of
             consuming the queue through `syncProject`. Status/plan do not run Orchestrator lifecycle effects; a
             reviewed owner execution boundary is still required before APM can apply queued removals."""
          if old_gap not in text:
              raise SystemExit('pending lifecycle gap anchor not found')
          text = text.replace(old_gap, new_gap, 1)

          marker = '## Next implementation slice\n\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('next implementation slice marker not found')
          text = text[:start] + marker + """1. Add a reviewed owner execution boundary for pending module lifecycle effects so APM apply can
             materialize queued removals without duplicating Orchestrator uninstall, package-manager or ledger logic.
          2. Make runtime-relevant authoring actions maintain their required projections immediately or expose
             explicit pending/failed projection state.
          3. Expose the composed APM lifecycle through authorized Studio host routes without introducing a second
             update engine.
          4. Add the Dashboard status/plan/apply/verify flow on top of those host routes.
          5. After behavior parity and published-package acceptance, remove the obsolete `syncProject`
             compatibility alias and any superseded direct update path.
          """
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: git rm .github/workflows/branch-509-validate.yml
      - name: Format repository
        run: bun run format
      - name: Generate Paradox documentation
        run: bun run docs
      - name: Format generated documentation
        run: bun run format
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Knip
        run: bun run knip:check
      - name: Focused tests
        run: bun test src/features/project-updates/composition/createStudioProjectUpdatePorts.test.ts src/features/project-updates/application/ProjectUpdateService.test.ts
      - name: Changeset
        run: bun run changeset:status
      - name: Commit finalized slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: finalize pending module APM evidence"
          git push
