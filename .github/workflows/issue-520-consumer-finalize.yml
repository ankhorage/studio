name: Issue 520 consumer finalize

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify released owner is registry-visible
        run: test "$(npm view @ankhorage/expo-runtime@3.2.15 version --registry=https://registry.npmjs.org)" = '3.2.15'
      - name: Consume released Expo Runtime owner
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const updatePackage = (filePath, update) => {
            const packageJson = JSON.parse(fs.readFileSync(filePath, 'utf8'));
            update(packageJson);
            fs.writeFileSync(filePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          };
          updatePackage('package.json', (packageJson) => {
            packageJson.dependencies['@ankhorage/expo-runtime'] = '^3.2.15';
            packageJson.dependencies['expo-image-picker'] = '~57.0.18';
            packageJson.peerDependencies.expo = '57.0.23';
          });
          updatePackage('apps/studio/package.json', (packageJson) => {
            packageJson.dependencies['@ankhorage/expo-runtime'] = '^3.2.15';
            packageJson.dependencies.expo = '57.0.23';
          });
          NODE
      - name: Refresh consumer lockfiles
        run: |
          bun install
          bun install --cwd apps/studio --lockfile-only
      - name: Apply canonical formatting
        run: ./node_modules/.bin/ankhorage-prettier --write src/host/smoke/assertExpo57StudioStandaloneContractAsync.ts
      - name: Validate lint after consumer refresh
        run: bun run lint
      - name: Finalize branch artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-520-consumer-finalize.yml
          git add package.json bun.lock apps/studio/package.json apps/studio/bun.lock src/host/smoke/assertExpo57StudioStandaloneContractAsync.ts
          git commit -m 'fix: consume Expo 57.0.23 platform owner'
          git push origin HEAD:fix/520-acceptance-baseline
