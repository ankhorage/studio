name: Refresh APM lock

on:
  push:
    branches:
      - fix/575-consume-apm-0.8.9

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/575-consume-apm-0.8.9
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Refresh APM lock
        run: bun update @ankhorage/apm --lockfile-only --ignore-scripts

      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already resolves the requested APM range."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh APM lockfile"
          git push origin HEAD:fix/575-consume-apm-0.8.9
