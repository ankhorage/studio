name: Issue 520 diagnostics

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Inspect installed ZORA plugin metadata
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const packageName of ['@ankhorage/zora', '@ankhorage/zora-tabletop']) {
            const packagePath = `node_modules/${packageName}/package.json`;
            const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
            console.log(packageName, pkg.version);
          }
          console.log('--- tabletop registry ---');
          console.log(fs.readFileSync('node_modules/@ankhorage/zora-tabletop/src/registry.ts', 'utf8'));
          NODE
          echo '--- tabletop View references ---'
          grep -R "View" node_modules/@ankhorage/zora-tabletop/src -n || true
          echo '--- ZORA extension hosts ---'
          grep -R "extensionHost.*true\|extensionHost: true" node_modules/@ankhorage/zora/src -n || true
          echo '--- ZORA placement validation ---'
          grep -R "declared extension host\|invalid-placement\|placements" node_modules/@ankhorage/zora/src -n | head -80 || true
      - name: Inspect generated Auth formatting
        run: |
          mkdir -p .tmp-520
          bun -e "import { writeFile } from 'node:fs/promises'; import { getAuthScreenRuntimeTsx } from './src/host/layout/templates/auth/screen.ts'; const common={signInRoute:'sign-in',signUpRoute:'sign-up',postSignInRoute:'index',signInIdentifiers:['email'],signUpRequiredFields:['email','password'],signUpOptionalFields:[],signUpPolicy:'autoSignIn'}; await writeFile('.tmp-520/auth-screen.tsx', getAuthScreenRuntimeTsx({...common, oauthProviders:[{}]}));"
          cp .tmp-520/auth-screen.tsx .tmp-520/auth-screen.before.tsx
          bun x prettier --write .tmp-520/auth-screen.tsx
          diff -u .tmp-520/auth-screen.before.tsx .tmp-520/auth-screen.tsx || true
