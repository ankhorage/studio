name: Issue 520 diagnostics

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Inspect published Tabletop source and dist
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const root = 'node_modules/@ankhorage/zora-tabletop';
          const pkg = JSON.parse(fs.readFileSync(`${root}/package.json`, 'utf8'));
          console.log('@ankhorage/zora-tabletop', pkg.version, JSON.stringify(pkg.exports, null, 2));
          for (const file of ['src/registry.ts', 'src/plugin.ts', 'dist/registry.js', 'dist/plugin.js']) {
            console.log(`--- ${file} ---`);
            console.log(fs.existsSync(`${root}/${file}`) ? fs.readFileSync(`${root}/${file}`, 'utf8') : '<missing>');
          }
          NODE
          echo '--- placement View references in published package ---'
          grep -R "parents:.*View\|\"View\"\|'View'" node_modules/@ankhorage/zora-tabletop/dist node_modules/@ankhorage/zora-tabletop/src -n || true
          echo '--- ZORA extension-host metadata ---'
          grep -R "extensionHost" node_modules/@ankhorage/zora/src node_modules/@ankhorage/zora/dist -n | head -100 || true
      - name: Inspect generated Auth formatting
        run: |
          mkdir -p .tmp-520
          bun -e "import { writeFile } from 'node:fs/promises'; import { getAuthScreenRuntimeTsx } from './src/host/layout/templates/auth/screen.ts'; const common={signInRoute:'sign-in',signUpRoute:'sign-up',postSignInRoute:'index',signInIdentifiers:['email'],signUpRequiredFields:['email','password'],signUpOptionalFields:[],signUpPolicy:'autoSignIn'}; await writeFile('.tmp-520/auth-screen.tsx', getAuthScreenRuntimeTsx({...common, oauthProviders:[{}]}));"
          cp .tmp-520/auth-screen.tsx .tmp-520/auth-screen.before.tsx
          bun x prettier --write .tmp-520/auth-screen.tsx
          diff -u .tmp-520/auth-screen.before.tsx .tmp-520/auth-screen.tsx || true
