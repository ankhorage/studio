name: Branch 507 finalize

on:
  push:
    branches:
      - fix/507-apm-project-writer-locking

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/507-apm-project-writer-locking
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Normalize manager writer configuration and audit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          project_path = Path('src/host/orchestrator/projectManager.ts')
          project = project_path.read_text()
          project_old = """      firstArgumentProjectIdMethods: [
                  'deleteProject',
                  'installProjectPackages',
                  'connectProjectRepository',
                  'regenerateInfrastructure',
                ],
                objectArgumentProjectIdMethods: [
                  'persistProjectManifest',
                  'saveProjectManifest',
                  'syncProjectRuntime',
                  'rebuildRootLayout',
                  'syncProject',
                ],"""
          project_new = """      methods: [
                  'deleteProject',
                  'installProjectPackages',
                  'connectProjectRepository',
                  'regenerateInfrastructure',
                  'persistProjectManifest',
                  'saveProjectManifest',
                  'syncProjectRuntime',
                  'rebuildRootLayout',
                  'syncProject',
                ],"""
          if project_old not in project:
              raise SystemExit('ProjectManager writer configuration anchor not found')
          project_path.write_text(project.replace(project_old, project_new, 1))

          module_path = Path('src/host/orchestrator/moduleManager.ts')
          module = module_path.read_text()
          module_old = """      firstArgumentProjectIdMethods: [
                  'installModule',
                  'uninstallModule',
                  'updateModuleConfig',
                  'executeModuleAdminOperation',
                  'applyPendingOperations',
                  'persistProjectManifest',
                  'syncProjectRuntime',
                  'saveProjectManifest',
                  'rebuildRootLayout',
                ],
                objectArgumentProjectIdMethods: ['syncProject'],"""
          module_new = """      methods: [
                  'installModule',
                  'uninstallModule',
                  'updateModuleConfig',
                  'executeModuleAdminOperation',
                  'applyPendingOperations',
                  'persistProjectManifest',
                  'syncProjectRuntime',
                  'saveProjectManifest',
                  'rebuildRootLayout',
                  'syncProject',
                ],"""
          if module_old not in module:
              raise SystemExit('ModuleManager writer configuration anchor not found')
          module_path.write_text(module.replace(module_old, module_new, 1))

          audit_path = Path('docs/apm-update-projection-audit.md')
          audit = audit_path.read_text()
          gap_old = """5. **Studio/APM writers are not yet serialized together.** Autosave, module lifecycle and package
             reconciliation can mutate the project without the APM operation lock. Host integration must use
             the same released APM writer boundary before update apply is exposed."""
          gap_new = """5. **Studio/APM writers share the APM-owned project lock.** Studio #507 consumes the released
             `@ankhorage/apm@0.7.0` Node writer boundary for autosave/persistence, module lifecycle and direct
             project mutations. Nested Studio operations are re-entrant only within the owning async operation;
             independent Studio requests and APM apply operations contend on the same project-root lock."""
          if gap_old not in audit:
              raise SystemExit('Audit writer-gap anchor not found')
          audit = audit.replace(gap_old, gap_new, 1)

          next_marker = '## Next implementation slice\n\n'
          start = audit.find(next_marker)
          if start < 0:
              raise SystemExit('Audit next-slice marker not found')
          audit = audit[:start] + next_marker + """1. Project pending module lifecycle work into APM status/plan instead of consuming it as a hidden
             Studio sync side effect.
          2. Make runtime-relevant authoring actions maintain their required projections immediately or expose
             explicit pending/failed projection state.
          3. Expose the composed APM lifecycle through authorized Studio host routes without introducing a second
             update engine.
          4. Add the Dashboard status/plan/apply/verify flow on top of those host routes.
          5. After behavior parity and published-package acceptance, remove the obsolete `syncProject`
             compatibility alias and any superseded direct update path.
          """
          audit_path.write_text(audit)
          PY

      - name: Remove one-shot workflow
        run: git rm .github/workflows/branch-507-finalize.yml

      - name: Format repository
        run: bun run format

      - name: Generate Paradox documentation
        run: bun run docs

      - name: Format generated documentation
        run: bun run format

      - name: Typecheck
        run: bun run check-types

      - name: Lint
        run: bun run lint

      - name: Knip
        run: bun run knip:check

      - name: Verify writer coordination
        run: bun test src/features/project-updates/composition/runWithStudioProjectWriterLockAsync.test.ts

      - name: Verify changeset
        run: bun run changeset:status

      - name: Commit finalized slice
        run: |
          git add --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: finalize Studio writer coordination"
          git push origin HEAD:fix/507-apm-project-writer-locking
