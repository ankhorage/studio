name: ADM-13 Bootstrap

on:
  push:
    branches:
      - adm13/theme-administration
    paths:
      - scripts/adm13-bootstrap.mjs
      - .github/workflows/adm13-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply ADM-13 core migration
        run: bun scripts/adm13-bootstrap.mjs

      - name: Refresh dependencies and lockfile
        run: bun install

      - name: Format changed sources
        run: bun run format

      - name: Validate core migration
        run: |
          bun run build
          bun test src/ui/admin/pages/adminThemeModel.test.ts src/manifestState.test.ts src/host/layout/templates/rootLayout.test.ts
          bun run typecheck

      - name: Remove bootstrap files
        run: rm scripts/adm13-bootstrap.mjs .github/workflows/adm13-bootstrap.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Start ADM-13 canonical theme administration"
          git push origin HEAD:adm13/theme-administration
