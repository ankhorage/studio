name: Wire ADM 6

on:
  push:
    branches:
      - agent/adm-6-binding-authoring

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply wiring
        run: python .github/scripts/wire_adm6.py
      - name: Commit wiring
        run: |
          git config user.name "Fabio Gartenmann"
          git config user.email "137318798+artiphishle@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire contextual binding authoring"
          git push origin HEAD:agent/adm-6-binding-authoring
