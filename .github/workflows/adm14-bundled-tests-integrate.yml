name: ADM-14 Bundled Tests Integrate

on:
  push:
    branches:
      - agent/adm14-bundled-assets-authoring

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bundled runtime regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/host/layout/templates/rootLayout.test.ts')
          s = p.read_text()
          old = "import { getRootLayoutTsx } from './rootLayout';"
          new = "import { getRootLayoutImportRequirements, getRootLayoutTsx } from './rootLayout';"
          if old not in s: raise SystemExit('root test import anchor missing')
          s = s.replace(old, new, 1)
          s += """

test('wires bundled media through generated runtime and Studio preview', () => {
  for (const includeStudio of [false, true]) {
    const imports = getRootLayoutImportRequirements(includeStudio);
    expect(imports).toContainEqual({
      source: '@ankhorage/expo-runtime',
      namedImports: [{ imported: 'createExpoBundledMediaResolver' }],
    });
    expect(imports).toContainEqual({
      source: '@/generated/bundledMediaRegistry',
      namedImports: [{ imported: 'bundledMediaRegistry' }],
    });
  }

  const generated = getRootLayoutTsx({
    manifest: { navigator: { initialRouteName: 'index' } } as unknown as AppManifest,
    mutations: [],
    allImports: '',
    allHooks: '',
    innerNavigation: {
      declarations: '',
      jsx: '<></>',
      usesTheme: false,
      usesIcon: false,
      usesZoraTabBar: false,
      usesZoraDrawerContent: false,
      usesZoraNavigationRouteMap: false,
    },
    includeStudio: true,
  });

  expect(generated).toContain(
    'const bundledMediaResolver = createExpoBundledMediaResolver(bundledMediaRegistry);',
  );
  expect(generated).toContain('mediaAssets: runtimeManifest.media?.assets');
  expect(generated).toContain('resolveMediaAsset: bundledMediaResolver');
  expect(generated).toContain('bundledMediaRegistry={bundledMediaRegistry}');
});
"""
          p.write_text(s)

          p = Path('src/host/orchestrator/templates.test.ts')
          s = p.read_text()
          old = "    expect(dependencies['@ankhorage/data-sources']).toBe('^1.0.1');\n    expect(dependencies['@ankhorage/runtime']).toBe('^1.0.0');"
          new = "    expect(dependencies['@ankhorage/data-sources']).toBe('^1.0.1');\n    expect(dependencies['@ankhorage/expo-runtime']).toBe('^2.2.0');\n    expect(dependencies['@ankhorage/runtime']).toBe('^1.0.0');"
          if old not in s: raise SystemExit('template dependency test anchor missing')
          s = s.replace(old, new, 1)
          old = "    expect(plain.dependencies['@ankhorage/supabase-db']).toBeUndefined();"
          new = "    expect(plain.dependencies['@ankhorage/supabase-db']).toBeUndefined();\n    expect(plain.dependencies['@ankhorage/expo-runtime']).toBe('^2.2.0');"
          if old not in s: raise SystemExit('plain app test anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check -- src/host/layout/templates/rootLayout.test.ts src/host/orchestrator/templates.test.ts
      - name: Commit regression tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/host/layout/templates/rootLayout.test.ts src/host/orchestrator/templates.test.ts
          git commit -m 'Test bundled media generated runtime wiring'
          git push origin HEAD:agent/adm14-bundled-assets-authoring
