name: Branch 511 finalize

on:
  push:
    branches:
      - feat/511-reviewed-pending-module-owner-step

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build before lint tooling
        run: bun run build
      - name: Remove one-shot workflow
        run: rm .github/workflows/branch-511-finalize.yml
      - name: Format source
        run: bun run format
      - name: Autofix lint-safe source
        run: bun run lint:fix
      - name: Generate Paradox documentation
        run: bun run docs
      - name: Format generated documentation
        run: bun run format
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Knip
        run: bun run knip:check
      - name: Project update tests
        run: bun test src/features/project-updates
      - name: Changeset status
        run: bun run changeset:status
      - name: Commit finalized slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: finalize reviewed pending module lifecycle"
          git push
