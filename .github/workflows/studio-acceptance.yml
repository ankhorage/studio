name: Studio acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  acceptance-scope:
    runs-on: ubuntu-latest

    outputs:
      required: ${{ steps.scope.outputs.required }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine acceptance scope
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            base_sha='${{ github.event.pull_request.base.sha }}'
            head_sha='${{ github.event.pull_request.head.sha }}'
            bash scripts/determine-studio-acceptance-scope.sh "$base_sha" "$head_sha"
          else
            {
              echo 'required=true'
              echo 'reason=Push or manual dispatch requires the complete acceptance suite.'
            } >> "$GITHUB_OUTPUT"
          fi

          {
            echo '## Studio acceptance scope'
            echo
            echo "- Complete suite required: \`${{ steps.scope.outputs.required }}\`"
            echo "- Reason: ${{ steps.scope.outputs.reason }}"
            echo '- Required scenarios when selected: Expo web, SharkPrey, standalone Studio, generated app, generated navigation, and generated capabilities.'
          } >> "$GITHUB_STEP_SUMMARY"

  expo-web:
    needs: acceptance-scope
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      needs.acceptance-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'apps/studio/bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Studio Expo app
        run: bun run typecheck:studio

      - name: Validate packed Studio host artifact
        run: bun run test:acceptance:packed-studio-host

      - name: Validate generated Close social template Web
        run: bun run test:acceptance:expo57-social-template-web

      - name: Validate generated Studio admin Web
        run: bun run test:e2e:generated-app-web

  sharkprey:
    needs: acceptance-scope
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      needs.acceptance-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate packed Studio candidate with generated SharkPrey
        run: bun run test:acceptance:expo57-sharkprey

  studio-standalone:
    needs: acceptance-scope
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      needs.acceptance-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate standalone Studio packed PR candidate
        run: bun run test:acceptance:expo57-studio-standalone

  generated-app:
    needs: acceptance-scope
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      needs.acceptance-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated Expo 57 app
        run: bun run test:acceptance:expo57-generated-app

  generated-navigation:
    needs: acceptance-scope
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      needs.acceptance-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated Expo 57 navigation
        run: bun run test:acceptance:expo57-generated-navigation

  generated-capabilities:
    needs: acceptance-scope
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      needs.acceptance-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate focused generated capability contracts
        run: >-
          bun test
          test/smoke/createExpo57CapabilityFixtureManifest.test.ts
          src/projectDeployAssetPicker.test.ts

      - name: Validate generated Expo 57 capabilities
        run: bun run test:acceptance:expo57-generated-capabilities
