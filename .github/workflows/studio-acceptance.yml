name: Studio acceptance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  expo-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck Studio Expo app
        run: bun run type-check:studio

      - name: Run Studio web smoke test
        run: bun run test:smoke:studio-web

  studio-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate packed Studio host artifact
        run: bun run test:acceptance:packed-studio-host

      - name: Validate standalone Studio registry consumer
        run: bun run test:acceptance:expo57-studio-standalone

  generated-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated Expo 57 app
        run: bun run test:acceptance:expo57-generated-app

  generated-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated Expo 57 navigation
        run: bun run test:acceptance:expo57-generated-navigation

  generated-capabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate focused generated capability contracts
        run: >-
          bun test
          src/host/generatedAuthAdapterRuntime.smoke.test.ts
          src/host/generatedOAuthLifecycle.e2e.test.ts
          src/host/generatedNativeOAuthLifecycle.e2e.test.ts
          src/host/oauthFixtureConsumer.smoke.test.ts
          src/host/smoke/createExpo57CapabilityFixtureManifest.test.ts
          src/projectDeployAssetPicker.test.ts

      - name: Validate generated Expo 57 capabilities
        run: bun run test:acceptance:expo57-generated-capabilities
