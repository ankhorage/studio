name: Studio acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  acceptance-impact:
    runs-on: ubuntu-latest

    outputs:
      impact: ${{ steps.plan.outputs.impact }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Plan acceptance impact
        id: plan
        env:
          ANKH_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun .github/scripts/run-ci-impact.ts plan

      - name: Summarize acceptance impact policy
        run: |
          {
            echo '## Studio acceptance impact'
            echo
            echo '- Existing scenarios: Expo web, SharkPrey, standalone Studio, generated app, generated navigation, and generated capabilities.'
            echo '- The published Devtools plan records a decision for each scenario; unavailable, unsafe, ambiguous, or unmapped changes fall back to every scenario.'
          } >> "$GITHUB_STEP_SUMMARY"

  expo-web:
    needs: acceptance-impact
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      fromJSON(needs.acceptance-impact.outputs.impact).jobs['ci:acceptance:expo-web'].state != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'apps/studio/bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Expo Web acceptance
        run: bun run ci:acceptance:expo-web

  sharkprey:
    needs: acceptance-impact
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      fromJSON(needs.acceptance-impact.outputs.impact).jobs['ci:acceptance:sharkprey'].state != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate packed Studio candidate with generated SharkPrey
        run: bun run ci:acceptance:sharkprey

  studio-standalone:
    needs: acceptance-impact
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      fromJSON(needs.acceptance-impact.outputs.impact).jobs['ci:acceptance:studio-standalone'].state != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate standalone Studio packed PR candidate
        run: bun run ci:acceptance:studio-standalone

  generated-app:
    needs: acceptance-impact
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      fromJSON(needs.acceptance-impact.outputs.impact).jobs['ci:acceptance:generated-app'].state != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated Expo 57 app
        run: bun run ci:acceptance:generated-app

  generated-navigation:
    needs: acceptance-impact
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      fromJSON(needs.acceptance-impact.outputs.impact).jobs['ci:acceptance:generated-navigation'].state != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated Expo 57 navigation
        run: bun run ci:acceptance:generated-navigation

  generated-capabilities:
    needs: acceptance-impact
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.head_ref != 'changeset-release/main') &&
      (github.event_name != 'pull_request' ||
       !contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) ||
       !startsWith(github.head_ref, 'renovate/patch-') ||
       !contains(github.event.pull_request.labels.*.name, 'renovate:patch')) &&
      fromJSON(needs.acceptance-impact.outputs.impact).jobs['ci:acceptance:generated-capabilities'].state != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Cache Bun downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated Expo 57 capabilities
        run: bun run ci:acceptance:generated-capabilities

  acceptance:
    needs:
      - acceptance-impact
      - expo-web
      - sharkprey
      - studio-standalone
      - generated-app
      - generated-navigation
      - generated-capabilities
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Validate planned acceptance results
        env:
          IMPACT: ${{ needs.acceptance-impact.outputs.impact }}
          EXPO_WEB_RESULT: ${{ needs.expo-web.result }}
          SHARKPREY_RESULT: ${{ needs.sharkprey.result }}
          STUDIO_STANDALONE_RESULT: ${{ needs.studio-standalone.result }}
          GENERATED_APP_RESULT: ${{ needs.generated-app.result }}
          GENERATED_NAVIGATION_RESULT: ${{ needs.generated-navigation.result }}
          GENERATED_CAPABILITIES_RESULT: ${{ needs.generated-capabilities.result }}
          RENOVATE_PATCH_EXEMPT: ${{ github.event_name == 'pull_request' && contains(fromJSON('["renovate[bot]","ankhorage-renovate-sync[bot]"]'), github.event.pull_request.user.login) && startsWith(github.head_ref, 'renovate/patch-') && contains(github.event.pull_request.labels.*.name, 'renovate:patch') }}
        run: |
          node -e '
            const impact = JSON.parse(process.env.IMPACT ?? "");
            if (impact.version !== 1 || typeof impact.jobs !== "object" || impact.jobs === null) {
              throw new Error("Expected the published CI-impact version 1 job decisions.");
            }
            const results = {
              "ci:acceptance:expo-web": process.env.EXPO_WEB_RESULT,
              "ci:acceptance:sharkprey": process.env.SHARKPREY_RESULT,
              "ci:acceptance:studio-standalone": process.env.STUDIO_STANDALONE_RESULT,
              "ci:acceptance:generated-app": process.env.GENERATED_APP_RESULT,
              "ci:acceptance:generated-navigation": process.env.GENERATED_NAVIGATION_RESULT,
              "ci:acceptance:generated-capabilities": process.env.GENERATED_CAPABILITIES_RESULT,
            };
            const exempt = process.env.RENOVATE_PATCH_EXEMPT === "true";
            for (const [script, result] of Object.entries(results)) {
              const decision = impact.jobs[script];
              if (decision === undefined || !["selected", "skipped", "full"].includes(decision.state)) {
                throw new Error(`Missing valid decision for ${script}.`);
              }
              const expected = decision.state === "skipped" ? "skipped" : "success";
              if (result !== expected && !(exempt && result === "skipped")) {
                throw new Error(`${script} was planned as ${decision.state} but finished ${result}.`);
              }
            }
            if (exempt) console.log("Existing Renovate patch policy exempted acceptance execution; no acceptance result is claimed.");
          '
