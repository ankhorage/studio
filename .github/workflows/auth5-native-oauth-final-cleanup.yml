name: Auth5 native OAuth final cleanup

on:
  push:
    branches:
      - agent/auth5-native-oauth-runtime-preflight

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth5-native-oauth-runtime-preflight
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Clean generated drift
        run: |
          git checkout origin/main -- \
            README.md \
            paradox/badges/npm.svg \
            paradox/diagrams/architecture-overview.mmd \
            paradox/diagrams/export-graph.mmd \
            paradox/diagrams/module-relationships.mmd \
            paradox/exports.json \
            paradox/exports.md \
            paradox/index.html \
            paradox/paradox.json \
            package.json
          python3 - <<'PY'
          from pathlib import Path
          path = Path('package.json')
          text = path.read_text()
          old = '"@ankhorage/expo-runtime": "^2.4.0"'
          new = '"@ankhorage/expo-runtime": "^2.5.0"'
          if old not in text:
              raise SystemExit('Expected Expo Runtime 2.4 baseline was not found.')
          path.write_text(text.replace(old, new))
          PY
          bun install --frozen-lockfile

      - name: Validate exact final diff
        run: |
          bun run build
          bunx @ankhorage/ankh doctor validate .
          bun run lint
          bun run format:check
          bun run knip
          bun run test
          bun run test:smoke:studio-web
          bun run test:e2e:generated-app-web
          bun run typecheck
          bun run changeset:status
          git diff --check

      - name: Commit clean final diff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/auth5-native-oauth-final-cleanup.yml
          git add -A
          git commit -m 'Clean Auth 5 native OAuth consumer diff'
          git push origin HEAD:agent/auth5-native-oauth-runtime-preflight
