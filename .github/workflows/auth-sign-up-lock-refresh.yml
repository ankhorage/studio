name: Auth Sign-up Lock Refresh

on:
  push:
    branches:
      - feat/583-auth-sign-up-authoring

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Refresh dependency lock
        run: bun install
      - name: Commit lockfile
        run: |
          git config user.name "ankhorage-lock[bot]"
          git config user.email "ankhorage-lock[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update Contracts lockfile"
          git push
