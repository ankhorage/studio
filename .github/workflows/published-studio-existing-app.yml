name: Published Studio existing app

on:
  pull_request:
    paths:
      - '.github/workflows/published-studio-existing-app.yml'
      - 'scripts/published-studio-existing-app-acceptance.ts'
      - 'scripts/published-studio-restart-boundary-acceptance.ts'
      - 'src/features/project-updates/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate published Studio existing-app lifecycle and CLI parity
        run: bun scripts/published-studio-existing-app-acceptance.ts

      - name: Pack PR Studio artifact
        run: |
          bun run build
          mkdir -p "$RUNNER_TEMP/studio-pack"
          bun pm pack --destination "$RUNNER_TEMP/studio-pack" --quiet
          tarball="$(find "$RUNNER_TEMP/studio-pack" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          printf 'ANKH_STUDIO_PACKAGE_TARBALL=%s\n' "$tarball" >> "$GITHUB_ENV"

      - name: Validate packed PR generated-owner upgrade
        run: bun scripts/published-studio-existing-app-acceptance.ts --packed-owner-upgrade

      - name: Validate published Studio host restart boundary
        run: bun scripts/published-studio-restart-boundary-acceptance.ts
