name: Issue 520 Metro final newline fix

on:
  push:
    branches:
      - fix/520-acceptance-baseline

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Make generated Metro final newline canonical
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path('src/host/orchestrator/templateSources.ts')
          text = template.read_text()
          old = "module.exports = config;\n\n`;\n}\n\nexport function getMetroEmptyModuleJs"
          new = "module.exports = config;\n`;\n}\n\nexport function getMetroEmptyModuleJs"
          if old not in text:
              raise SystemExit('generated Metro trailing-newline target not found')
          template.write_text(text.replace(old, new, 1))

          test = Path('src/host/orchestrator/templates.test.ts')
          text = test.read_text()
          anchor = "    expect(getMetroEmptyModuleJs()).toBe('module.exports = {};\\n');\n"
          assertion = "    expect(metro.endsWith('module.exports = config;\\n')).toBe(true);\n"
          if anchor not in text:
              raise SystemExit('Metro test anchor not found')
          if assertion not in text:
              text = text.replace(anchor, anchor + assertion, 1)
          test.write_text(text)
          PY
      - name: Validate focused source fix
        run: |
          bun run format
          bun run build
          bun test src/host/orchestrator/templates.test.ts
          bun run check-types
          bun run lint
          bun run format:check
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/host/orchestrator/templateSources.ts src/host/orchestrator/templates.test.ts
          git commit -m 'fix: stabilize generated Metro final newline'
      - name: Remove temporary workflow and push
        run: |
          git rm .github/workflows/issue-520-metro-final-newline.yml
          git commit -m 'chore: finalize generated Metro newline fix'
          git push origin HEAD:fix/520-acceptance-baseline
