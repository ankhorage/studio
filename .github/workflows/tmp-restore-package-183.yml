name: Restore issue 183 package contract

on:
  push:
    branches:
      - 183-standalone-template-consumer

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 183-standalone-template-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Restore package contract from current main
        run: |
          git fetch origin main
          git show origin/main:package.json > package.json
          node <<'NODE'
          const fs = require('node:fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.dependencies['@ankhorage/contracts'] = '^8.2.0';
          packageJson.dependencies['@ankhorage/templates'] = '^9.1.3';
          fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          bun install
      - name: Commit package and lockfile
        run: |
          rm .github/workflows/tmp-restore-package-183.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock .github/workflows/tmp-restore-package-183.yml
          git commit -m 'chore: restore current Studio package contract'
          git push origin HEAD:183-standalone-template-consumer
