      - name: Refresh released dependency lockfile
        run: bun install

      - name: Apply lint fixes
        run: bun run lint:fix

      - name: Format sources
        run: bun run format

      - name: Run build
        run: bun run build

      - name: Validate repository
        run: bunx @ankhorage/ankh doctor validate .

      - name: Run lint
        run: bun run lint

      - name: Run format check
        run: bun run format:check

      - name: Run Knip
        run: bun run knip

      - name: Run tests
        run: bun run test

      - name: Run Studio web smoke test
        run: bun run test:smoke:studio-web

      - name: Run generated app web E2E
        run: bun run test:e2e:generated-app-web

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Run infra E2E
        run: bun run test:e2e:infra

      - name: Run typecheck
        run: bun run typecheck

      - name: Generate docs
        run: bun run docs

      - name: Format generated docs
        run: bun run format

      - name: Check generated docs formatting
        run: bun run format:check

      - name: Check changeset
        env:
          CHANGESET_BASE_SHA: origin/main
          CHANGESET_HEAD_SHA: HEAD
        run: bash ./scripts/check-changeset-status.sh

      - name: Commit validated ADM 5 runtime wiring
        run: |
          rm .github/workflows/finalize-adm5-runtime-db.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: wire generated database runtime adapters'
          git push origin HEAD:agent/adm-5-generated-api-authoring
