name: Finalize ADM 5 Generated Database Runtime

on:
  push:
    branches:
      - agent/adm-5-generated-api-authoring

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Wire generated database runtime
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const replaceExactly = (path, before, after) => {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) {
              throw new Error(`Expected source fragment was not found in ${path}: ${before.slice(0, 120)}`);
            }
            fs.writeFileSync(path, source.replace(before, after));
          };

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.devDependencies['@ankhorage/supabase-db'] = '^1.0.0';
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          fs.writeFileSync(
            'src/host/generatedDatabaseRuntime.ts',
            `import type { AppManifest } from '@ankhorage/contracts';

export type GeneratedDatabaseRuntimeManifest = Pick<AppManifest, 'generatedApis' | 'infra'>;
export type GeneratedDatabaseRuntimeProvider = 'supabase';

export interface GeneratedDatabaseRuntimeSelection {
  readonly provider: GeneratedDatabaseRuntimeProvider;
  readonly adapterIds: readonly string[];
}

export function resolveGeneratedDatabaseRuntime(
  manifest: GeneratedDatabaseRuntimeManifest,
): GeneratedDatabaseRuntimeSelection | null {
  const adapterIds = [
    ...new Set(
      Object.values(manifest.generatedApis ?? {})
        .map((definition) => definition.database.id.trim())
        .filter(Boolean),
    ),
  ].sort();

  if (adapterIds.length === 0 || manifest.infra.database?.provider !== 'supabase') {
    return null;
  }

  return { provider: 'supabase', adapterIds };
}
`,
          );

          fs.writeFileSync(
            'src/host/generatedDatabaseRuntime.test.ts',
            `import type { GeneratedApiDefinition } from '@ankhorage/contracts';
import { expect, test } from 'bun:test';

import {
  type GeneratedDatabaseRuntimeManifest,
  resolveGeneratedDatabaseRuntime,
} from './generatedDatabaseRuntime';

const generatedApi = (id, adapterId) => ({
  id,
  protocol: 'rest',
  basePath: '/api',
  database: { id: adapterId, kind: 'database' },
  resources: [],
});

test('selects unique generated adapter ids for the provisioned Supabase database', () => {
  const manifest = {
    infra: { database: { provider: 'supabase', tier: 'dev' }, plugins: [] },
    generatedApis: {
      alpha: generatedApi('alpha', 'primary-db'),
      beta: generatedApi('beta', 'analytics-db'),
      gamma: generatedApi('gamma', 'primary-db'),
    },
  } satisfies GeneratedDatabaseRuntimeManifest;

  expect(resolveGeneratedDatabaseRuntime(manifest)).toEqual({
    provider: 'supabase',
    adapterIds: ['analytics-db', 'primary-db'],
  });
});

test('does not claim a runtime adapter for unsupported database providers', () => {
  const definition: GeneratedApiDefinition = generatedApi('alpha', 'primary-db');
  const manifest = {
    infra: { database: { provider: 'postgres-other', tier: 'dev' }, plugins: [] },
    generatedApis: { alpha: definition },
  } satisfies GeneratedDatabaseRuntimeManifest;

  expect(resolveGeneratedDatabaseRuntime(manifest)).toBeNull();
});
`,
          );

          fs.writeFileSync(
            'src/host/layout/generatedDatabaseRuntimeSource.ts',
            `import type { GeneratedDatabaseRuntimeSelection } from '../generatedDatabaseRuntime';
import { escapeStringLiteral } from './utils/escapeStringLiteral';

export const GENERATED_DATABASE_ADAPTERS_EXPRESSION = 'GENERATED_DATABASE_ADAPTERS';

export function getGeneratedDatabaseRuntimeImports(
  selection: GeneratedDatabaseRuntimeSelection | null,
): readonly string[] {
  return selection?.provider === 'supabase'
    ? [\"import { createSupabaseDbAdapter } from '@ankhorage/supabase-db';\"]
    : [];
}

export function getGeneratedDatabaseRuntimeModuleDeclarations(
  selection: GeneratedDatabaseRuntimeSelection | null,
): string {
  if (selection?.provider !== 'supabase') return '';

  const adapterEntries = selection.adapterIds
    .map((id) => \`      '\${escapeStringLiteral(id)}': generatedSupabaseDbAdapter,\`)
    .join('\\n');

  return \`const generatedSupabaseUrl = process.env.EXPO_PUBLIC_SUPABASE_URL?.trim() ?? '';
const generatedSupabaseAnonKey = process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY?.trim() ?? '';
const generatedSupabaseDbAdapter =
  generatedSupabaseUrl.length > 0 && generatedSupabaseAnonKey.length > 0
    ? createSupabaseDbAdapter({ url: generatedSupabaseUrl, anonKey: generatedSupabaseAnonKey })
    : null;
const GENERATED_DATABASE_ADAPTERS =
  generatedSupabaseDbAdapter === null
    ? {}
    : {
\${adapterEntries}
      };\`;
}
`,
          );

          fs.writeFileSync(
            'src/host/layout/generatedDatabaseRuntimeGeneration.test.ts',
            `import { expect, test } from 'bun:test';

import { getProjectTemplate } from '../templateRegistry';
import { GeneratedAppFileGenerator } from './layoutGenerator';

test('generated apps register canonical generated API database adapter ids', () => {
  const manifest = getProjectTemplate({
    category: 'food_drink',
    templateId: 'nutrition-catalog-scan',
  });
  const files = new GeneratedAppFileGenerator().generateFiles('', manifest, [], {
    includeStudio: false,
  });
  const rootLayout = files.find((file) => file.path === 'src/app/_layout.tsx');
  if (!rootLayout) throw new Error('Expected generated root layout.');

  expect(rootLayout.content).toContain(
    \"import { createSupabaseDbAdapter } from '@ankhorage/supabase-db';\",
  );
  expect(rootLayout.content).toContain("'primary-db': generatedSupabaseDbAdapter");
  expect(rootLayout.content).toContain('databaseAdapters: GENERATED_DATABASE_ADAPTERS');
  expect(rootLayout.content).not.toContain('serviceRole');
});
`,
          );

          fs.writeFileSync(
            'src/host/generatedDatabaseRuntime.integration.test.ts',
            `import type { GeneratedApiDefinition } from '@ankhorage/contracts';
import { createGeneratedApiDataSource } from '@ankhorage/data-sources';
import { createRuntimeDataSourceOperationExecutor } from '@ankhorage/runtime';
import { createSupabaseDbAdapter } from '@ankhorage/supabase-db';
import { expect, test } from 'bun:test';

import {
  type GeneratedDatabaseRuntimeManifest,
  resolveGeneratedDatabaseRuntime,
} from './generatedDatabaseRuntime';

test('executes canonical generated create through the released Supabase DB adapter', async () => {
  const definition: GeneratedApiDefinition = {
    id: 'items-api',
    protocol: 'rest',
    basePath: '/api',
    database: { id: 'primary-db', kind: 'database' },
    resources: [
      {
        id: 'items',
        path: '/items',
        collection: {
          name: 'items',
          schema: 'public',
          primaryKey: 'id',
          fields: [
            { name: 'id', type: 'uuid', required: true, unique: true },
            { name: 'name', type: 'text', required: true },
          ],
        },
        operations: ['create'],
      },
    ],
  };
  const manifest = {
    infra: { database: { provider: 'supabase', tier: 'dev' }, plugins: [] },
    generatedApis: { [definition.id]: definition },
  } satisfies GeneratedDatabaseRuntimeManifest;
  const runtimeSelection = resolveGeneratedDatabaseRuntime(manifest);
  expect(runtimeSelection?.adapterIds).toEqual(['primary-db']);

  const normalized = createGeneratedApiDataSource(definition);
  if (!normalized.ok) throw new Error('Expected generated API fixture to normalize.');
  const endpoint = normalized.data.endpoints.items;
  if (!endpoint) throw new Error('Expected generated items endpoint.');

  const calls = [];
  const mockedFetch = (input, init) => {
    calls.push({ url: String(input), method: init?.method });
    return Promise.resolve(
      new Response(JSON.stringify([{ id: 'item-1', name: 'Created' }]), {
        status: 201,
        headers: { 'content-type': 'application/json' },
      }),
    );
  };
  const adapter = createSupabaseDbAdapter({
    url: 'https://supabase.example.test',
    anonKey: 'anon-key',
    fetch: mockedFetch,
  });
  const executor = createRuntimeDataSourceOperationExecutor({
    databaseAdapters: { 'primary-db': adapter },
  });

  const result = await executor({
    dataSource: normalized.data,
    endpoint,
    input: { name: 'Created' },
    operation: {
      dataSourceId: definition.id,
      endpointId: 'items',
      operationId: 'items.create',
    },
  });

  expect(result).toEqual({
    ok: true,
    data: { id: 'item-1', name: 'Created' },
    diagnostics: [],
  });
  expect(calls).toHaveLength(1);
  expect(calls[0]?.url).toContain('https://supabase.example.test/rest/v1/items');
  expect(calls[0]?.method).toBe('POST');
});
`,
          );

