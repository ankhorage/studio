name: Repair lockfile

on:
  push:
    branches:
      - chore/repair-release-lockfile
    paths:
      - .github/workflows/repair-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/repair-release-lockfile
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Regenerate bun.lock
        run: bun install
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock already clean"
            exit 0
          fi
          git commit -m "chore: repair release lockfile"
          git push origin HEAD:chore/repair-release-lockfile
