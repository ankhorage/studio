name: ADM-14 Bundled Context Integrate

on:
  push:
    branches:
      - agent/adm14-bundled-assets-authoring

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Studio context contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          old = "import type { StudioMediaIngestResult, StudioMediaPickerSource } from './mediaPickerAuthoring';"
          new = "import type {\n  StudioMediaIngestResult,\n  StudioMediaIngestTarget,\n  StudioMediaPickerSource,\n} from './mediaPickerAuthoring';"
          if old not in s: raise SystemExit('media import anchor missing')
          s = s.replace(old, new, 1)
          old = '  ingestMediaFromPicker: (source: StudioMediaPickerSource) => Promise<StudioMediaIngestResult>;'
          new = '  ingestMediaFromPicker: (\n    source: StudioMediaPickerSource,\n    target?: StudioMediaIngestTarget,\n  ) => Promise<StudioMediaIngestResult>;'
          if old not in s: raise SystemExit('context function anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check -- src/index.ts
      - name: Commit context contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts
          git commit -m 'Expose bundled media ingest target'
          git push origin HEAD:agent/adm14-bundled-assets-authoring
