name: ADM12 flatten AppBar actions

on:
  push:
    branches:
      - issue-127/canonical-theme-mode

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-127/canonical-theme-mode
      - name: Apply flat AppBar migration
        run: python .github/adm12_flatten.py
      - name: Remove temporary migration files
        run: rm .github/adm12_flatten.py .github/workflows/adm12-flatten-appbar-actions.yml
      - name: Commit focused fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github src/host/layout/templates/rootLayout.ts src/host/layout/templates/rootLayout.test.ts
          git commit -m "Keep generated AppBar actions flat"
          git push origin HEAD:issue-127/canonical-theme-mode
