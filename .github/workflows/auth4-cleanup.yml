name: Auth 4 branch cleanup

on:
  push:
    branches:
      - agent/auth4-canonical-target-generation
    paths:
      - .github/workflows/auth4-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auth4-canonical-target-generation
          fetch-depth: 0

      - name: Remove temporary implementation artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/auth4-patch-templates.py .github/workflows/auth4-cleanup.yml
          git commit -m "Remove temporary Auth 4 implementation artifacts"
          git push origin HEAD:agent/auth4-canonical-target-generation
