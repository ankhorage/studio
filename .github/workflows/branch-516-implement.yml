              "/*** Fetch durable runtime projection currency and degrade read failures to explicit unknown evidence. */\nasync function requestRuntimeProjectionStateOrUnknownAsync(\n  projectId: string,\n): Promise<StudioRuntimeProjectionState> {\n  try {\n    const response = await fetch(\n      `${API_BASE}/projects/${encodeURIComponent(projectId)}/projection/runtime`,\n    );\n    const value = await readPersistenceJson(response);\n    if (!response.ok || !isStudioRuntimeProjectionState(value)) {\n      return UNKNOWN_RUNTIME_PROJECTION_STATE;\n    }\n    return value;\n  } catch {\n    return UNKNOWN_RUNTIME_PROJECTION_STATE;\n  }\n}\n\n/*** Validate the bounded public runtime projection state returned by the Studio host. */\nfunction isStudioRuntimeProjectionState(value: unknown): value is StudioRuntimeProjectionState {\n  if (!isRecord(value)) return false;\n  const status = readOwnProperty(value, 'status');\n  const desiredSignature = readOwnProperty(value, 'desiredSignature');\n  const appliedSignature = readOwnProperty(value, 'appliedSignature');\n  const failure = readOwnProperty(value, 'failure');\n  return (\n    (status === 'current' ||\n      status === 'pending' ||\n      status === 'failed' ||\n      status === 'unknown') &&\n    (desiredSignature === null || typeof desiredSignature === 'string') &&\n    (appliedSignature === null || typeof appliedSignature === 'string') &&\n    (failure === undefined || isStudioRuntimeProjectionFailureEvidence(failure))\n  );\n}\n\n/*** Validate non-sensitive runtime projection failure evidence returned by the Studio host. */\nfunction isStudioRuntimeProjectionFailureEvidence(value: unknown): boolean {\n  return (\n    isRecord(value) &&\n    readOwnProperty(value, 'code') === 'runtime-projection-failed' &&\n    typeof readOwnProperty(value, 'at') === 'string'\n  );\n}\n\n/***\n * Parse a persistence response body as JSON and convert invalid bodies into an explicit request error.\n",
