import { tmpdir } from 'node:os';
import path from 'node:path';

import type { AppManifest } from '@ankhorage/contracts';
import { composeCategoryAppManifest } from '@ankhorage/templates';
import { expect, test } from 'bun:test';

import { ProjectGenerationStateStore } from './ProjectGenerationStateStore';

const store = new ProjectGenerationStateStore();

async function captureError(operation: () => Promise<unknown>): Promise<Error | null> {
  try {
    await operation();
    return null;
  } catch (error) {
    return error instanceof Error ? error : new Error(String(error));
  }
}

/*** Build one canonical manifest for generation-state tests. */
function createManifest(modules: readonly string[] = []): AppManifest {
  const { manifest } = composeCategoryAppManifest({
    category: 'developer_tools',
    name: 'Projection Currency Fixture',
    slug: 'projection-currency-fixture',
  });
  return {
    ...manifest,
    infra: {
      ...manifest.infra,
      modules: [...modules],
    },
  };
}

test('persists explicit Studio inclusion without inventing runtime projection evidence', async () => {
  const projectPath = await mkdtemp(path.join(tmpdir(), 'ankhorage-studio-generation-state-'));

  await store.writeStudioInclusionAsync(projectPath, true);

  expect(await store.readStudioInclusionAsync(projectPath)).toBe(true);
  expect(
    JSON.parse(await readFile(path.join(projectPath, '.ankh/generation-state.json'), 'utf8')),
  ).toEqual({ includeStudio: true });
  expect(await store.inspectRuntimeProjectionAsync(projectPath, createManifest())).toMatchObject({
    status: 'unknown',
    appliedSignature: null,
  });
});

test('records manifest-only runtime drift as pending and successful projection as current', async () => {
  const projectPath = await mkdtemp(path.join(tmpdir(), 'ankhorage-studio-generation-state-'));
  const first = createManifest(['module-a']);
  const second = createManifest(['module-a', 'module-b']);
  await store.writeStudioInclusionAsync(projectPath, false);
  await store.recordRuntimeProjectionCurrentAsync(projectPath, first);

  expect(await store.recordManifestPersistenceAsync(projectPath, second)).toMatchObject({
    status: 'pending',
  });
  expect(await store.recordRuntimeProjectionCurrentAsync(projectPath, second)).toMatchObject({
    status: 'current',
  });
});

test('keeps runtime projection current when only normalized runtime-irrelevant ordering changes', async () => {
  const projectPath = await mkdtemp(path.join(tmpdir(), 'ankhorage-studio-generation-state-'));
  const first = createManifest(['module-b', 'module-a']);
  const second = createManifest(['module-a', 'module-b']);
  await store.writeStudioInclusionAsync(projectPath, true);
  await store.recordRuntimeProjectionCurrentAsync(projectPath, first);

  expect(await store.recordManifestPersistenceAsync(projectPath, second)).toMatchObject({
    status: 'current',
  });
});

test('persists bounded failure evidence until a different runtime fingerprint is persisted', async () => {
  const projectPath = await mkdtemp(path.join(tmpdir(), 'ankhorage-studio-generation-state-'));
  const first = createManifest(['module-a']);
  const second = createManifest(['module-b']);
  await store.writeStudioInclusionAsync(projectPath, true);

  const failed = await store.recordRuntimeProjectionFailureAsync(projectPath, first);
  expect(failed.status).toBe('failed');
  expect(failed.failure?.code).toBe('runtime-projection-failed');
  expect(await store.recordManifestPersistenceAsync(projectPath, first)).toMatchObject({
    status: 'failed',
  });

  const pending = await store.recordManifestPersistenceAsync(projectPath, second);
  expect(pending.status).toBe('pending');
  expect(pending.failure).toBeUndefined();
});

test('manifest persistence remains conservative when generation state is entirely absent', async () => {
  const projectPath = await mkdtemp(path.join(tmpdir(), 'ankhorage-studio-generation-state-'));

  expect(await store.recordManifestPersistenceAsync(projectPath, createManifest())).toMatchObject({
    status: 'unknown',
    appliedSignature: null,
  });
  expect(await captureError(() => store.readStudioInclusionAsync(projectPath))).not.toBeNull();
});

test('rejects invalid generation state instead of inferring projection currency', async () => {
  const projectPath = await mkdtemp(path.join(tmpdir(), 'ankhorage-studio-generation-state-'));
  const statePath = path.join(projectPath, '.ankh/generation-state.json');
  await mkdir(path.dirname(statePath), { recursive: true });
  await writeFile(statePath, JSON.stringify({ includeStudio: 'yes' }), 'utf8');

  const error = await captureError(() => store.readStudioInclusionAsync(projectPath));

  expect(error).not.toBeNull();
  expect(error?.message).toContain('Project generation state is invalid');
});
