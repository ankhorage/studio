name: Finish Studio Infra 5 static migration

on:
  push:
    branches:
      - fix/145-current-infra-consumer
    paths:
      - '.github/workflows/finish-512-static.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-current-infra-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Align Auth 5 repair anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/finish_512_static.py')
          source = path.read_text()
          start = source.index('# StudioInfraUp exposes the canonical runtime provider')
          end = source.index('# Prefer immutable destructuring', start)
          replacement = '''# StudioInfraUp exposes the canonical runtime provider, not the removed target field.
          replace(
              'src/host/smoke/prepareAuth5NativeOAuthSmokeInfra.ts',
              "      if (!result.target) {\\n        throw new Error('Auth 5 smoke infrastructure did not resolve a target.');\\n      }\\n      return { target: result.target };",
              "      return { target: result.runtime };",
          )

          '''
          path.write_text(source[:start] + replacement + source[end:])
          PY
      - run: python .github/scripts/finish_512_static.py
      - run: bun run format
      - name: Validate static migration
        shell: bash
        run: |
          set +e
          bun run build > static-512-report.txt 2>&1
          build_status=$?
          bun run check-types >> static-512-report.txt 2>&1
          type_status=$?
          bun run lint >> static-512-report.txt 2>&1
          lint_status=$?
          bun run knip:check >> static-512-report.txt 2>&1
          knip_status=$?
          echo "build=$build_status types=$type_status lint=$lint_status knip=$knip_status" >> static-512-report.txt
          exit 0
      - name: Commit migration fixes and diagnostics
        shell: bash
        run: |
          rm .github/workflows/finish-512-static.yml
          rm .github/scripts/finish_512_static.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: finalize Studio Infra 5 static migration'
          git push origin HEAD:fix/145-current-infra-consumer
