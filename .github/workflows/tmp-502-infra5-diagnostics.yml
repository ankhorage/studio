name: Diagnose Infra 5 migration

on:
  push:
    branches:
      - fix/502-infra5-project-lifecycle

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/502-infra5-project-lifecycle
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: |
          bun pm cache rm
          bun add '@ankhorage/contracts@^19.1.0' '@ankhorage/infra@^5.1.0' '@ankhorage/navigator@^3.2.5' '@ankhorage/templates@^11.0.3'
      - name: Typecheck migration surface
        run: bun run typecheck
