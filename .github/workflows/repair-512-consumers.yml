name: Repair Studio Infra 5 consumers

on:
  push:
    branches:
      - fix/145-current-infra-consumer
    paths:
      - '.github/workflows/repair-512-consumers.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-current-infra-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: python .github/scripts/repair_512_consumers.py
      - run: bun run format
      - name: Validate repair
        shell: bash
        run: |
          set +e
          bun run build > repair-512-report.txt 2>&1
          build_status=$?
          bun run check-types >> repair-512-report.txt 2>&1
          type_status=$?
          bun run lint >> repair-512-report.txt 2>&1
          lint_status=$?
          bun run knip:check >> repair-512-report.txt 2>&1
          knip_status=$?
          bun run test >> repair-512-report.txt 2>&1
          test_status=$?
          echo "build=$build_status types=$type_status lint=$lint_status knip=$knip_status tests=$test_status" >> repair-512-report.txt
          exit 0
      - name: Commit repair and diagnostics
        shell: bash
        run: |
          rm .github/workflows/repair-512-consumers.yml
          rm .github/scripts/repair_512_consumers.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: finish Studio Infra 5 consumer migration'
          git push origin HEAD:fix/145-current-infra-consumer
