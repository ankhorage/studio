name: Repair Studio Infra 5 consumers

on:
  push:
    branches:
      - fix/145-current-infra-consumer
    paths:
      - '.github/workflows/repair-512-consumers.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/145-current-infra-consumer
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Apply current Infra lifecycle consumer fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              source = target.read_text()
              if old not in source:
                  raise SystemExit(f"missing replacement in {path}: {old[:80]!r}")
              target.write_text(source.replace(old, new))

          # Removed runtime owner: its implementation was already deleted on this branch.
          Path('src/host/orchestrator/infraSession.test.ts').unlink(missing_ok=True)

          # Production lint/type fixes that follow the current Contracts 19 shape.
          replace(
              'src/host/auth/projectAuthRuntimeDiagnostics.ts',
              "export async function observeProjectAuthRuntimeDiagnostics(input: {\n  readonly callbackRoute: string;\n  readonly outputs: readonly InfraOutput[];\n  readonly publicBaseUrl?: string;\n  readonly status: InfraStatus;\n}): Promise<ProjectAuthRuntimeDiagnostics> {",
              "export function observeProjectAuthRuntimeDiagnostics(input: {\n  readonly callbackRoute: string;\n  readonly outputs: readonly InfraOutput[];\n  readonly publicBaseUrl?: string;\n  readonly status: InfraStatus;\n}): ProjectAuthRuntimeDiagnostics {",
          )
          replace(
              'src/host/auth/projectAuthRuntimeDiagnostics.ts',
              "  if (!output || output.visibility !== 'public') return undefined;",
              "  if (output?.visibility !== 'public') return undefined;",
          )
          replace(
              'src/host/media/projectMediaStorage.ts',
              "  if (!output || output.visibility !== 'public') return undefined;",
              "  if (output?.visibility !== 'public') return undefined;",
          )
          replace(
              'src/host/createStudioHost.ts',
              "    async close(): Promise<void> {},",
              "    close: (): void => undefined,",
          )
          replace(
              'src/host/layout/auth/resolveAuthLayoutPlan.ts',
              "  if (auth?.scope !== 'global' || auth.provider !== 'supabase') {",
              "  if (auth?.scope !== 'global') {",
          )
          replace(
              'src/host/orchestrator/projectManager.ts',
              "  if (auth?.scope === 'global' && auth.provider === 'supabase') {",
              "  if (auth?.scope === 'global') {",
          )
          replace(
              'src/host/orchestrator/projectManager.ts',
              "  const usesSupabase = auth?.provider === 'supabase' || database?.provider === 'supabase';",
              "  const usesSupabase = auth !== undefined || database !== undefined;",
          )
          replace(
              'src/ui/admin/pages/adminAuthCredentialFlow.ts',
              "    settings.scope === 'none' &&\n    settings.provider === 'supabase' &&",
              "    settings.scope === 'none' &&",
          )
          replace(
              'src/ui/admin/pages/AuthAdminPage.tsx',
              "    [flushManifest, projectId, refreshHealth, updateAuthSettings],",
              "    [environment, flushManifest, projectId, refreshHealth, updateAuthSettings],",
          )

          # Current provider-neutral runtime diagnostics tests.
          Path('src/host/auth/projectAuthRuntimeDiagnostics.test.ts').write_text(r'''import type { InfraOutput, InfraResourceIdentity, InfraStatus } from '@ankhorage/contracts/infra';
import { describe, expect, test } from 'bun:test';

import {
  observeProjectAuthRuntimeDiagnostics,
  resolveProjectAuthRedirectRuntime,
} from './projectAuthRuntimeDiagnostics';

const owner: InfraResourceIdentity = {
  projectId: 'demo',
  environment: 'local',
  adapter: 'supabase',
  resourceId: 'gateway',
};
const supabaseOutput: InfraOutput = {
  owner,
  name: 'url',
  visibility: 'public',
  value: 'http://127.0.0.1:54321',
  environmentVariable: 'EXPO_PUBLIC_SUPABASE_URL',
};

function createStatus(state: InfraStatus['state']): InfraStatus {
  return { projectId: 'demo', environment: 'local', state, resources: [] };
}

describe('resolveProjectAuthRedirectRuntime', () => {
  test('derives provider and public app callbacks from provider-neutral outputs', () => {
    const runtime = resolveProjectAuthRedirectRuntime({
      callbackRoute: '/auth/callback',
      outputs: [supabaseOutput],
      publicBaseUrl: 'https://example.com',
    });

    expect(runtime.providerRedirectUrl).toBe('http://127.0.0.1:54321/auth/v1/callback');
    expect(runtime.appCallbackTargets).toEqual(['https://example.com/auth/callback']);
    expect(runtime.redirectAllowList).toEqual([
      'https://example.com/',
      'https://example.com/auth/callback',
    ]);
  });

  test('keeps application callback targets empty without authored public networking intent', () => {
    const runtime = resolveProjectAuthRedirectRuntime({
      callbackRoute: '/auth/callback',
      outputs: [supabaseOutput],
    });

    expect(runtime.providerRedirectUrl).toBe('http://127.0.0.1:54321/auth/v1/callback');
    expect(runtime.appCallbackTargets).toEqual([]);
    expect(runtime.redirectAllowList).toEqual([]);
  });

  test('rejects diagnostics when the public Supabase output is absent', () => {
    expect(() =>
      resolveProjectAuthRedirectRuntime({ callbackRoute: '/auth/callback', outputs: [] }),
    ).toThrow('EXPO_PUBLIC_SUPABASE_URL');
  });
});

describe('observeProjectAuthRuntimeDiagnostics', () => {
  test('maps provider-neutral ready state without parsing provider scripts', () => {
    expect(
      observeProjectAuthRuntimeDiagnostics({
        callbackRoute: '/auth/callback',
        outputs: [supabaseOutput],
        publicBaseUrl: 'https://example.com',
        status: createStatus('ready'),
      }).rolloutStatus,
    ).toBe('ready');
  });

  test('maps absent and failed runtime state conservatively', () => {
    expect(
      observeProjectAuthRuntimeDiagnostics({
        callbackRoute: '/auth/callback',
        outputs: [supabaseOutput],
        status: createStatus('absent'),
      }).rolloutStatus,
    ).toBe('not-generated');
    expect(
      observeProjectAuthRuntimeDiagnostics({
        callbackRoute: '/auth/callback',
        outputs: [supabaseOutput],
        status: createStatus('failed'),
      }).rolloutStatus,
    ).toBe('not-ready');
  });
});
''')

          # Runtime HTTP route now delegates only to ProjectManager.upInfrastructure.
          Path('src/host/http/projectRuntimeRoutes.test.ts').write_text(r'''import { afterEach, describe, expect, test } from 'bun:test';
import Fastify, { type FastifyInstance } from 'fastify';

import { registerProjectRuntimeRoutes } from './projectRuntimeRoutes';

const servers: FastifyInstance[] = [];
const ledger = {
  schemaVersion: 1 as const,
  projectId: 'project-one',
  environment: 'local' as const,
  targets: [],
  resources: [],
  outputs: [],
  artifacts: [],
};

afterEach(async () => {
  await Promise.all(servers.splice(0).map((server) => server.close()));
});

describe('project runtime HTTP adapter', () => {
  test('reconciles through the provider-neutral ProjectManager lifecycle', async () => {
    const calls: string[] = [];
    const server = Fastify({ logger: false });
    registerProjectRuntimeRoutes(server, {
      workspaceRoot: '/workspace',
      projectManager: {
        upInfrastructure: (projectId) => {
          calls.push(projectId);
          return Promise.resolve({
            environment: 'local',
            targets: [],
            resources: [],
            outputs: [],
            ledger,
          });
        },
      },
    });
    servers.push(server);

    const response = await server.inject({
      method: 'POST',
      url: '/api/projects/project-one/infra/runtime/ensure',
    });

    expect(response.statusCode).toBe(200);
    expect(calls).toEqual(['project-one']);
    expect(JSON.parse(response.body) as unknown).toEqual({
      success: true,
      reconciled: {
        environment: 'local',
        targets: [],
        resources: [],
        outputs: [],
        ledger,
      },
    });
  });

  test('returns a bounded error for lifecycle failures', async () => {
    const server = Fastify({ logger: false });
    registerProjectRuntimeRoutes(server, {
      workspaceRoot: '/workspace',
      projectManager: {
        upInfrastructure: () => Promise.reject(new Error('runtime unavailable')),
      },
    });
    servers.push(server);

    const response = await server.inject({
      method: 'POST',
      url: '/api/projects/project-one/infra/runtime/ensure',
    });

    expect(response.statusCode).toBe(500);
    expect(JSON.parse(response.body) as unknown).toEqual({ error: 'runtime unavailable' });
  });
});
''')

          # Studio's E2E boundary proves the full current lifecycle without removed script/port-forward APIs.
          Path('src/host/studioInfra.e2e.test.ts').write_text(r'''import { mkdir, mkdtemp, rm, writeFile } from 'node:fs/promises';
import { tmpdir } from 'node:os';
import path from 'node:path';

import type { AppManifest } from '@ankhorage/contracts';
import type { InfraLedger } from '@ankhorage/contracts/infra';
import { expect, test } from 'bun:test';

import { ProjectManager } from './orchestrator/projectManager';

const infraE2eTest = process.env.ANKH_STUDIO_INFRA_E2E === '1' ? test : test.skip;
type ProjectManagerDependencies = NonNullable<ConstructorParameters<typeof ProjectManager>[1]>;
type InfraLifecycle = NonNullable<ProjectManagerDependencies['infraLifecycle']>;

infraE2eTest('delegates the complete project lifecycle through the provider-neutral Infra owner', async () => {
  const workspaceRoot = await mkdtemp(path.join(tmpdir(), 'ankh-studio-infra-e2e-'));
  const projectId = 'studio-e2e';
  const projectPath = path.join(workspaceRoot, 'apps', projectId);
  const calls: string[] = [];
  const ledger = createLedger(projectId);
  const lifecycle: InfraLifecycle = {
    generateAsync: (request) => {
      calls.push(`generate:${request.projectId}`);
      return Promise.resolve({ environment: 'local', artifacts: [], ledger });
    },
    upAsync: (request) => {
      calls.push(`up:${request.projectId}`);
      return Promise.resolve({
        environment: 'local',
        targets: [],
        resources: [],
        outputs: [],
        ledger,
      });
    },
    statusAsync: (request) => {
      calls.push(`status:${request.projectId}`);
      return Promise.resolve({
        projectId: request.projectId,
        environment: 'local',
        state: 'ready',
        resources: [],
      });
    },
    outputsAsync: (request) => {
      calls.push(`outputs:${request.projectId}`);
      return Promise.resolve({ environment: 'local', outputs: [] });
    },
    downAsync: (request) => {
      calls.push(`down:${request.projectId}`);
      return Promise.resolve({ environment: 'local', ledger });
    },
    destroyAsync: (request) => {
      calls.push(`destroy:${request.projectId}:${request.deletePersistentResources}`);
      return Promise.resolve({ environment: 'local', ledger: null });
    },
  };

  try {
    await mkdir(projectPath, { recursive: true });
    await writeFile(path.join(projectPath, 'package.json'), JSON.stringify({ name: '@e2e/app' }));
    await writeFile(path.join(projectPath, 'ankh.config.json'), JSON.stringify(createManifest(projectId)));
    const manager = new ProjectManager(workspaceRoot, { infraLifecycle: lifecycle });

    await manager.regenerateInfrastructure(projectId);
    await manager.upInfrastructure(projectId);
    expect((await manager.getInfrastructureStatus(projectId)).state).toBe('ready');
    expect((await manager.getInfrastructureOutputs(projectId)).outputs).toEqual([]);
    await manager.downInfrastructure(projectId);
    await manager.destroyInfrastructure(projectId, true);

    expect(calls).toEqual([
      'generate:studio-e2e',
      'up:studio-e2e',
      'status:studio-e2e',
      'outputs:studio-e2e',
      'down:studio-e2e',
      'destroy:studio-e2e:true',
    ]);
  } finally {
    await rm(workspaceRoot, { recursive: true, force: true });
  }
});

function createLedger(projectId: string): InfraLedger {
  return {
    schemaVersion: 1,
    projectId,
    environment: 'local',
    targets: [],
    resources: [],
    outputs: [],
    artifacts: [],
  };
}

function createManifest(projectId: string): AppManifest {
  return {
    metadata: {
      name: projectId,
      slug: projectId,
      version: '1.0.0',
      category: 'developer_tools',
      themeId: 'default',
    },
    settings: { localization: { defaultLocale: 'en', locales: ['en'] } },
    infra: {
      environments: {
        local: {
          deployment: {
            compute: { provider: 'local' },
            runtime: { provider: 'minikube' },
          },
        },
      },
      modules: [],
    },
    navigator: { type: 'stack', routes: [] },
    screens: {},
    themes: [],
    activeThemeId: 'default',
  };
}
''')

          # This acceptance no longer assumes that Infra owns/serves the generated Expo app.
          Path('src/host/expo57GeneratedProductionInfra.e2e.test.ts').write_text(r'''import { mkdir, mkdtemp, rm, writeFile } from 'node:fs/promises';
import path from 'node:path';

import { expect, test } from 'bun:test';

import { ProjectManager } from './orchestrator/projectManager';
import { createSmokeProjectSource } from './smoke/createSmokeProjectSource';

const COMMAND_TIMEOUT_MS = 1_800_000;
const productionInfraTest = process.env.ANKH_STUDIO_EXPO57_INFRA_E2E === '1' ? test : test.skip;

productionInfraTest(
  'generates an Expo 57 app and reconciles its backend through the provider-neutral Infra lifecycle',
  async () => {
    assertNode24();
    const workspaceRoot = await mkdtemp(path.join('/tmp', 'ankh-expo57-production-infra-'));
    const manager = new ProjectManager(workspaceRoot);
    let projectId: string | null = null;

    try {
      await mkdir(path.join(workspaceRoot, 'apps'), { recursive: true });
      await writeFile(
        path.join(workspaceRoot, 'package.json'),
        JSON.stringify({
          name: '@ankhorage/expo57-production-infra-acceptance',
          packageManager: 'bun@1.4.2',
          private: true,
        }),
      );
      const created = await manager.createProject(
        'Expo 57 Production Infra',
        createSmokeProjectSource(),
        undefined,
        { includeStudio: false },
      );
      projectId = created.id;

      const up = await manager.upInfrastructure(created.id);
      expect(up.environment).toBe('local');
      expect((await manager.getInfrastructureStatus(created.id)).environment).toBe('local');
      expect((await manager.getInfrastructureOutputs(created.id)).environment).toBe('local');
      expect((await manager.downInfrastructure(created.id)).environment).toBe('local');
      expect((await manager.upInfrastructure(created.id)).environment).toBe('local');
    } finally {
      if (projectId) {
        await manager.destroyInfrastructure(projectId, true).catch(() => undefined);
      }
      await rm(workspaceRoot, { force: true, recursive: true });
    }
  },
  COMMAND_TIMEOUT_MS,
);

function assertNode24(): void {
  if (!process.version.startsWith('v24.')) {
    throw new Error(`Node 24 LTS is required; received ${process.version}.`);
  }
}
''')

